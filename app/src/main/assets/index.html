<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0b09">
<title>✈ Aviation English Trainer</title>
<style>
:root{
  --bg:#0c0b09;--side:#14120e;--card:#1c1913;--card2:#2a251a;--border:#4a4129;
  --accent:#ffb000;--accent_h:#d99400;--green:#5fe08a;--green_bg:#12301c;
  --red:#ff5f4a;--red_bg:#3a1712;--gold:#ffd24a;--text:#fff4d6;--muted:#b3a67f;
  --violet:#c792ff;--orange:#ff7a29;--teal:#3dd6c0;--opt:#221e15;--badge:#4a4129;
  --heart_off:#473f2a;--on_color:#1a1405;--brown:#b4491b;--danger:#c0262d;
  --nrfi:#ff5f4a;--rfi:#ffd24a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100%;overflow-x:hidden;}
body{display:flex;flex-direction:column;padding-bottom:68px;}
button,input,select{font-family:inherit;}
.topbar{position:sticky;top:0;z-index:30;background:var(--side);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px;}
.icon-btn{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;min-width:40px;height:40px;font-size:18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;}
.top-title{font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lv-pill{background:var(--card2);border:1px solid var(--border);color:var(--gold);font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;}
#main{flex:1;padding:14px;max-width:860px;width:100%;margin:0 auto;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--side);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding-bottom:env(safe-area-inset-bottom);}
.bnav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;cursor:pointer;}
.bnav button .bi{font-size:20px;line-height:1.1;}
.bnav button.active{color:var(--accent);}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;}
.drawer-bg.open{display:block;}
.drawer{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82vw;background:var(--side);border-right:1px solid var(--border);z-index:55;transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto;padding:16px 12px 30px;}
.drawer.open{transform:translateX(0);}
.drawer h2{margin:6px 10px 2px;font-size:19px;}
.drawer .sub{margin:0 10px 14px;font-size:12px;color:var(--accent);font-weight:800;letter-spacing:1px;}
.nav-item{width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:11px 12px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:3px;}
.nav-item.active{background:var(--accent);color:var(--on_color);}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;}
.card.b-gold{border-color:var(--gold);}.card.b-teal{border-color:var(--teal);}.card.b-violet{border-color:var(--violet);}.card.b-green{border-color:var(--green);}.card.b-red{border-color:var(--red);}.card.b-orange{border-color:var(--orange);}.card.b-accent{border-color:var(--accent);}
.h1{font-size:22px;font-weight:800;margin:0 0 4px;}
.h2{font-size:17px;font-weight:800;margin:0 0 8px;}
.muted{color:var(--muted);font-size:13px;line-height:1.45;}
.pbar{width:100%;height:11px;background:var(--card2);border-radius:999px;overflow:hidden;margin:6px 0;}
.pbar>div{height:100%;background:var(--gold);border-radius:999px;transition:width .3s ease;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:600px){.grid4{grid-template-columns:repeat(4,1fr);}}
.tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
.tile .big{font-size:22px;font-weight:800;margin:2px 0;}
.btn{border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on_color);min-height:46px;}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.green{background:var(--green);color:var(--on_color);}
.btn.red{background:var(--danger);color:#fff;}
.btn.violet{background:var(--violet);color:var(--on_color);}
.btn.teal{background:var(--teal);color:var(--on_color);}
.btn.orange{background:var(--orange);color:var(--on_color);}
.btn.brown{background:var(--brown);color:#fff;}
.btn.full{width:100%;}
.btn.sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.chip{background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:11px;padding:9px 11px;font-size:13px;font-weight:700;cursor:pointer;text-align:left;}
.chip.on{background:var(--accent);color:var(--on_color);border-color:var(--accent);}
.opt{width:100%;display:flex;align-items:flex-start;gap:10px;background:var(--opt);border:2px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--text);font-size:15px;line-height:1.4;}
.opt .ltr{min-width:32px;height:32px;border-radius:9px;background:var(--badge);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
.opt.correct{background:var(--green_bg);border-color:var(--green);}
.opt.correct .ltr{background:var(--green);color:var(--on_color);}
.opt.wrong{background:var(--red_bg);border-color:var(--red);}
.opt.wrong .ltr{background:var(--red);color:#fff;}
.opt.picked{background:var(--card2);border-color:var(--accent);}
.opt.picked .ltr{background:var(--accent);color:var(--on_color);}
.opt.dim{opacity:.55;}
.opt.removed{opacity:.22;pointer-events:none;}
.ctx-box{background:var(--card2);border-radius:12px;padding:12px;font-size:14px;line-height:1.55;margin-bottom:10px;white-space:pre-line;}
.tag{display:inline-block;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:800;color:var(--on_color);}
.fb-pre{white-space:pre-line;font-size:14px;line-height:1.5;margin-top:6px;}
.flashcard{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;border-radius:20px;background:var(--card);border:2px solid var(--border);cursor:pointer;user-select:none;}
.flashcard.flipped{border-color:var(--accent);}
.fc-main{font-size:32px;font-weight:800;word-break:break-word;}
.fc-sub{font-size:16px;color:var(--muted);margin-top:10px;}
.input{background:var(--card2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.seg button.on{background:var(--accent);color:var(--on_color);}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:15px;line-height:1.6;}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:90;background:var(--gold);color:var(--on_color);padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.45);max-width:92vw;text-align:center;animation:fadein .2s;}
@keyframes fadein{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
.table-wrap{overflow-x:auto;}
table.gtbl{width:100%;border-collapse:collapse;font-size:13px;}
table.gtbl th,table.gtbl td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top;}
table.gtbl th{color:var(--gold);}
.kbd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.kbd-grid button{height:40px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-weight:800;font-size:15px;cursor:pointer;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:16px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;}
.bar-row .lbl{width:128px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .val{width:78px;text-align:right;color:var(--muted);font-size:12px;flex-shrink:0;}
.day-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:14px;}
.day-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;}
.day-fill{width:100%;border-radius:5px 5px 0 0;min-height:3px;}
.day-lbl{font-size:9px;color:var(--muted);}
.pace-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--border);}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;font-weight:600;}
.switch-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;}
.range-in{width:100%;accent-color:var(--accent);height:24px;cursor:pointer;}
.sec-title{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px;}
.svg-chart{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>
  <div class="top-title" id="topTitle">✈ Aviation English</div>
  <button class="icon-btn" id="syncTopBtn" title="PC ile Eşitle" style="font-size:15px;min-width:36px;height:36px;">☁️</button>
  <div class="lv-pill" id="lvPill">Lv 1</div>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer">

  <div id="drawerNav"></div>

<main id="main"></main>

</div>

ive", "Twenty-One Seven Twenty Twenty-Five", "Two One Seven Two Zero Two Five"], "correct": "Twenty-One July Two Zero Two Five", "explanation": "Gün – ay adı – yıl rakam rakam.", "why": {}}, {"key": "How is \"1500 hours\" read?|", "category": "ICAO & Sayılar", "source": "", "type": "vocab", "question": "How is \"1500 hours\" read?", "context": "", "options": ["Fifteen hundred hours", "One Five Zero Zero hours", "One thousand five hundred", "Fife Zero Zero"], "correct": "One Five Zero Zero hours", "explanation": "Kursta rakamlar tek tek okunur: One Five Zero Zero.", "why": {}}, {"key": "Why is the ICAO phonetic alphabet used?|", "category": "ICAO & Sayılar", "source": "", "type": "vocab", "question": "Why is the ICAO phonetic alphabet used?", "context": "", "options": ["To make messages longer", "To avoid confusion in noisy/radio communication", "To replace the AMM", "To shorten maintenance logs"], "correct": "To avoid confusion in noisy/radio communication", "explanation": "Gürültülü ortamda ve telsizde karışıklığı önlemek için.", "why": {}}, {"key": "Which of these is NOT an ICAO phonetic word?|", "category": "ICAO & Sayılar", "source": "", "type": "vocab", "question": "Which of these is NOT an ICAO phonetic word?", "context": "", "options": ["Golf", "Hotel", "Lemon", "Mike"], "correct": "Lemon", "explanation": "L = Lima. 'Lemon' ICAO kelimesi değildir.", "why": {}}, {"key": "Which ICAO word represents \"W\"?|", "category": "ICAO & Sayılar", "source": "", "type": "vocab", "question": "Which ICAO word represents \"W\"?", "context": "", "options": ["Whiskey", "Winner", "Washington", "Whisper"], "correct": "Whiskey", "explanation": "W = Whiskey.", "why": {}}, {"key": "Which letter is \"X-ray\"?|", "category": "ICAO & Sayılar", "source": "", "type": "vocab", "question": "Which letter is \"X-ray\"?", "context": "", "options": ["Z", "Y", "X", "V"], "correct": "X", "explanation": "X = X-ray, Y = Yankee, Z = Zulu.", "why": {}}, {"key": "What is an actuator?|", "category": nları", "source": "", "type": "grammar", "question": "She hasn't submitted the maintenance report ______.", "context": "", "options": ["already", "just", "yet", "ever"], "correct": "yet", "explanation": "Olumsuzda 'yet' (henüz).", "why": {"already": "already olumlu cümlede 'çoktan' demek; hasn't ile kullanılmaz.", "just": "just 'az önce' demektir; olumsuz cümlede 'henüz' için yet.", "ever": "ever 'hiç' anlamında deneyim sorularında kullanılır."}}, {"key": "They have ______ fueled the aircraft.|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "They have ______ fueled the aircraft.", "context": "", "options": ["yet", "already", "ever", "never"], "correct": "already", "explanation": "already = çoktan.", "why": {"yet": "yet olumsuz/soru cümlesinin sonuna gelir; olumlu cümlede 'çoktan' = already.", "ever": "ever deneyim sorusunda kullanılır; 'çoktan' anlamı vermez.", "never": "never olumsuz anlam katar ('hiç yakıt doldurmadılar')."}}, {"key": "______ you ever seen a bird strike?|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "______ you ever seen a bird strike?", "context": "", "options": ["Did", "Have", "Had", "Are"], "correct": "Have", "explanation": "Deneyim sorusu: Have you ever + V3?", "why": {"Did": "Did belirli geçmiş zaman ister (yesterday gibi); ever ile deneyim sorusu → Have you ever + V3.", "Had": "Had Past Perfect'tir; deneyim sorusu Present Perfect ister.", "Are": "Are + V3 edilgen olur; deneyim için Have you ever seen."}}, {"key": "The flight had taken off before the technician noticed the error. Which action happened first?|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "The flight had taken off before the technician noticed the error. Which action happened first?", "context": "", "options": ["The technician noticed the error", "The flight took off", "Both at the same time", "Unknown"], "correct": "The flight took off", "explanation": "Past Perfect (had taken off) da airing the engine for three hours before the supervisor arrived. This is:|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "The mechanic had been repairing the engine for three hours before the supervisor arrived. This is:", "context": "", "options": ["Past Perfect Continuous", "Present Perfect Continuous", "Past Continuous", "Past Perfect"], "correct": "Past Perfect Continuous", "explanation": "had been + V-ing.", "why": {"Present Perfect Continuous": "have/has been + V-ing olur; burada had been ve geçmişteki 'before… arrived' var.", "Past Continuous": "Past Continuous was/were + V-ing'dir; had been yok.", "Past Perfect": "Past Perfect had + V3'tür; burada 'been repairing' sürekliliği var."}}, {"key": "Which structure is used for a plan/intention in the future?|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "Which structure is used for a plan/intention in the future?", "context": "", "options": ["will + V1", "am/is/are going to + V1", "have + V3", "was + V-ing"], "correct": "am/is/are going to + V1", "explanation": "Planlı eylemler için be going to.", "why": {"will + V1": "will anlık karar/tahmin içindir; önceden yapılan plan için be going to.", "have + V3": "Present Perfect geçmişle bağlantılı bitmiş işi anlatır, plan değil.", "was + V-ing": "Past Continuous geçmişte süren eylemdir."}}, {"key": "\"I have completed the task.\" Turkish meaning?|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "\"I have completed the task.\" Turkish meaning?", "context": "", "options": ["Görevi tamamladım.", "Görevi tamamlayacağım.", "Görevi tamamlıyorum.", "Görevi tamamlamıştım."], "correct": "Görevi tamamladım.", "explanation": "Present Perfect: tamamladım.", "why": {}}, {"key": "In technical writing, which tense is generally used for completed work?|", "category": "Fiil Zamanları", "source": "", "type": "grammar", "question": "In technical writing, which tense is generally used for completed work?", "context": "", "options": ["Past simple", "Future simple", "Present continuous", "Present simple"], "correct": "Past simple", "explanation": "Teknik yazımda genelde past simple kullanılır.", "why": {}}, {"key": "Technicians ______ wear gloves. (strong obligation)|", "category": "Modal Fiiller", "source": "", "type": "grammar", "question": "Technicians ______ wear gloves. (strong obligation)", "context": "", "options": ["must", "can", "may", "might"], "correct": "must", "explanation": "must = zorunluluk.", "why": {"can": "can yetenek/izin bildirir, zorunluluk değil.", "may": "may izin/olasılık bildirir; güçlü zorunluluk için must.", "might": "might zayıf olasılıktır, zorunluluk değil."}}, {"key": "You ______ report any defect. (advice)|", "category": "Modal Fiiller", "source": "", "type": "grammar", "question": "You ______ report any defect. (advice)", "context": "", "options": ["should", "mustn't", "can't", "would"], "correct": "should", "explanation": "should = tavsiye.", "why": {"mustn't": "mustn't yasaktır; tavsiye değil.", "can't": "can't 'yapamaz/izin yok' demektir.", "would": "would koşul/nazik istek içindir; tavsiye için should."}}, {"key": "This fault ______ cause a delay. (possibility)|", "category": "Modal Fiiller", "source": "", "type": "grammar", "question": "This fault ______ cause a delay. (possibility)", "context": "", "options": ["must", "may", "shall", "need"], "correct": "may", "explanation": "may = olasılık.", "why": {"must": "must zorunluluk veya kesin çıkarım bildirir; olasılık için may.", "shall": "shall öneri ('Shall I…?') veya resmi zorunluluk bildirir.", "need": "need gereklilik bildirir, olasılık değil."}}, {"key": "You ______ smoke near the aircraft. (prohibition)|", "category": "Modal Fiiller", "source": "", "type": "grammar", "question": "You ______ smoke near the aircraft. (prohibition)", "context": "", "options": ["don't have to", "mustn't", "shouldn't have", "can"], "correct": "mustn't", "explanation": "mustn't = yasak.", "why" ment", "No Repair Found Inside"], "correct": "Not Ready for Installation", "explanation": "NRFI = Not Ready For Installation (takmaya hazır değil); kırmızı etiket uygun değil anlamı taşır.", "why": {}}, {"key": "Which of the following tasks is classified as \"Unscheduled Maintenance\" (Plansız Bakım)?|", "category": "Bakım Prosedürleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which of the following tasks is classified as \"Unscheduled Maintenance\" (Plansız Bakım)?", "context": "", "options": ["Performing a routine 400 Flight Hour inspection", "Carrying out a scheduled A-Check", "Repairing radome damage after an unexpected bird strike", "Performing the daily pre-flight check"], "correct": "Repairing radome damage after an unexpected bird strike", "explanation": "Kuş çarpması beklenmedik hasardır → plansız bakım; A-Check/rutin kontroller planlıdır.", "why": {}}, {"key": "Which optical instrument is inserted through an access port to visually inspect internal engine compressor blades without disassembling the engine?|", "category": "Parça & Alet Kelimeleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which optical instrument is inserted through an access port to visually inspect internal engine compressor blades without disassembling the engine?", "context": "", "options": ["Caliper", "Borescope", "Torque wrench", "Pitot cover"], "correct": "Borescope", "explanation": "Borescope = motor içini sökmeden görsel muayene için optik alet.", "why": {}}, {"key": "What is the purpose of using \"safety wire pliers\" during aircraft maintenance?|", "category": "Parça & Alet Kelimeleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "What is the purpose of using \"safety wire pliers\" during aircraft maintenance?", "context": "", "options": ["To measure the thickness of brake pads", "To twist and apply locking wire on bolts or electrical connectors so they cannot loosen due to vibration", "To lift the aircraft off the ground during tire changes", "To strip insulation from high-voltage cables"], "correct": "To twist and apply locking wire on bolts or electrical connectors so they cannot loosen due to vibration", "explanation": "Safety wire pliers = cıvata/konektörlere emniyet teli sararak titreşimle gevşemeyi önler.", "why": {}}, {"key": "In aviation safety terminology, what is the exact difference between a \"Hazard\" and a \"Risk\"?|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM Deneme-1", "type": "vocab", "question": "In aviation safety terminology, what is the exact difference between a \"Hazard\" and a \"Risk\"?", "context": "", "options": ["A hazard is personal protective equipment, while risk is a safety briefing.", "A hazard is a potential source of harm, while risk is the likelihood or chance that the hazard will actually cause harm.", "A hazard only occurs during flight, while risk only occurs in the hangar.", "There is no difference; both terms mean an completed accident."], "correct": "A hazard is a potential source of harm, while risk is the likelihood or chance that the hazard will actually cause harm.", "explanation": "Hazard = zarar kaynağı; Risk = bu zararın gerçekleşme olasılığı/şiddeti.", "why": {}}, {"key": "Before working on high-voltage avionics cooling fans, the technician pulled the circuit breaker, attached a red \"DO NOT OPERATE\" placard, and locked it. What is this safety procedure called?|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM Deneme-1", "type": "vocab", "question": "Before working on high-voltage avionics cooling fans, the technician pulled the circuit breaker, attached a red \"DO NOT OPERATE\" placard, and locked it. What is this safety procedure called?", "context": "", "options": ["Visual Inspection", "Lockout / Tagout", "Functional Test", "Duplicate Check"], "correct": "Lockout / Tagout", "explanation": "Devre kesiciyi çekip etiketleyip kilitleme = Lockout/Tagout.", "why": {}}, {"key": "An experienced mechanic has performed the same daily inspection hundreds of times. Feeling overconfident, he skips reading the job card and misses a critical step. Which Human Factor is this?|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM Deneme-1", "type": "vocab", "question": "An experienced mechanic has performed the same daily inspection hundreds of times. Feeling overconfident, he skips reading the job card and misses a critical step. Which Human Factor is this?", "context": "", "options": ["Fatigue", "Complacency", "Time pressure", "Noise distraction"], "correct": "Complacency", "explanation": "Aşırı özgüven yüzünden prosedürü atlamak = complacency (rehavet).", "why": {}}, {"key": "A technician has been working for 12 hours on a night shift without proper rest, causing reduced alertness and a forgotten tool inside the cowling. This error is primarily caused by _______.|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM Deneme-1", "type": "vocab", "question": "A technician has been working for 12 hours on a night shift without proper rest, causing reduced alertness and a forgotten tool inside the cowling. This error is primarily caused by _______.", "context": "", "options": ["complacency", "fatigue", "lack of tools", "clear communication"], "correct": "fatigue", "explanation": "12 saat dinlenmeden çalışma → fatigue (yorgunluk).", "why": {}}, {"key": "In the Aircraft Maintenance Manual (AMM), which safety alert word indicates a potentially hazardous situation that, if not avoided, could result in SERIOUS INJURY or DEATH?|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM Deneme-1", "type": "vocab", "question": "In the Aircraft Maintenance Manual (AMM), which safety alert word indicates a potentially hazardous situation that, if not avoided, could result in SERIOUS INJURY or DEATH?", "context": "", "options": ["NOTICE", "CAUTION", "WARNING", "NOTE"], "correct": "WARNING", "explanation": "WARNING = ciddi yaralanma/ölüm riski; CAUTION = ekipman hasarı; NOTE = bilgi.", "why": {}}, {"key": "Which Personal Protective Equipment (PPE) is mandatory when sanding composite materials or working in areas with heavy fuel vapors?|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which Personal Protective Equipment (PPE) is mandatory when sanding composite materials or working in areas with heavy fuel vapors?", "context": "", "options": ["Ear plugs", "Safety shoes", "Respirator mask", "Hard hat"], "correct": "Respirator mask", "explanation": "Kompozit zımparalama/yakıt buharı → respirator mask (solunum maskesi).", "why": {}}, {"key": "If the Built-In Test Equipment (BITE) gives a different maintenance message, you can find the _______ troubleshooting procedure in the applicable Fault Isolation Manual.|", "category": "Dokümantasyon", "source": "SHGM Deneme-1", "type": "gap", "question": "If the Built-In Test Equipment (BITE) gives a different maintenance message, you can find the _______ troubleshooting procedure in the applicable Fault Isolation Manual.", "context": "", "options": ["refresh", "revoked", "related", "resigned", "refused"], "correct": "related", "explanation": "'related troubleshooting procedure' = ilgili arıza giderme prosedürü. 'related' = ilgili.", "why": {}}, {"key": "Which major aircraft system uses high-pressure bleed air to operate air conditioning packs, cabin pressurization, and engine starting?|", "category": "Uçak Sistemleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which major aircraft system uses high-pressure bleed air to operate air conditioning packs, cabin pressurization, and engine starting?", "context": "", "options": ["Hydraulic System", "Pneumatic System", "Fuel System", "Flight Control System"], "correct": "Pneumatic System", "explanation": "Pnömatik sistem: bleed air ile klima, basınçlandırma ve motor çalıştırma.", "why": {}}, {"key": "In the aircraft's electrical system, what is the specific function of a \"Static Inverter\"?|", "category": "Uçak Sistemleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "In the aircraft's electrical system, what is the specific function of a \"Static Inverter\"?", "context": "", "options": ["It converts hydraulic pressure into mechanical movement.", "It converts Direct Current (DC) power from the battery into Alternating Current (AC) power.", "It regulates the cabin altitude by releasing air overboard.", "It pressurizes fuel from the wing tanks to the engine manifold."], "correct": "It converts Direct Current (DC) power from the battery into Alternating Current (AC) power.", "explanation": "Static inverter: DC (akü) gücünü AC'ye çevirir.", "why": {}}, {"key": "Which flight control surface is located on the outer trailing edge of the wings and controls the \"roll\" movement (tilting of the wings) of the aircraft?|", "category": "Uçak Sistemleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which flight control surface is located on the outer trailing edge of the wings and controls the \"roll\" movement (tilting of the wings) of the aircraft?", "context": "", "options": ["Rudder", "Elevator", "Aileron", "Nacelle"], "correct": "Aileron", "explanation": "Aileron = kanat dış arka kenarı, roll (yatış) kontrolü. Rudder = yaw, Elevator = pitch.", "why": {}}, {"key": "Which component of the Environmental Control System (ECS) automatically regulates cabin pressure by opening and closing to release air overboard?|", "category": "Uçak Sistemleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which component of the Environmental Control System (ECS) automatically regulates cabin pressure by opening and closing to release air overboard?", "context": "", "options": ["Fuel Booster Pump", "Outflow Valve", "Generator", "Jack Pad"], "correct": "Outflow Valve", "explanation": "Outflow valve kabin havasını dışarı bırakarak basıncı düzenler.", "why": {}}, {"key": "When reading an aircraft system diagram, the directional terms \"Port\" and \"Starboard\" refer to _______ respectively.|", "category": "Uçak Sistemleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "When reading an aircraft system diagram, the directional terms \"Port\" and \"Starboard\" refer to _______ respectively.", "context": "", "options": ["Nose and Tail of the aircraft", "Upper and Lower fuselage", "Left side and Right side of the aircraft", "Supply line and Return line"], "correct": "Left side and Right side of the aircraft", "explanation": "Port = sol, Starboard = sağ. (Port = left, 4 harf ↔ left 4 harf diye ezberle.)", "why": {}}, {"key": "The AMM instruction reads: \"Install the new pressure transmitter on the hydraulic return line downstream of the filter.\" What does \"downstream\" mean?|", "category": "Uçak Sistemleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "The AMM instruction reads: \"Install the new pressure transmitter on the hydraulic return line downstream of the filter.\" What does \"downstream\" mean?", "context": "", "options": ["Against the direction of fluid flow (before the filter)", "In the direction of fluid flow (after the fluid passes through the filter)", "Inside the cockpit overhead panel", "Underneath the main landing gear doors"], "correct": "In the direction of fluid flow (after the fluid passes through the filter)", "explanation": "Downstream = akış yönünde, filtreden SONRA.", "why": {}}, {"key": "During a wiring harness inspection in the wheel well, the technician noted \"chafing\" on the anti- skid cable. What is \"chafing\"?|", "category": "Teknik İletişim", "source": "SHGM Deneme-1", "type": "vocab", "question": "During a wiring harness inspection in the wheel well, the technician noted \"chafing\" on the anti- skid cable. What is \"chafing\"?", "context": "", "options": ["Complete melting of the wire due to lightning strike", "Damage or wear caused by two parts rubbing against each other", "Proper alignment of electrical pins inside a connector", "Application of anti-corrosion primer on metal surfaces"], "correct": "Damage or wear caused by two parts rubbing against each other", "explanation": "Chafing = iki parçanın birbirine sürtmesiyle oluşan aşınma/hasar.", "why": {}}, {"key": "Which of the following maintenance logbook entries is written in the most professional, objective, and standard technical English style?|", "category": "Teknik İletişim", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which of the following maintenance logbook entries is written in the most professional, objective, and standard technical English style?", "context": "", "options": ["We saw a fuel thing leaking under the wing and put a new part, it looks okay now.", "Fuel leak observed at RH wing root coupling. Replaced coupling (P/N 887722) IAW AMM 28-10-00. Leak check satisfactory.", "The fuel connector seems broken so I am replacing it tomorrow morning.", "There was some fuel dropping on the floor and we fixed it quickly without manual."], "correct": "Fuel leak observed at RH wing root coupling. Replaced coupling (P/N 887722) IAW AMM 28-10-00. Leak check satisfactory.", "explanation": "Log girişi kısa, nesnel, pasif/kısaltmalı olmalı: tespit + işlem + referans (IAW AMM) + sonuç.", "why": {}}, {"key": "When an airframe or engine manufacturer recommends a modification or an improved inspection procedure, they issue a document called a _______.|", "category": "Dokümantasyon", "source": "SHGM Deneme-1", "type": "vocab", "question": "When an airframe or engine manufacturer recommends a modification or an improved inspection procedure, they issue a document called a _______.", "context": "", "options": ["Minimum Equipment List (MEL)", "Service Bulletin (SB)", "Certificate of Release to Service (CRS)", "Airworthiness Review Certificate (ARC)"], "correct": "Service Bulletin (SB)", "explanation": "Service Bulletin (SB) = üretici önerisi (tavsiye); AD zorunludur.", "why": {}}, {"key": "Which document is issued by an aviation authority (such as EASA, FAA, or SHGM) to mandate compulsory corrective actions for an unsafe condition on an aircraft?|", "category": "Dokümantasyon", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which document is issued by an aviation authority (such as EASA, FAA, or SHGM) to mandate compulsory corrective actions for an unsafe condition on an aircraft?", "context": "", "options": ["Illustrated Parts Catalogue (IPC)", "Airworthiness Directive (AD)", "Component Maintenance Manual (CMM)", "Wiring Diagram Manual (WDM)"], "correct": "Airworthiness Directive (AD)", "explanation": "Airworthiness Directive (AD) = otoritenin zorunlu düzeltici işlem emri.", "why": {}}, {"key": "In an AMM diagram or inspection table, what does the term \"Clearance\" refer to?|", "category": "Parça & Alet Kelimeleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "In an AMM diagram or inspection table, what does the term \"Clearance\" refer to?", "context": "", "options": ["Permission from Air Traffic Control to take off", "The physical distance or gap allowed between two adjacent parts", "The rotational force applied to a bolt", "The chemical agent used to clean the windshield"], "correct": "The physical distance or gap allowed between two adjacent parts", "explanation": "Clearance = iki parça arasındaki izin verilen boşluk/mesafe.", "why": {}}, {"key": "What is a \"Cross-section\" view in an Aircraft Maintenance Manual illustration?|", "category": "Parça & Alet Kelimeleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "What is a \"Cross-section\" view in an Aircraft Maintenance Manual illustration?", "context": "", "options": ["A list of tools required for the job", "A cutaway view that shows the internal details and arrangement of a component", "A chart showing the flight hours of the aircraft", "An electrical schematic of the battery system"], "correct": "A cutaway view that shows the internal details and arrangement of a component", "explanation": "Cross-section = parçanın iç yapısını gösteren kesit görünüm.", "why": {}}, {"key": "In an AMM task header, Hydraulic Fluid MIL-H-5606, sealant, and lockwire are listed under which category?|", "category": "Dokümantasyon", "source": "SHGM Deneme-1", "type": "vocab", "question": "In an AMM task header, Hydraulic Fluid MIL-H-5606, sealant, and lockwire are listed under which category?", "context": "", "options": ["References", "Consumables", "Regulatory Authorities", "ATA Chapters"], "correct": "Consumables", "explanation": "Hidrolik sıvı, sızdırmazlık macunu, lockwire = Consumables (sarf malzemeler).", "why": {}}, {"key": "In the instructional sentence \"Safety the turnbuckle barrel using corrosion-resistant wire\", how is the word \"Safety\" used?|", "category": "Teknik İletişim", "source": "SHGM Deneme-1", "type": "vocab", "question": "In the instructional sentence \"Safety the turnbuckle barrel using corrosion-resistant wire\", how is the word \"Safety\" used?", "context": "", "options": ["As a noun meaning freedom from danger", "As a verb meaning to secure a part using safety wire or a cotter pin", "As an adjective describing the wire color", "As an abbreviation for the Safety Management System"], "correct": "As a verb meaning to secure a part using safety wire or a cotter pin", "explanation": "'Safety the barrel' emir cümlesi → Safety burada FİİL: emniyet teliyle emniyetle.", "why": {}}, {"key": "Under EASA and SHGM regulations, which approval standard specifically governs \"Maintenance Organisations\" (Bakım Kuruluşları)?|", "category": "Mevzuat", "source": "SHGM Deneme-1", "type": "vocab", "question": "Under EASA and SHGM regulations, which approval standard specifically governs \"Maintenance Organisations\" (Bakım Kuruluşları)?", "context": "", "options": ["Part-66 / SHT-66", "Part-145 / SHT-145", "Part-21 / SHT-21", "Part-FCL"], "correct": "Part-145 / SHT-145", "explanation": "Part-145 / SHT-145 = Bakım Kuruluşları. Part-66 = personel lisansı, Part-21 = üretim.", "why": {}}, {"key": "In aviation regulatory terminology, what does the abbreviation \"MOE\" stand for?|", "category": "Mevzuat", "source": "SHGM Deneme-1", "type": "vocab", "question": "In aviation regulatory terminology, what does the abbreviation \"MOE\" stand for?", "context": "", "options": ["Main Oil Exchanger", "Maintenance Organisation Exposition", "Minimum Operational Equipment", "Mandatory Overhaul Entry"], "correct": "Maintenance Organisation Exposition", "explanation": "MOE = Maintenance Organisation Exposition (kuruluş el kitabı).", "why": {}}, {"key": "Which organization is responsible for managing the continuing airworthiness tasks, such as developing the Aircraft Maintenance Programme (AMP) and tracking AD/SB compliance?|", "category": "Mevzuat", "source": "SHGM Deneme-1", "type": "vocab", "question": "Which organization is responsible for managing the continuing airworthiness tasks, such as developing the Aircraft Maintenance Programme (AMP) and tracking AD/SB compliance?", "context": "", "options": ["ICAO", "CAMO (Continuing Airworthiness Management Organisation)", "ATC (Air Traffic Control)", "OEM (Original Equipment Manufacturer)"], "correct": "CAMO (Continuing Airworthiness Management Organisation)", "explanation": "CAMO = sürekli uçuşa elverişlilik yönetimi: AMP, AD/SB takibi.", "why": {}}, {"key": "In the stores and component tagging system, a \"Yellow Tag\" attached to an aircraft component typically indicates that the part is _______.|", "category": "Bakım Prosedürleri", "source": "SHGM Deneme-1", "type": "vocab", "question": "In the stores and component tagging system, a \"Yellow Tag\" attached to an aircraft component typically indicates that the part is _______.", "context": "", "options": ["Unserviceable and must be scrapped", "Serviceable (Ready for Installation)", "Missing its serial number", "Quarantined due to suspected unapproved part"], "correct": "Serviceable (Ready for Installation)", "explanation": "Sarı etiket birçok kuruluşta 'serviceable' için kullanılır; ancak renk kodları kuruluşa göre
