: {"independently inspect": "Etken yapıdır; görevler denetlenen taraftır ('by a second qualified person').", "have independently inspected": "Etken Present Perfect yapısıdır; 'been' olmadan edilgen olmaz.", "being independently inspected": "Modal 'must' arkasından 'being' değil yalın 'be' gelir."}}, {"key": "The cabin pressurisation outflow valve _______ right now, so the electrical power must remain isolated.|", "category": "Edilgen Yapı", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "The cabin pressurisation outflow valve _______ right now, so the electrical power must remain isolated.", "context": "", "options": ["is replacing", "has replaced", "is being replaced", "was being replaced"], "correct": "is being replaced", "explanation": "'right now' (şu an) + valf değiştirilen taraf olduğu için Present Continuous Passive: is being replaced.", "why": {"is replacing": "is replacing etkendir; valf bir şeyi değiştirmiyor, değiştiriliyor.", "has replaced": "has replaced hem etken hem bitmiş eylemdir.", "was being replaced": "was being replaced geçmiştir; 'right now' ile çelişir."}}, {"key": "The mechanic forgot to lockwire the oil drain plug. He _______ the AMM checklist carefully before closing the cowling.|", "category": "Modal Fiiller", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "The mechanic forgot to lockwire the oil drain plug. He _______ the AMM checklist carefully before closing the cowling.", "context": "", "options": ["must check", "should have checked", "can't check", "needn't have checked"], "correct": "should have checked", "explanation": "Geçmişte yapılması gerekip yapılmayan iş için eleştiri/pişmanlık: should have + V3.", "why": {"must check": "must check şimdiki/gelecek zorunluluktur; olay geçmişte oldu ('forgot').", "can't check": "can't check şimdiki imkânsızlıktır.", "needn't have checked": "needn't have checked = 'kontrol etmesine gerek yoktu (ama etti)' demektir, anlam tamamen terstir."}}, {"key": "The pressure gauge still reads zero even after servicing; the sensor _______ be faulty.|", "category": "Modal Fiiller", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "The pressure gauge still reads zero even after servicing; the sensor _______ be faulty.", "context": "", "options": ["must", "mustn't", "needn't", "doesn't have to"], "correct": "must", "explanation": "Güçlü mantıksal çıkarım (kanıt: servis sonrası hâlâ sıfır gösteriyor) → must be.", "why": {"mustn't": "mustn't yasak bildirir, çıkarım yapmaz (olumsuz çıkarım 'can't be'dir).", "needn't": "needn't 'gerek yok' demektir.", "doesn't have to": "doesn't have to 'zorunda değil' demektir."}}, {"key": "If the incoming stores clerk _______ the missing EASA Form 1, the unapproved bearing would have been installed.|", "category": "Koşul & Karşılaştırma", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "If the incoming stores clerk _______ the missing EASA Form 1, the unapproved bearing would have been installed.", "context": "", "options": ["didn't notice", "hadn't noticed", "doesn't notice", "wouldn't notice"], "correct": "hadn't noticed", "explanation": "3. tip koşul (geçmişte gerçekleşmemiş senaryo): If + Past Perfect (hadn't noticed), would have + V3.", "why": {"didn't notice": "Past Simple 2. tipte (would + V1) kullanılır; burada 'would have been installed' var.", "doesn't notice": "Present Simple 1. tiptedir.", "wouldn't notice": "If cümleciğinde 'would' kullanılmaz."}}, {"key": "The aircraft cannot depart _______ the certifying staff sign the Certificate of Release to Service.|", "category": "Koşul & Karşılaştırma", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "The aircraft cannot depart _______ the certifying staff sign the Certificate of Release to Service.", "context": "", "options": ["if", "unless", "because", "although"], "correct": "unless", "explanation": "unless = -medikçe (if not). CRS imzalanmadıkça uçak kalkamaz.", "why": {"if": "if kullanılsaydı 'imzalarlarsa kalkamaz' gibi ters bir anlam çıkardı.", "because": "because sebep bildirir; cümle koşul anlatıyor.", "although": "although zıtlık bildirir."}}, {"key": "The Part-145 organisation, _______ quality manager recently updated the MOE, passed the SHGM audit without any Level 1 findings.|", "category": "İlgi Cümlecikleri", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "The Part-145 organisation, _______ quality manager recently updated the MOE, passed the SHGM audit without any Level 1 findings.", "context": "", "options": ["which", "that", "whose", "who"], "correct": "whose", "explanation": "'organisation'ın kalite müdürü' (sahiplik + isim: quality manager) → whose.", "why": {"which": "which ardından doğrudan sahiplik ismi ('which quality manager') alamaz.", "that": "Virgüllü cümlecikte 'that' kullanılmaz ve sahiplik bildirmez.", "who": "who kişiler için özne zamiridir, sahiplik bildirmez."}}, {"key": "The SHGM auditor asked the shift supervisor how long the torque wrench _______ out of calibration.|", "category": "Dolaylı Anlatım", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "The SHGM auditor asked the shift supervisor how long the torque wrench _______ out of calibration.", "context": "", "options": ["has been", "had been", "was it", "is being"], "correct": "had been", "explanation": "Dolaylı soru: düz cümle sırası + zaman bir adım geri (has been → had been).", "why": {"has been": "Aktaran fiil geçmiş ('asked') olduğu için zaman geri çekilir: has been → had been.", "was it": "Dolaylı soruda devrik soru sırası ('was it') kullanılmaz.", "is being": "is being şimdiki zamandır ve zaman uyumu bozulur."}}, {"key": "All Part-145 maintenance personnel must comply _______ the latest revision of the Aircraft Maintenance Manual.|", "category": "Edatlar", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "All Part-145 maintenance personnel must comply _______ the latest revision of the Aircraft Maintenance Manual.", "context": "", "options": ["to", "for", "with", "of"], "correct": "with", "explanation": "Sabit kalıp: comply WITH (uymak). (Dikkat: conform TO, refer TO, comply WITH!)", "why": {"to": "'conform to' ve 'refer to' doğru olsa da 'comply' daima 'with' alır.", "for": "comply for diye bir kalıp yoktur.", "of": "comply of yanlıştır."}}, {"key": "Applying anti-corrosion primer prevents aluminium fuselage panels from _______ in humid coastal environments.|", "category": "V-ing / to V", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "Applying anti-corrosion primer prevents aluminium fuselage panels from _______ in humid coastal environments.", "context": "", "options": ["corrode", "to corrode", "corroding", "corroded"], "correct": "corroding", "explanation": "prevent + nesne + from + V-ing (edattan sonra daima V-ing).", "why": {"corrode": "'from' edatından sonra yalın fiil gelmez.", "to corrode": "Edattan sonra 'to V1' gelmez.", "corroded": "corroded V3/sıfattır; 'from' sonrası V-ing gerekir."}}, {"key": "_______ the strict tool control procedure, a small socket was momentarily misplaced during the C-check.|", "category": "Bağlaçlar", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "_______ the strict tool control procedure, a small socket was momentarily misplaced during the C-check.", "context": "", "options": ["Although", "Despite", "Because", "However"], "correct": "Despite", "explanation": "Boşluktan sonra sadece isim tamlaması ('the strict tool control procedure') ve zıtlık var → Despite.", "why": {"Although": "Although arkasından tam cümle (özne + fiil) ister.", "Because": "Because hem tam cümle ister hem de sebep bildirir (burada zıtlık var).", "However": "However tek başına bir isim tamlamasını bu şekilde bağlamaz."}}, {"key": "Before starting the repair, the team requested _______ NDT inspection and _______ updated wiring diagram.|", "category": "Artikeller", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "Before starting the repair, the team requested _______ NDT inspection and _______ updated wiring diagram.", "context": "", "options": ["a / an", "an / an", "an / a", "a / a"], "correct": "an / an", "explanation": "NDT 'en-di-ti' diye sesli sesle başlar → an NDT. updated 'ap-dey-tıd' sesli sesle başlar → an updated.", "why": {"a / an": "NDT kısaltması 'en' (sesli ses) ile okunur; 'a' değil 'an' alır.", "an / a": "updated 'u' burada /ʌ/ (sesli) okunur, /ju:/ (unit gibi) değil → an updated.", "a / a": "Her iki ifade de sesli sesle başladığı için 'an' gerektirir."}}, {"key": "Technician note: \"Hydraulic pump was replace and leak check didn't found any leak.\" Choose the best technical log entry.|", "category": "Hatalı Kayıt Avcısı", "source": "SHGM İleri Set (v2.1)", "type": "grammar", "question": "Technician note: \"Hydraulic pump was replace and leak check didn't found any leak.\" Choose the best technical log entry.", "context": "", "options": ["Hydraulic pump replaced; leak check performed, no leaks found.", "Hydraulic pump was replacing; leak check performed, no leak founded.", "Hydraulic pump replaced; leak check did not found leaks.", "Hydraulic pump is replace; leak check performed, no leaks find."], "correct": "Hydraulic pump replaced; leak check performed, no leaks found.", "explanation": "Standart bakım kaydı: kısa edilgen V3 (replaced, performed, found). 'didn't found' ve 'founded' gramer/anlam hatasıdır.", "why": {"Hydraulic pump was replacing; leak check performed, no leak founded.": "'was replacing' etken süreçtir; 'founded' = kurmak (doğrusu found).", "Hydraulic pump replaced; leak check did not found leaks.": "'did not' arkasından V1 (find) gelir, 'did not found' yanlıştır.", "Hydraulic pump is replace; leak check performed, no leaks find.": "'is replace' ve 'no leaks find' edilgen V3 kurallarına aykırıdır."}}, {"key": "Which official release certificate accompanies an approved aircraft component after maintenance or overhaul under EASA/SHGM rules?|", "category": "Mevzuat", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "Which official release certificate accompanies an approved aircraft component after maintenance or overhaul under EASA/SHGM rules?", "context": "", "options": ["EASA Form 1 / SHGM Form 1", "Minimum Equipment List (MEL)", "Illustrated Parts Catalogue (IPC)", "Aircraft Flight Manual (AFM)"], "correct": "EASA Form 1 / SHGM Form 1", "explanation": "EASA Form 1 / SHGM Form 1 = Authorized Release Certificate; parçanın uçuşa elverişli/onaylı olduğunu belgeler.", "why": {"Minimum Equipment List (MEL)": "MEL arızalı donanımla uçuş şartlarını belirler, parça sertifikası değildir.", "Illustrated Parts Catalogue (IPC)": "IPC parça numarası kataloğudur.", "Aircraft Flight Manual (AFM)": "AFM uçağın işletme/uçuş el kitabıdır."}}, {"key": "Which Non-Destructive Testing (NDT) method uses high-frequency sound waves to detect internal flaws or measure material thickness?|", "category": "Bakım Prosedürleri", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "Which Non-Destructive Testing (NDT) method uses high-frequency sound waves to detect internal flaws or measure material thickness?", "context": "", "options": ["Dye penetrant inspection", "Ultrasonic testing", "Visual inspection", "Magnetic particle testing"], "correct": "Ultrasonic testing", "explanation": "Ultrasonic testing (UT) yüksek frekanslı ses dalgalarıyla iç çatlak tespiti ve kalınlık ölçümü yapar.", "why": {"Dye penetrant inspection": "Dye penetrant yalnızca yüzeye açılan çatlakları boyayla gösterir.", "Visual inspection": "Visual inspection sadece gözle muayenedir.", "Magnetic particle testing": "Magnetic particle yalnızca ferromanyetik metallerde yüzey/yüzey altı çatlak içindir."}}, {"key": "What is the primary purpose of 'static wicks' (static dischargers) mounted on the trailing edges of wings and tail surfaces?|", "category": "Uçak Sistemleri", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "What is the primary purpose of 'static wicks' (static dischargers) mounted on the trailing edges of wings and tail surfaces?", "context": "", "options": ["To measure static air pressure for the altimeter", "To safely dissipate static electrical charges into the atmosphere", "To prevent ice buildup on the control surfaces", "To lock the flight controls on the ground"], "correct": "To safely dissipate static electrical charges into the atmosphere", "explanation": "Static wicks uçuş sırasında gövdede biriken statik elektriği havaya boşaltarak radyo parazitini önler.", "why": {"To measure static air pressure for the altimeter": "Statik basıncı ölçen parça 'static port'tur, static wick değil.", "To prevent ice buildup on the control surfaces": "Buzlanmayı önleyen sistem anti-icing / de-icing sistemidir.", "To lock the flight controls on the ground": "Yerde kontrol yüzeylerini kilitleyen parça gust lock'tur."}}, {"key": "What type of corrosion occurs when two dissimilar metals are in electrical contact in the presence of moisture (an electrolyte)?|", "category": "Parça & Alet Kelimeleri", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "What type of corrosion occurs when two dissimilar metals are in electrical contact in the presence of moisture (an electrolyte)?", "context": "", "options": ["Galvanic corrosion", "Fretting wear", "Fatigue cracking", "Thermal shock"], "correct": "Galvanic corrosion", "explanation": "Galvanic corrosion = nemli ortamda birbirine temas eden iki farklı metal arasında oluşan elektrokimyasal korozyon.", "why": {"Fretting wear": "Fretting iki yüzeyin mikro titreşimle sürtünmesinden doğar.", "Fatigue cracking": "Fatigue tekrarlı mekanik yükler sonucu oluşan yorulma çatlağıdır.", "Thermal shock": "Thermal shock ani sıcaklık değişiminden kaynaklanır."}}, {"key": "Under Part-66 licensing rules, which licence category primarily authorises a certifying engineer to release avionics and electrical system maintenance?|", "category": "Mevzuat", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "Under Part-66 licensing rules, which licence category primarily authorises a certifying engineer to release avionics and electrical system maintenance?", "context": "", "options": ["Category A", "Category B1", "Category B2", "Category C only for line"], "correct": "Category B2", "explanation": "Part-66 Category B2 = Aviyonik ve elektrik sistemleri onaylama yetkili personel. (B1 = gövde/motor mekanik.)", "why": {"Category A": "Category A yalnızca sınırlı basit hat bakımı içindir.", "Category B1": "Category B1 mekanik (gövde, motor, mekanik/elektrik ara sistemler) içindir.", "Category C only for line": "Category C ağır (base) bakımın genel serbest bırakması içindir."}}, {"key": "Which document allows an aircraft to be dispatched with certain minor external secondary parts (such as a small fairing or static wick) missing?|", "category": "Dokümantasyon", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "Which document allows an aircraft to be dispatched with certain minor external secondary parts (such as a small fairing or static wick) missing?", "context": "", "options": ["Configuration Deviation List (CDL)", "Wiring Diagram Manual (WDM)", "Component Maintenance Manual (CMM)", "Airworthiness Review Certificate (ARC)"], "correct": "Configuration Deviation List (CDL)", "explanation": "CDL (Configuration Deviation List) küçük dış/ikincil parçalar eksik haldeyken uçuşa izin şartlarını belirler.", "why": {"Wiring Diagram Manual (WDM)": "WDM elektrik kablo şemalarını içerir.", "Component Maintenance Manual (CMM)": "CMM atölyedeki parça bakım el kitabıdır.", "Airworthiness Review Certificate (ARC)": "ARC uçuşa elverişlilik gözden geçirme sertifikasıdır."}}, {"key": "In aviation safety management, what does the term 'Just Culture' mean?|", "category": "Emniyet & İnsan Faktörü", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "In aviation safety management, what does the term 'Just Culture' mean?", "context": "", "options": ["Punishing every technician automatically whenever an honest error is reported", "An environment where staff are encouraged to report errors without fear, while gross negligence or wilful violations are not tolerated", "Allowing technicians to skip manuals when flights are delayed", "Keeping all incident reports secret from the aviation authority"], "correct": "An environment where staff are encouraged to report errors without fear, while gross negligence or wilful violations are not tolerated", "explanation": "Just Culture (Adil Kültür) = dürüst hataların korkmadan bildirilmesini teşvik eder; kasıtlı ihlal ve ağır ihmali ise ayırır.", "why": {"Punishing every technician automatically whenever an honest error is reported": "Her hatayı otomatik cezalandırmak raporlamayı öldürür, Just Culture değildir.", "Allowing technicians to skip manuals when flights are delayed": "Zaman baskısında kılavuz atlamak emniyetsiz davranıştır.", "Keeping all incident reports secret from the aviation authority": "Otoriteden olay gizlemek mevzuata aykırıdır."}}, {"key": "During a hydraulic fluid contamination event, the AMM instructs the technician to 'flush' the system. What does 'flush' mean?|", "category": "Bakım Fiilleri", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "During a hydraulic fluid contamination event, the AMM instructs the technician to 'flush' the system. What does 'flush' mean?", "context": "", "options": ["To paint the outside of the hydraulic pipes", "To circulate clean fluid through the lines to wash out dirt or wrong fluid", "To seal the reservoir permanently", "To increase the airspeed during flight"], "correct": "To circulate clean fluid through the lines to wash out dirt or wrong fluid", "explanation": "flush = sistemin içinden temiz sıvı geçirerek kir, talaş veya yanlış sıvıyı yıkayıp temizlemek.", "why": {"To paint the outside of the hydraulic pipes": "Dış boyama ile ilgisi yoktur.", "To seal the reservoir permanently": "Kalıcı kapatma değildir.", "To increase the airspeed during flight": "Uçuş hızı ile ilgisi yoktur."}}, {"key": "A defect report reads: 'Intermittent fault on VHF Com 1.' What does 'intermittent' mean?|", "category": "Teknik İletişim", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "A defect report reads: 'Intermittent fault on VHF Com 1.' What does 'intermittent' mean?", "context": "", "options": ["Permanent and never disappears", "Occurring irregularly — appearing and disappearing from time to time", "Caused only by bird strikes", "Completely repaired and certified"], "correct": "Occurring irregularly — appearing and disappearing from time to time", "explanation": "intermittent = aralıklı, bir görünüp bir kaybolan (arıza gidermede en zorlu arıza tipi).", "why": {"Permanent and never disappears": "Kalıcı/sürekli arıza 'permanent' veya 'continuous' olarak adlandırılır.", "Caused only by bird strikes": "Kuş çarpmasıyla özel bir bağı yoktur.", "Completely repaired and certified": "Giderilmiş arıza 'rectified'dır."}}, {"key": "What does the abbreviation 'AOG' signify in airline maintenance operations?|", "category": "Bakım Prosedürleri", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "What does the abbreviation 'AOG' signify in airline maintenance operations?", "context": "", "options": ["Approved Organisation Guideline", "Aircraft on Ground — an urgent situation where an aircraft cannot fly until a part or repair is completed", "Auxiliary Oil Gauge", "Airframe Overhaul Group"], "correct": "Aircraft on Ground — an urgent situation where an aircraft cannot fly until a part or repair is completed", "explanation": "AOG (Aircraft on Ground) = parça veya onarım beklediği için uçağın yerde kaldığı en yüksek öncelikli acil durum.", "why": {"Approved Organisation Guideline": "Uydurma açılımdır.", "Auxiliary Oil Gauge": "Yağ göstergesi kısaltması değildir.", "Airframe Overhaul Group": "Gövde revizyon grubu kısaltması değildir."}}, {"key": "What is the function of a 'turnbuckle' in a mechanical flight control cable system?|", "category": "Parça & Alet Kelimeleri", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "What is the function of a 'turnbuckle' in a mechanical flight control cable system?", "context": "", "options": ["To cut control cables during emergencies", "To adjust and maintain the proper tension of the control cables", "To measure fuel pressure in the wing tank", "To insulate high-voltage avionics cables"], "correct": "To adjust and maintain the proper tension of the control cables", "explanation": "turnbuckle = germe somunu; uçuş kumanda kablolarının gerginliğini ayarlamak için kullanılır.", "why": {"To cut control cables during emergencies": "Kablo kesici değildir.", "To measure fuel pressure in the wing tank": "Yakıt basıncıyla ilgisi yoktur.", "To insulate high-voltage avionics cables": "Elektrik yalıtım elemanı değildir."}}, {"key": "The new maintenance software significantly _______ the time needed to locate applicable task cards.|", "category": "Kelime Bilgisi", "source": "SHGM İleri Set (v2.1)", "type": "vocab", "question": "The new maintenance software significantly _______ the time needed to locate applicable task cards.", "context": "", "options": ["reduces", "refuses", "resigns", "recovers"], "correct": "reduces", "explanation": "reduce the time = süreyi azaltmak. (YDS/SHGM tarzı benzer yazılışlı fiil sorusu.)", "why": {"refuses": "refuse = reddetmek.", "resigns": "resign = istifa etmek.", "recovers": "recover = iyileşmek / geri kazanmak."}}, {"key": "Provided that all AD requirements are complied with on time, _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "Provided that all AD requirements are complied with on time, _______.", "context": "", "options": ["the aircraft may continue to operate safely", "the aircraft was grounded last month", "the authority revoked the approval yesterday", "the engineer refused signing the logbook"], "correct": "the aircraft may continue to operate safely", "explanation": "Provided that = şartıyla (1. tip koşul: Present → may/will + V1).", "why": {"the aircraft was grounded last month": "Geçmiş zaman ('was grounded') koşulun zamanıyla ve olumlu mantığıyla çelişir.", "the authority revoked the approval yesterday": "Zaman (yesterday) ve anlam uyumsuz.", "the engineer refused signing the logbook": "refuse + to V1 alır ve anlam uyumsuzdur."}}, {"key": "Whereas a Service Bulletin is generally recommended by the manufacturer, _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "Whereas a Service Bulletin is generally recommended by the manufacturer, _______.", "context": "", "options": ["an Airworthiness Directive is legally mandatory", "the technician installed a new O-ring yesterday", "both documents are ignored during heavy checks", "a torque wrench must be calibrated every year"], "correct": "an Airworthiness Directive is legally mandatory", "explanation": "Whereas = oysa (karşıtlık). Üretici önerisi (SB) ↔ yasal zorunluluk (AD).", "why": {"the technician installed a new O-ring yesterday": "O-ring montajı SB ile karşıtlık kurmaz.", "both documents are ignored during heavy checks": "Bilgi olarak yanlış ve zıtlık kurmuyor.", "a torque wrench must be calibrated every year": "Konuyla ilgisiz."}}, {"key": "Having verified that the part number matched the IPC, _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "Having verified that the part number matched the IPC, _______.", "context": "", "options": ["the new fuel valve was installed by the technician", "the technician installed the new fuel valve", "the IPC was placed back on the shelf itself", "installing the new fuel valve took ten minutes"], "correct": "the technician installed the new fuel valve", "explanation": "'Having verified…' ortaç cümleciğinin gizli öznesi (doğrulayan kişi) ana cümlenin öznesi olmalıdır → the technician.", "why": {"the new fuel valve was installed by the technician": "Ana cümle öznesi 'the new fuel valve' olursa valf IPC'yi doğrulamış gibi görünür (dangling modifier hatası).", "the IPC was placed back on the shelf itself": "IPC kendi kendini doğrulayamaz.", "installing the new fuel valve took ten minutes": "Eylemi yapan kişi özne konumunda değil."}}, {"key": "_______, the maintenance team immediately halted the ground run and inspected the intake.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "_______, the maintenance team immediately halted the ground run and inspected the intake.", "context": "", "options": ["Because the engine ran smoothly without any noise", "Although no defect had been reported", "As soon as an abnormal vibration was detected", "Until the flight crew arrives at the gate tomorrow"], "correct": "As soon as an abnormal vibration was detected", "explanation": "Anormal titreşim tespit edilir edilmez (As soon as + Past Simple) yer çalıştırması durduruldu.", "why": {"Because the engine ran smoothly without any noise": "Motor sorunsuz çalışıyorsa durdurma sebebi olmaz.", "Although no defect had been reported": "Zıtlık bağlacı burada mantıklı bir neden-sonuç kurmuyor.", "Until the flight crew arrives at the gate tomorrow": "Zaman uyumsuz (tomorrow vs halted)."}}, {"key": "Lockout and tagout devices are attached to circuit breakers _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "Lockout and tagout devices are attached to circuit breakers _______.", "context": "", "options": ["so that no one accidentally energises the system during maintenance", "because of the technician wants to finish early", "in order to increasing the electrical voltage", "despite the power must be turned on"], "correct": "so that no one accidentally energises the system during maintenance", "explanation": "so that + cümle = …olmasın diye (amaç). Kimse yanlışlıkla sisteme enerji vermesin diye.", "why": {"because of the technician wants to finish early": "'because of' tam cümle almaz, isim alır.", "in order to increasing the electrical voltage": "'in order to' arkasından V1 (increase) gelir, -ing değil; üstelik anlam terstir.", "despite the power must be turned on": "'despite' tam cümle almaz."}}, {"key": "No matter how experienced a certifying engineer may be, _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "No matter how experienced a certifying engineer may be, _______.", "context": "", "options": ["he or she must always consult the current AMM revision", "they never need to check any maintenance data", "verbal instructions were enough to release the aircraft", "complacency improves flight safety significantly"], "correct": "he or she must always consult the current AMM revision", "explanation": "No matter how … (ne kadar … olursa olsun) zıtlık/vurgu kurar: ne kadar deneyimli olursa olsun güncel AMM'ye bakmalıdır.", "why": {"they never need to check any maintenance data": "Havacılık emniyeti kuralına aykırıdır.", "verbal instructions were enough to release the aircraft": "Sözlü talimat onaylı veri yerine geçmez ve zaman uyumsuzdur.", "complacency improves flight safety significantly": "Rehavet (complacency) emniyeti artırmaz, tehlikeye atar."}}, {"key": "The cabin door seal had deteriorated so badly _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "The cabin door seal had deteriorated so badly _______.", "context": "", "options": ["that the aircraft could not maintain normal cabin pressure", "than the mechanic replaced two rivets", "which caused no problem during climb", "what made the flight depart earlier"], "correct": "that the aircraft could not maintain normal cabin pressure", "explanation": "so + zarf/sıfat + THAT + cümle (o kadar … ki …).", "why": {"than the mechanic replaced two rivets": "'so … than' kalıbı yoktur (more … than).", "which caused no problem during climb": "'so … which' kalıbı yoktur.", "what made the flight depart earlier": "'so … what' yanlıştır."}}, {"key": "Not only did the audit reveal expired calibration labels, _______.|", "category": "Cümle Tamamlama", "source": "SHGM İleri Set (v2.1)", "type": "gap", "question": "Not only did the audit reveal expired calibration labels, _______.", "context": "", "options": ["but it also uncovered incomplete shift handover records", "nor did the technicians sign any job cards", "so the hangar was painted the next week", "and also it uncovering missing manuals"], "correct": "but it also uncovered incomplete shift handover records", "explanation": "Sabit eşli bağlaç: Not only … but also …", "why": {"nor did the technicians sign any job cards": "'nor' neither ile eşleşir, not only ile değil.", "so the hangar was painted the next week": "Hem yapı hem anlam uyumsuz.", "and also it uncovering missing manuals": "'it uncovering' çekimli fiil eksikliği içerir."}}, {"key": "Which is the correct Turkish translation of: \"Unapproved parts must be immediately quarantined so that they cannot be installed on any aircraft.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Which is the correct Turkish translation of: \"Unapproved parts must be immediately quarantined so that they cannot be installed on any aircraft.\"", "context": "", "options": ["Onaysız parçalar herhangi bir uçağa takılamamaları için derhal karantinaya alınmalıdır.", "Onaysız parçalar uçağa takıldıktan sonra derhal karantinaya alınmalıdır.", "Karantinaya alınan parçalar yalnızca onaylı uçaklara hemen takılabilir.", "Onaysız parçaların herhangi bir uçağa takılmaması için depoya gönderilmesi gerekmez.", "Herhangi bir uçağa takılan onaysız parçalar daha sonra karantinaya alınabilir."], "correct": "Onaysız parçalar herhangi bir uçağa takılamamaları için derhal karantinaya alınmalıdır.", "explanation": "must be immediately quarantined = derhal karantinaya alınmalıdır; so that they cannot be installed = takılamamaları için.", "why": {"Onaysız parçalar uçağa takıldıktan sonra derhal karantinaya alınmalıdır.": "'takıldıktan sonra' anlamı tersine çeviriyor.", "Karantinaya alınan parçalar yalnızca onaylı uçaklara hemen takılabilir.": "Onaysız parça hiçbir uçağa takılmaz.", "Onaysız parçaların herhangi bir uçağa takılmaması için depoya gönderilmesi gerekmez.": "'gerekmez' (don't have to) anlamı verir; metinde zorunluluk (must) var.", "Herhangi bir uçağa takılan onaysız parçalar daha sonra karantinaya alınabilir.": "'daha sonra alınabilir' (may later) metindeki 'immediately / must' ile çelişir."}}, {"key": "Which is the correct Turkish translation of: \"Even though the hydraulic pressure appeared normal on the ground, a drop was observed during climb.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Which is the correct Turkish translation of: \"Even though the hydraulic pressure appeared normal on the ground, a drop was observed during climb.\"", "context": "", "options": ["Hidrolik basınç yerde normal görünse de tırmanış sırasında bir düşüş gözlemlendi.", "Hidrolik basınç yerde düşük göründüğü için tırmanış sırasında normale döndü.", "Tırmanış sırasında basınç düşüşü gözlemlenmediği halde yerde kontrol yapıldı.", "Hidrolik basınç hem yerde hem de tırmanış sırasında normal görünüyordu.", "Tırmanış sırasında düşüş gözlemlendiğinden hidrolik basınç yerde normaldi."], "correct": "Hidrolik basınç yerde normal görünse de tırmanış sırasında bir düşüş gözlemlendi.", "explanation": "Even though = -se de / -e rağmen; appeared normal = normal görünse de; was observed = gözlemlendi.", "why": {"Hidrolik basınç yerde düşük göründüğü için tırmanış sırasında normale döndü.": "Sebep-sonuç ve yönler tamamen ters.", "Tırmanış sırasında basınç düşüşü gözlemlenmediği halde yerde kontrol yapıldı.": "Metinde düşüş gözlemlendiği açıkça yazıyor.", "Hidrolik basınç hem yerde hem de tırmanış sırasında normal görünüyordu.": "Zıtlık anlamı kaybolmuş.", "Tırmanış sırasında düşüş gözlemlendiğinden hidrolik basınç yerde normaldi.": "'Even though' sebep değil zıtlık bildirir."}}, {"key": "Which is the correct Turkish translation of: \"You do not have to remove the entire nacelle to inspect the oil cooler lines.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Which is the correct Turkish translation of: \"You do not have to remove the entire nacelle to inspect the oil cooler lines.\"", "context": "", "options": ["Yağ soğutucu hatlarını incelemek için tüm motor kaportasını sökmemelisiniz.", "Yağ soğutucu hatlarını incelemek için tüm motor kaportasını sökmek zorunda değilsiniz.", "Yağ soğutucu hatlarını incelemeden önce tüm motor kaportasını sökmeniz gerekir.", "Tüm motor kaportası sökülmedikçe yağ soğutucu hatları incelenemez.", "Yağ soğutucu hatları incelendikten sonra tüm motor kaportası sökülmemelidir."], "correct": "Yağ soğutucu hatlarını incelemek için tüm motor kaportasını sökmek zorunda değilsiniz.", "explanation": "do not have to = zorunda değilsiniz (gerek yok). A şıkkı 'must not' (yasak) tuzağıdır!", "why": {"Yağ soğutucu hatlarını incelemek için tüm motor kaportasını sökmemelisiniz.": "'sökmemelisiniz' = must not (yasak); 'do not have to' gerek olmadığını anlatır.", "Yağ soğutucu hatlarını incelemeden önce tüm motor kaportasını sökmeniz gerekir.": "Anlam tam tersi (zorunluluk).", "Tüm motor kaportası sökülmedikçe yağ soğutucu hatları incelenemez.": "Koşul ve anlam ters.", "Yağ soğutucu hatları incelendikten sonra tüm motor kaportası sökülmemelidir.": "Zaman ve kip hatalı."}}, {"key": "Which is the correct Turkish translation of: \"The maintenance organisation must retain all aircraft maintenance records for the period specified by the authority.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Which is the correct Turkish translation of: \"The maintenance organisation must retain all aircraft maintenance records for the period specified by the authority.\"", "context": "", "options": ["Bakım kuruluşu, tüm uçak bakım kayıtlarını otorite tarafından belirlenen süre boyunca saklamalıdır.", "Otorite, bakım kuruluşunun tüm kayıtlarını belirli bir süre sonunda silmelidir.", "Bakım kuruluşu yalnızca otoritenin istediği kayıtları kısa süreliğine tutabilir.", "Tüm uçak bakım kayıtları otoriteye teslim edildikten sonra kuruluşta saklanmaz.", "Bakım kuruluşu, otoritenin belirlediği süreden önce tüm kayıtları yenilemelidir."], "correct": "Bakım kuruluşu, tüm uçak bakım kayıtlarını otorite tarafından belirlenen süre boyunca saklamalıdır.", "explanation": "retain = muhafaza etmek, saklamak; for the period specified by = …tarafından belirlenen süre boyunca.", "why": {"Otorite, bakım kuruluşunun tüm kayıtlarını belirli bir süre sonunda silmelidir.": "Özne (bakım kuruluşu) ve fiil (retain = saklamak, silmek değil) yanlış.", "Bakım kuruluşu yalnızca otoritenin istediği kayıtları kısa süreliğine tutabilir.": "'all records' (tüm kayıtlar) ve 'must' (zorunlu) değiştirilmiş.", "Tüm uçak bakım kayıtları otoriteye teslim edildikten sonra kuruluşta saklanmaz.": "Metinde saklanmama ifadesi yok.", "Bakım kuruluşu, otoritenin belirlediği süreden önce tüm kayıtları yenilemelidir.": "retain = yenilemek değil saklamaktır."}}, {"key": "Which is the correct Turkish translation of: \"Before jacking the aircraft, verify that the wind speed does not exceed the limits given in the AMM.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Which is the correct Turkish translation of: \"Before jacking the aircraft, verify that the wind speed does not exceed the limits given in the AMM.\"", "context": "", "options": ["Uçağı krikoya aldıktan sonra rüzgâr hızının AMM limitlerini aştığını doğrulayın.", "Uçağı krikoyla kaldırmadan önce rüzgâr hızının AMM'de verilen limitleri aşmadığını doğrulayın.", "Rüzgâr hızı AMM'de verilen limitleri aşarsa uçağı krikoyla hemen kaldırın.", "Uçağı krikoyla kaldırmadan önce rüzgâr hızının AMM limitlerinin üzerinde olduğundan emin olun.", "AMM'de verilen rüzgâr limitleri aşılmadığı sürece uçak krikoya alınmamalıdır."], "correct": "Uçağı krikoyla kaldırmadan önce rüzgâr hızının AMM'de verilen limitleri aşmadığını doğrulayın.", "explanation": "Before jacking = krikoyla kaldırmadan önce; does not exceed = aşmadığını; verify = doğrulayın.", "why": {"Uçağı krikoya aldıktan sonra rüzgâr hızının AMM limitlerini aştığını doğrulayın.": "before ≠ aldıktan sonra; does not exceed ≠ aştığını.", "Rüzgâr hızı AMM'de verilen limitleri aşarsa uçağı krikoyla hemen kaldırın.": "Anlam tamamen ters.", "Uçağı krikoyla kaldırmadan önce rüzgâr hızının AMM limitlerinin üzerinde olduğundan emin olun.": "'üzerinde' değil, aşmamalı (altında/içinde olmalı).", "AMM'de verilen rüzgâr limitleri aşılmadığı sürece uçak krikoya alınmamalıdır.": "Olumsuzluk ters kurulmuş."}}, {"key": "Turkish → English: \"Onaylama yetkili personel, tüm bakım görevleri tamamlanmadan CRS düzenleyemez.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Turkish → English: \"Onaylama yetkili personel, tüm bakım görevleri tamamlanmadan CRS düzenleyemez.\"", "context": "", "options": ["Certifying staff cannot issue a CRS before all maintenance tasks are completed.", "Certifying staff must issue a CRS before all maintenance tasks are completed.", "Certifying staff cannot be issued a CRS after all maintenance tasks completed.", "All maintenance tasks cannot issue certifying staff before a CRS is completed.", "Certifying staff don't have to complete maintenance tasks to issue a CRS."], "correct": "Certifying staff cannot issue a CRS before all maintenance tasks are completed.", "explanation": "cannot issue = düzenleyemez; before … are completed = …tamamlanmadan (önce).", "why": {"Certifying staff must issue a CRS before all maintenance tasks are completed.": "'must issue' (düzenlemelidir) anlamı tersine çevirir.", "Certifying staff cannot be issued a CRS after all maintenance tasks completed.": "'cannot be issued' edilgen olduğu için özne personel olamaz.", "All maintenance tasks cannot issue certifying staff before a CRS is completed.": "Özne ve nesne yer değiştirmiş.", "Certifying staff don't have to complete maintenance tasks to issue a CRS.": "'don't have to' anlamı bozuyor."}}, {"key": "Turkish → English: \"Denetim bulguları, belirlenen son tarihe kadar giderilmezse kuruluşun onayı askıya alınabilir.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Turkish → English: \"Denetim bulguları, belirlenen son tarihe kadar giderilmezse kuruluşun onayı askıya alınabilir.\"", "context": "", "options": ["If the audit findings are not rectified by the specified deadline, the organisation's approval may be suspended.", "If the audit findings will not rectify until the deadline, the organisation suspends the approval.", "Unless the audit findings are not rectified by the deadline, the approval was suspended.", "The organisation's approval must suspend if the audit findings were rectified before the deadline.", "Although the audit findings are rectified by the deadline, the approval may be suspended."], "correct": "If the audit findings are not rectified by the specified deadline, the organisation's approval may be suspended.", "explanation": "are not rectified (edilgen) + by the specified deadline (son tarihe kadar) + may be suspended (askıya alınabilir).", "why": {"If the audit findings will not rectify until the deadline, the organisation suspends the approval.": "If cümlesinde 'will' olmaz ve 'rectify' edilgen olmalıdır.", "Unless the audit findings are not rectified by the deadline, the approval was suspended.": "'Unless … not' çift olumsuz hatasıdır; 'was' zaman uyumsuz.", "The organisation's approval must suspend if the audit findings were rectified before the deadline.": "Anlam ters ve 'must suspend' etken/hatalı.", "Although the audit findings are rectified by the deadline, the approval may be suspended.": "'Although' zıtlık anlamı verir, koşul değil."}}, {"key": "Turkish → English: \"Vardiya amiri, teknisyenlere motor çalışırken tehlike bölgesine girmemelerini söyledi.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Turkish → English: \"Vardiya amiri, teknisyenlere motor çalışırken tehlike bölgesine girmemelerini söyledi.\"", "context": "", "options": ["The shift supervisor told the technicians not to enter the danger area while the engine was running.", "The shift supervisor said the technicians don't enter the danger area while the engine is running.", "The shift supervisor told to the technicians to not entering the danger area during the engine ran.", "The technicians told the shift supervisor not to enter the danger area after the engine stopped.", "The shift supervisor asked the technicians whether they entered the danger area."], "correct": "The shift supervisor told the technicians not to enter the danger area while the engine was running.", "explanation": "Olumsuz emir dolaylı anlatımı: told + kişi + not to V1; motor çalışırken = while the engine was running.", "why": {"The shift supervisor said the technicians don't enter the danger area while the engine is running.": "'said' doğrudan kişi almaz ('said me/them' ✘); 'don't enter' dolaylı anlatım değildir.", "The shift supervisor told to the technicians to not entering the danger area during the engine ran.": "'told to' yanlıştır; 'to not entering' ve 'during + cümle' gramer hatasıdır.", "The technicians told the shift supervisor not to enter the danger area after the engine stopped.": "Özne-nesne ve zaman tamamen farklı.", "The shift supervisor asked the technicians whether they entered the danger area.": "Emir değil soru cümlesine dönüşmüş."}}, {"key": "Turkish → English: \"Sızıntının kaynağı tespit edilir edilmez ilgili valf yenisiyle değiştirildi.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Turkish → English: \"Sızıntının kaynağı tespit edilir edilmez ilgili valf yenisiyle değiştirildi.\"", "context": "", "options": ["As soon as the source of the leak was identified, the relevant valve was replaced with a new one.", "Before the source of the leak was identified, the relevant valve replaced a new one.", "As soon as the relevant valve was replaced, the source of the leak will be identified.", "While the source of the leak is identifying, the valve was replacing with a new one.", "Because the source of the leak could not be identified, the valve was not replaced."], "correct": "As soon as the source of the leak was identified, the relevant valve was replaced with a new one.", "explanation": "As soon as = …er edilmez; was identified (tespit edildi); was replaced with a new one (yenisiyle değiştirildi).", "why": {"Before the source of the leak was identified, the relevant valve replaced a new one.": "Before = önce (ters sıra) ve 'replaced' etken bırakılmış.", "As soon as the relevant valve was replaced, the source of the leak will be identified.": "Olay sırası ve zaman (will be) yanlış.", "While the source of the leak is identifying, the valve was replacing with a new one.": "Edilgen yapılar bozuk ('is identifying', 'was replacing').", "Because the source of the leak could not be identified, the valve was not replaced.": "Anlam tamamen olumsuz ve farklı."}}, {"key": "Turkish → English: \"Kompozit onarımına başlamadan önce yüzeyin tamamen kuru ve yağdan arınmış olduğundan emin olun.\"|", "category": "Çeviri", "source": "SHGM İleri Set (v2.1)", "type": "translation", "question": "Turkish → English: \"Kompozit onarımına başlamadan önce yüzeyin tamamen kuru ve yağdan arınmış olduğundan emin olun.\"", "context": "", "options": ["Before starting the composite repair, make sure that the surface is completely dry and free of oil.", "After starting the composite repair, make sure the surface was wet and full of oil.", "Before to start the composite repair, making sure that the surface is dry and free from oil.", "Ensure that the composite repair is completely dry before you oil the surface.", "Before starting the composite repair, you don't have to dry the surface or remove the oil."], "correct": "Before starting the composite repair, make sure that the surface is completely dry and free of oil.", "explanation": "Before + V-ing (starting); make sure that = emin olun; free of oil = yağdan arınmış.", "why": {"After starting the composite repair, make sure the surface was wet and full of oil.": "after / wet / full of oil tamamen ters anlamlı.", "Before to start the composite repair, making sure that the surface is dry and free from oil.": "'Before to start' ve ana fiilsiz 'making sure' gramer hatasıdır.", "Ensure that the composite repair is completely dry before you oil the surface.": "'you oil the surface' (yüzeyi yağlamadan) anlamı bozuyor.", "Before starting the composite repair, you don't have to dry the surface or remove the oil.": "'don't have to' zorunlu değil anlamı katar."}}, {"key": "What must happen before a newly arrived component is placed into serviceable stock?|[Giriş muayenesi ve EASA/SHGM Form 1]\n\nEvery aircraft compon", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "What must happen before a newly arrived component is placed into serviceable stock?", "context": "[Giriş muayenesi ve EASA/SHGM Form 1]\n\nEvery aircraft component arriving at a Part-145 maintenance organisation must pass through an incoming inspection before it can be placed into serviceable stock. The receiving inspector first checks the packaging for transit damage and verifies that the part number, serial number, and batch number physically stamped on the component match the accompanying release certificate, such as an EASA Form 1 or SHGM Form 1. In addition, shelf-life items like O-rings, sealants, and adhesives are checked to ensure their expiry dates have not passed. If any discrepancy is found — even a minor typographical error on the certificate — the component is immediately moved to the quarantine store and tagged as unserviceable until the supplier clarifies or replaces the documentation.", "options": ["It must be installed on an aircraft for a test flight.", "It must pass through an incoming inspection.", "Its serial number must be removed.", "It must wait in quarantine for 30 days."], "correct": "It must pass through an incoming inspection.", "explanation": "İlk cümle: 'must pass through an incoming inspection before it can be placed into serviceable stock'.", "why": {"It must be installed on an aircraft for a test flight.": "Test uçuşuna takılması metinde geçmez ve kurala aykırıdır.", "Its serial number must be removed.": "Seri numarası silinmez, sertifikayla karşılaştırılır.", "It must wait in quarantine for 30 days.": "Karantina yalnızca uygunsuzluk (discrepancy) varsa uygulanır."}}, {"key": "Why are items such as O-rings and sealants specifically checked during incoming inspection?|[Giriş muayenesi ve EASA/SHGM Form 1]\n\nEvery aircraft compon", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "Why are items such as O-rings and sealants specifically checked during incoming inspection?", "context": "[Giriş muayenesi ve EASA/SHGM Form 1]\n\nEvery aircraft component arriving at a Part-145 maintenance organisation must pass through an incoming inspection before it can be placed into serviceable stock. The receiving inspector first checks the packaging for transit damage and verifies that the part number, serial number, and batch number physically stamped on the component match the accompanying release certificate, such as an EASA Form 1 or SHGM Form 1. In addition, shelf-life items like O-rings, sealants, and adhesives are checked to ensure their expiry dates have not passed. If any discrepancy is found — even a minor typographical error on the certificate — the component is immediately moved to the quarantine store and tagged as unserviceable until the supplier clarifies or replaces the documentation.", "options": ["Because they are always shipped without packaging", "To confirm that their shelf-life expiry dates have not passed", "Because they do not require any paperwork", "To test their electrical continuity"], "correct": "To confirm that their shelf-life expiry dates have not passed", "explanation": "Metin: 'shelf-life items like O-rings, sealants, and adhesives are checked to ensure their expiry dates have not passed.'", "why": {"Because they are always shipped without packaging": "Ambalajsız gönderildikleri yazmıyor.", "Because they do not require any paperwork": "Evraksız kabul edildikleri yazmıyor.", "To test their electrical continuity": "O-ring ve macunlarda elektrik sürekliliği testi yapılmaz."}}, {"key": "What does the inspector do if there is even a minor typographical error on the release certificate?|[Giriş muayenesi ve EASA/SHGM Form 1]\n\nEvery aircraft compon", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "What does the inspector do if there is even a minor typographical error on the release certificate?", "context": "[Giriş muayenesi ve EASA/SHGM Form 1]\n\nEvery aircraft component arriving at a Part-145 maintenance organisation must pass through an incoming inspection before it can be placed into serviceable stock. The receiving inspector first checks the packaging for transit damage and verifies that the part number, serial number, and batch number physically stamped on the component match the accompanying release certificate, such as an EASA Form 1 or SHGM Form 1. In addition, shelf-life items like O-rings, sealants, and adhesives are checked to ensure their expiry dates have not passed. If any discrepancy is found — even a minor typographical error on the certificate — the component is immediately moved to the quarantine store and tagged as unserviceable until the supplier clarifies or replaces the documentation.", "options": ["Corrects the error by hand with a pen", "Accepts the part if the packaging looks intact", "Moves the part to quarantine and tags it unserviceable until clarified", "Installs the part under an MEL deferral"], "correct": "Moves the part to quarantine and tags it unserviceable until clarified", "explanation": "Son cümle: küçük bir yazım hatasında bile parça derhal karantinaya alınır ve tedarikçi belgeyi düzeltene kadar unserviceable etiketlenir.", "why": {"Corrects the error by hand with a pen": "Sertifika üzerinde elle düzeltme yapılmaz.", "Accepts the part if the packaging looks intact": "Ambalaj sağlamsa kabul edilmez.", "Installs the part under an MEL deferral": "MEL arızalı donanım ertelemesidir, belgesiz parça takmak için kullanılmaz."}}, {"key": "Why are tasks such as disturbing flight control cables classified as critical maintenance tasks?|[Kritik bakım görevlerinde bağımsız kontrol]\n\nCertain aircra", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "Why are tasks such as disturbing flight control cables classified as critical maintenance tasks?", "context": "[Kritik bakım görevlerinde bağımsız kontrol]\n\nCertain aircraft maintenance tasks are classified as 'critical maintenance tasks' because a single assembly error could directly endanger flight safety. Examples include disturbing flight control cables, reconnecting engine fuel lines, or installing primary structural fasteners. Under Part-145 regulations, whenever such a task is disturbed, an independent inspection must be performed after the work is completed. The person carrying out this independent check must be suitably qualified and must not have been involved in performing the original task. If a technician checks his or her own work, psychological expectation bias makes it easy to overlook a missing cotter pin or an inverted cable connection.", "options": ["Because they always require special night-shift approval", "Because a single assembly error could directly endanger flight safety", "Because they take more than ten hours to finish", "Because only pilots are allowed to perform them"], "correct": "Because a single assembly error could directly endanger flight safety", "explanation": "İlk cümle: 'because a single assembly error could directly endanger flight safety'.", "why": {"Because they always require special night-shift approval": "Gece vardiyası onayı metinde geçmez.", "Because they take more than ten hours to finish": "Süre kriteri metinde yoktur.", "Because only pilots are allowed to perform them": "Pilotlar bakım görevi yapmaz."}}, {"key": "Who is NOT allowed to perform the independent inspection?|[Kritik bakım görevlerinde bağımsız kontrol]\n\nCertain aircra", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "Who is NOT allowed to perform the independent inspection?", "context": "[Kritik bakım görevlerinde bağımsız kontrol]\n\nCertain aircraft maintenance tasks are classified as 'critical maintenance tasks' because a single assembly error could directly endanger flight safety. Examples include disturbing flight control cables, reconnecting engine fuel lines, or installing primary structural fasteners. Under Part-145 regulations, whenever such a task is disturbed, an independent inspection must be performed after the work is completed. The person carrying out this independent check must be suitably qualified and must not have been involved in performing the original task. If a technician checks his or her own work, psychological expectation bias makes it easy to overlook a missing cotter pin or an inverted cable connection.", "options": ["A qualified engineer from another team", "A certifying staff member who did not touch the system", "The technician who performed the original task", "An independent inspector holding the required authorisation"], "correct": "The technician who performed the original task", "explanation": "Metin: 'must not have been involved in performing the original task' (orijinal işi yapan kişi bağımsız kontrolü yapamaz).", "why": {"A qualified engineer from another team": "Başka ekipten yetkili mühendis yapabilir.", "A certifying staff member who did not touch the system": "Sisteme dokunmamış onaylama yetkili personel yapabilir.", "An independent inspector holding the required authorisation": "Gerekli yetkiye sahip bağımsız kontrolör yapabilir."}}, {"key": "According to the passage, why is self-inspection unreliable for critical tasks?|[Kritik bakım görevlerinde bağımsız kontrol]\n\nCertain aircra", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "According to the passage, why is self-inspection unreliable for critical tasks?", "context": "[Kritik bakım görevlerinde bağımsız kontrol]\n\nCertain aircraft maintenance tasks are classified as 'critical maintenance tasks' because a single assembly error could directly endanger flight safety. Examples include disturbing flight control cables, reconnecting engine fuel lines, or installing primary structural fasteners. Under Part-145 regulations, whenever such a task is disturbed, an independent inspection must be performed after the work is completed. The person carrying out this independent check must be suitably qualified and must not have been involved in performing the original task. If a technician checks his or her own work, psychological expectation bias makes it easy to overlook a missing cotter pin or an inverted cable connection.", "options": ["Because technicians lack the right tools", "Because expectation bias can cause a person to miss their own mistake", "Because AMM manuals do not cover cotter pins", "Because Part-145 prohibits using checklists"], "correct": "Because expectation bias can cause a person to miss their own mistake", "explanation": "Son cümle: psikolojik beklenti yanlılığı (expectation bias) yüzünden insan kendi hatasını (eksik kopilya veya ters kablo) kolayca gözden kaçırır.", "why": {"Because technicians lack the right tools": "Alet eksikliği sebep olarak belirtilmemiş.", "Because AMM manuals do not cover cotter pins": "AMM'nin eksik olduğu söylenmiyor.", "Because Part-145 prohibits using checklists": "Part-145 kontrol listesini yasaklamaz."}}, {"key": "What is the main difference between de-icing and anti-icing?|[Kış bakımı: De-icing ve Anti-icing farkı]\n\nDuring winter op", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "What is the main difference between de-icing and anti-icing?", "context": "[Kış bakımı: De-icing ve Anti-icing farkı]\n\nDuring winter operations, even a thin layer of frost or ice on an aircraft's wings can disrupt airflow, reduce lift, and increase drag. Ground crews use two distinct procedures to keep critical surfaces clean before takeoff: de-icing and anti-icing. De-icing is the removal of existing snow, frost, or ice, usually by spraying heated Type I fluid onto the airframe. Anti-icing, on the other hand, is a preventive step in which a thicker fluid (such as Type II or Type IV) is applied to a clean surface to stop new ice from forming during taxi. Because anti-icing fluids only remain effective for a limited duration known as the 'holdover time', the flight crew must start the takeoff roll before that time expires; otherwise, the aircraft must return for re-treatment.", "options": ["De-icing removes existing ice, whereas anti-icing prevents new ice from forming.", "De-icing is used only in flight, whereas anti-icing is used only in the hangar.", "De-icing uses thicker fluid than anti-icing.", "There is no difference; both terms describe heating the cabin."], "correct": "De-icing removes existing ice, whereas anti-icing prevents new ice from forming.", "explanation": "Metin: De-icing = mevcut kar/buzu giderir; Anti-icing = temiz yüzeye uygulanıp yeni buz oluşumunu önler.", "why": {"De-icing is used only in flight, whereas anti-icing is used only in the hangar.": "Her ikisi de kalkış öncesi yer prosedürüdür.", "De-icing uses thicker fluid than anti-icing.": "Daha yoğun (thicker) sıvı anti-icing'de (Type II/IV) kullanılır.", "There is no difference; both terms describe heating the cabin.": "Kabin ısıtmayla ilgisi yoktur."}}, {"key": "What does 'holdover time' refer to in the passage?|[Kış bakımı: De-icing ve Anti-icing farkı]\n\nDuring winter op", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "What does 'holdover time' refer to in the passage?", "context": "[Kış bakımı: De-icing ve Anti-icing farkı]\n\nDuring winter operations, even a thin layer of frost or ice on an aircraft's wings can disrupt airflow, reduce lift, and increase drag. Ground crews use two distinct procedures to keep critical surfaces clean before takeoff: de-icing and anti-icing. De-icing is the removal of existing snow, frost, or ice, usually by spraying heated Type I fluid onto the airframe. Anti-icing, on the other hand, is a preventive step in which a thicker fluid (such as Type II or Type IV) is applied to a clean surface to stop new ice from forming during taxi. Because anti-icing fluids only remain effective for a limited duration known as the 'holdover time', the flight crew must start the takeoff roll before that time expires; otherwise, the aircraft must return for re-treatment.", "options": ["The total flight time between two airports", "The time required to heat Type I fluid in the truck", "The limited period during which anti-icing fluid remains effective", "The delay caused by passenger boarding"], "correct": "The limited period during which anti-icing fluid remains effective", "explanation": "Metin: 'only remain effective for a limited duration known as the holdover time'.", "why": {"The total flight time between two airports": "Uçuş süresi değildir.", "The time required to heat Type I fluid in the truck": "Sıvının araçta ısıtılma süresi değildir.", "The delay caused by passenger boarding": "Yolcu biniş gecikmesi değildir."}}, {"key": "What must happen if the holdover time expires before the aircraft begins its takeoff roll?|[Kış bakımı: De-icing ve Anti-icing farkı]\n\nDuring winter op", "category": "Okuma Parçası", "source": "SHGM İleri Set (v2.1)", "type": "paragraph", "question": "What must happen if the holdover time expires before the aircraft begins its takeoff roll?", "context": "[Kış bakımı: De-icing ve Anti-icing farkı]\n\nDuring winter operations, even a thin layer of frost or ice on an aircraft's wings can disrupt airflow, reduce lift, and increase drag. Ground crews use two distinct procedures to keep critical surfaces clean before takeoff: de-icing and anti-icing. De-icing is the removal of existing snow, frost, or ice, usually by spraying heated Type I fluid onto the airframe. Anti-icing, on the other hand, is a preventive step in which a thicker fluid (such as Type II or Type IV) is applied to a clean surface to stop new ice from forming during taxi. Because anti-icing fluids only remain effective for a limited duration known as the 'holdover time', the flight crew must start the takeoff roll before that time expires; otherwise, the aircraft must return for re-treatment.", "options": ["The crew may take off at a higher speed.", "The aircraft must return for re-treatment.", "Only the cabin crew inspects the wings from inside.", "The pilots switch off the engines on the runway."], "correct": "The aircraft must return for re-treatment.", "explanation": "Son cümle: 'otherwise, the aircraft must return for re-treatment' (tekrar işlem için dönmelidir).", "why": {"The crew may take off at a higher speed.": "Daha yüksek hızla kalkış yapılamaz.", "Only the cabin crew inspects the wings from inside.": "Kabin ekibinin içeriden bakması yeterli değildir.", "The pilots switch off the engines on the runway.": "Pistte motor kapatma metinde geçmez."}}, {"key": "When the engine ___, the oil pressure ___ to the normal range.|", "category": "Fiil Zamanları", "source": "Benzer Set (Claude)", "type": "grammar", "question": "When the engine ___, the oil pressure ___ to the normal range.", "context": "", "options": ["start / increase", "is started / increasing", "starting / is increase", "starts / increases"], "correct": "starts / increases", "explanation": "Genel bir sonuç anlatılıyor: When + Present Simple, Present Simple (özne 'engine' ve 'pressure' tekil → -s).", "why": {}}, {"key": "The fuel pump ___ by the engine accessory gearbox.|", "category": "Edilgen Yapı", "source": "Benzer Set (Claude)", "type": "grammar", "question": "The fuel pump ___ by the engine accessory gearbox.", "context": "", "options": ["is driven", "drives", "is driving", "has drive"], "correct": "is driven", "explanation": "Pompa çalıştırılan taraftır → edilgen: is driven (be + V3).", "why": {}}, {"key": "Do not operate the hydraulic pump ___ fluid.|", "category": "Edatlar", "source": "Benzer Set (Claude)", "type": "grammar", "question": "Do not operate the hydraulic pump ___ fluid.", "context": "", "options": ["with", "without", "within", "except"], "correct": "without", "explanation": "without = …sız. Pompa sıvısız çalıştırılmaz.", "why": {}}, {"key": "Install the cover ___ you finish the test.|", "category": "Bağlaçlar", "source": "Benzer Set (Claude)", "type": "grammar", "question": "Install the cover ___ you finish the test.", "context": "", "options": ["unless", "although", "after", "until"], "correct": "after", "explanation": "after = …dıktan sonra. Kapak testten SONRA takılır.", "why": {}}, {"key": "The valve ___ is installed in the left wing is a check valve.|", "category": "İlgi Cümlecikleri", "source": "Benzer Set (Claude)", "type": "grammar", "question": "The valve ___ is inst ing", "light", "comes", "on"], "extra": ["will"], "alts": ["The warning light comes on if the oil level is low."]}, {"tag": "Koşul & Karşılaştırma", "text": "Unless you torque the nut, it may loosen.", "tr": "Somunu torklamazsan gevşeyebilir.", "note": "unless = if not (içinde zaten olumsuzluk var).", "words": ["unless", "you", "torque", "the", "nut", "it", "may", "loosen"], "extra": ["don't"], "alts": ["It may loosen unless you torque the nut."]}, {"tag": "Koşul & Karşılaştırma", "text": "When the engine cools down, we will remove the cowling.", "tr": "Motor soğuyunca kaportayı sökeceğiz.", "note": "when + gelecek anlam → Present Simple (will yok).", "words": ["when", "the", "engine", "cools", "down", "we", "will", "remove", "the", "cowling"], "extra": ["cooled"], "alts": ["We will remove the cowling when the engine cools down."]}, {"tag": "İlgi Cümlecikleri", "text": "The valve which leaks must be replaced.", "tr": "Sızdıran valf değiştirilmelidir.", "note": "which = nesne; zamir zaten özne (which it leaks ✘).", "words": ["the", "valve", "which", "leaks", "must", "be", "replaced"], "extra": ["who", "it"], "alts": []}, {"tag": "İlgi Cümlecikleri", "text": "The engineer who inspected the wing found a crack.", "tr": "Kanadı inceleyen mühendis bir çatlak buldu.", "note": "who = kişi.", "words": ["the", "engineer", "who", "inspected", "the", "wing", "found", "a", "crack"], "extra": ["which", "whose"], "alts": []}, {"tag": "İlgi Cümlecikleri", "text": "The tool that I used was out of calibration.", "tr": "Kullandığım alet kalibrasyon dışıydı.", "note": "that = nesne (virgülsüz).", "words": ["the", "tool", "that", "I", "used", "was", "out", "of", "calibration"], "extra": ["who"], "alts": []}, {"tag": "İlgi Cümlecikleri", "text": "The part, which was NRFI, was removed.", "tr": "NRFI olan parça sökülmüştü.", "note": "Virgüllü ek bilgide that değil which kullanılır.", "words": ["the", "part", "which", "was", "NRFI", "was", "removed"], "extra": ["who"], "alts": []}, {"tag":
