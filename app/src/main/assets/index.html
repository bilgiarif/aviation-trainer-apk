e": "#ff7a29", "teal": "#3dd6c0", "opt": "#221e15", "badge": "#4a4129", "heart_off": "#473f2a", "on_color": "#1a1405", "brown": "#b4491b", "brown_h": "#8f3912", "danger": "#c0262d", "danger_h": "#9b1c22", "white": "#ffffff", "nrfi": "#ff5f4a", "rfi": "#ffd24a"}, "Gündüz (Açık)": {"bg": "#eef2f9", "side": "#ffffff", "card": "#ffffff", "card2": "#e4eaf6", "border": "#c5d0e6", "accent": "#2f6bff", "accent_h": "#1f54d6", "green": "#12a574", "green_h": "#0d8660", "green_bg": "#d8f5ea", "red": "#e0364b", "red_bg": "#fde3e7", "gold": "#c98a00", "text": "#16203a", "muted": "#5f6b8a", "violet": "#6d4aff", "violet_h": "#5a38e0", "orange": "#e0651a", "teal": "#0b93a0", "opt": "#f3f6fc", "badge": "#d3dcf0", "heart_off": "#c9d1e4", "on_color": "#ffffff", "brown": "#b4491b", "brown_h": "#8f3912", "danger": "#c0262d", "danger_h": "#9b1c22", "white": "#ffffff", "nrfi": "#e0364b", "rfi": "#c98a00"}}, "ranks": [[1, "Çırak"], [3, "Teknisyen"], [5, "Kıdemli Teknisyen"], [8, "B1 Adayı"], [12, "B1 Sertifikalı"], [18, "Baş Mühendis"], [25, "Havacılık Efsanesi"]], "rules": {"Fiil Zamanları": "Zaman, cümledeki ipucu kelimeden bulunur: yesterday/ago → Past Simple; since/for + süre → Present Perfect; now/at the moment → Present Continuous; always/every → Present Simple. Bakım kayıtlarında biten iş için genelde Past Simple/Present Perfect ('Filter has been replaced') kullanılır.", "Parça & Alet Kelimeleri": "Benzer yazılan kelimeleri ayır (bellow ≠ below, torque ≠ tork-anahtarı). Parçayı İngilizce adıyla, işlevini Türkçe ile birlikte tekrar et: kelime + kullanıldığı yer + kullanıldığı fiil (tighten a nut, lubricate a bearing).", "Mevzuat": "Mevzuat sorularında kural kısaltması + yetkili makam eşleşmesi aranır (SHGM = ulusal otorite, EASA = Avrupa). Madde numarasını ezberlemek yerine 'kim, neyi, ne zaman yapar' mantığıyla düşün.", "Edatlar": "Edat sabit kalıpla öğrenilir: IAW (…'e uygun olarak), in accordance WITH, refer TO, conform TO, replace A WITH B, remove FROM, install ON/IN. Cümleyi tek tek kelime değil, kalıp olarak ezberle.", "Dokümantasyon": "Dokümanları amacına göre ayır: AMM (nasıl yapılır), IPC (hangi parça), SB/AD (zorunlu/önerilen değişiklik), MEL (ertelenebilir arıza). 'Nasıl?' → AMM, 'Hangi P/N?' → IPC.", "Emniyet & İnsan Faktörü": "Dirty Dozen (yorgunluk, baskı, iletişim eksikliği, rehavet vb.) ve 'once reported, always report' mantığı: risk gördüğünde dur, bildir, kayda geç. Kısayol (shortcut) hiçbir zaman çözüm değildir.", "Teknik İletişim": "Teknik yazışmada kısa, net, tek anlamlı cümle kur: etken özne yerine edilgen kayıt ('Leak found'), belirsiz kelime yok ('some', 'maybe' yerine ölçülebilir değer).", "Uçak Sistemleri": "Sistemi 'ne yapar → hangi parçalardan oluşur → arızada ne olur' sırasıyla çalış. Örn. hidrolik: basınç üretir (pump), iletir (line), kontrol eder (valve), uygular (actuator).", "Bakım Fiilleri": "Fiil kalıbı: inspect (muayene et), replace (değiştir), remove/install (sök/tak), tighten/torque (sık), lubricate (yağla), service (servis yap), repair (onar), overhaul (revizyon). Kayıtta edilgen ve V3 kullanılır: 'was inspected', 'was torqued'.", "ICAO & Sayılar": "ICAO alfabesi kelime=harf: Alpha, Bravo, Charlie… Rakamlar: 3=Tree, 5=Fife, 9=Niner. Seri numaralarında harfler ICAO kelimesiyle, rakamlar tek tek okunur.", "Bakım Prosedürleri": "Prosedür sırası: hazırlık → güvenlik (emniyet işaret/etiket) → işlem → fonksiyon testi → kayıt/imza. Sırayı karıştıran şıklar genelde yanlıştır; önce emniyet, en son kayıt.", "Koşul & Karşılaştırma": "If-clause kalıpları: 0. tip (If + Present, Present) = genel doğru; 1. tip (If + Present, will) = gerçek olasılık. Karşılaştırma: kısa sıfat + -er than, uzun sıfat more … than; en üstünlük the -est / the most.", "Edilgen Yapı": "Edilgen = be + V3. Zamanı 'be' belirler: is/are checked, was/were checked, has/have been checked, will be checked. Bakım kaydında özne (technician) çoğunlukla yazılmaz.", "İlgi Cümlecikleri": "who = kişi, which = nesne, that = ikisi de (virgülsüz). Virgüllü ek bilgide 'that' kullanılmaz. Parça için: 'The valve WHICH/THAT leaks…'.", "Modal Fiiller": "must = zorunluluk, should = tavsiye, may/can = izin/yetenek, must not = YASAK, don't have to = gerek yok. Emniyet metinlerinde 'shall/must' bağlayıcıdır, 'should' tavsiyedir.", "Dolaylı Anlatım": "Dolaylı anlatımda zaman bir adım geri gider (is→was, will→would, can→could) ve soru cümlesi düz cümle sırasına döner: 'He asked WHERE the tool WAS' (was the tool değil).", "Artikeller": "a/an sesli harfe göre seçilir (harfe değil, SESE): an actuator, a P/N, an hour, a unit. Sayılamayan isimlerin (oil, equipment, information) a/an'ı ve çoğulu yoktur.", "Hatalı Kayıt Avcısı": "Kayıt dili kısa ve edilgendir: 'Filter replaced and torqued IAW AMM.' Kontrol listen: doğru fiil (V3), doğru edat (IAW/with), doğru terim (fluid/below), gereksiz kelime yok.", "V-ing / to V": "Edattan sonra V-ing (before closing, without checking). avoid / finish / suggest / keep + V-ing; need / want / decide / plan + to V. Amaç = to V (… mek için). allow / ask / tell + kişi + to V.", "Bağlaçlar": "because / although + CÜMLE; because of / due to / despite + İSİM veya V-ing. however / therefore ayrı cümle başlatır (virgülle). so that = amaç (+ cümle). although ile but aynı cümlede olmaz."}, "grammarTopics": [{"cat": "Artikeller", "icon": "🔤", "sub": "a / an / the / artikelsiz", "rule": "a/an harfe değil SESE göre seçilir; the bilinen ya da tek olan şeyi gösterir; sayılamayan isimlerde a/an ve çoğul yoktur.", "check": ["İsim sayılabilir mi? (oil, fuel, equipment, information, grease, hardware sayılamaz → a/an YOK, -s YOK).", "Sayılabilir ve tekilse artikelsiz kalamaz: a / an / the / this / my … mutlaka biri gerekir.", "İlk kez mi söyleniyor (a/an), yoksa daha önce geçti / tek / belli mi (the)?", "a mı an mı? Sonraki kelimenin İLK SESİNE bak: sesli → an, sessiz → a."], "trick": "Harfe değil sese bak:  an hour (h okunmaz) • an APU (ey-) • an NDT report (en-) • a unit (yu-) • a one-way valve (wan) • a P/N (pi-).", "traps": ["equipment, information, advice, hardware sayılamaz: ‘a piece of equipment’, ‘an item of information’. ‘equipments’ ✘", "aircraft tekil de çoğul da aynıdır: one aircraft, two aircraft (‘aircrafts’ ✘).", "Genel çoğul anlatımda artikel yok: ‘Rivets are fasteners.’ (the rivets = belirli olanlar).", "Meslek / kimlik cümlesinde a unutulmaz: ‘He is a technician.’"], "table": {"head": ["Durum", "Artikel", "Örnek"], "rows": [["Sesli ses", "an", "an actuator • an hour • an APU • an MEL item"], ["Sessiz ses", "a", "a unit • a one-way valve • a P/N • a UHF antenna"], ["Sayılamayan", "— (artikel yok)", "oil, fuel, equipment, information, grease"], ["Bilinen / tek", "the", "the AMM • the left wing • the filter we replaced"]]}, "ex": [["An actuator moves the flap.", "Bir aktüatör flap'i hareket ettirir. (actuator sesli → an)"], ["The workshop has modern equipment.", "Atölyede modern teçhizat var. (equipment sayılamaz: a/an yok, -s yok)"], ["Use a torque wrench and an adapter.", "Bir tork anahtarı ve bir adaptör kullan. (torque → a, adapter → an)"], ["The leak check takes an hour.", "Sızıntı kontrolü bir saat sürer. (hour → an)"]]}, {"cat": "Fiil Zamanları", "icon": "⏱", "sub": "ipucu kelime → zaman", "rule": "Zaman, cümledeki ipucu kelimeden bulunur. Önce ipucunu işaretle, sonra kalıbı seç.", "check": ["Zaman İPUCU var mı? yesterday / ago / last → Past Simple • since / for / already / yet / just / so far → Present Perfect • now / at the moment → Present Continuous • every / always / usually → Present Simple • by the time / before + geçmiş → Past Perfect • tomorrow / next → will.", "İş bitti mi, sürüyor mu? Zamanı belli bitmiş iş → Past Simple; şimdiyle bağlantılı / zamanı belirsiz sonuç → Present Perfect.", "when / if / before / after / as soon as + GELECEK anlam → o cümlecikte Present Simple (will YOK).", "Özne–fiil uyumu: tekil özne → is / has / was; çoğul özne → are / have / were."], "trick": "Present Perfect = geçmişten bugüne uzanan KÖPRÜ.  since + başlangıç noktası (since Monday) köprünün başı, for + süre (for 3 days) köprünün uzunluğudur. Köprü varsa yesterday / ago gibi ‘kapalı geçmiş’ kelimeleri gelmez.", "traps": ["‘We have replaced it yesterday’ ✘ → ‘We replaced it yesterday’ ✔  (yesterday / ago / last + Past Simple).", "‘When the engine WILL cool down …’ ✘ → ‘When the engine cools down, we will remove the cowling.’ ✔", "know, need, want, belong gibi durum fiilleri -ing almaz: ‘We need …’ (needing ✘).", "since / for karışır:  since 08:00 (nokta)  •  for two hours (süre)."], "table": {"head": ["Zaman", "Kalıp • İpucu", "Havacılık örneği"], "rows": [["Present Simple", "V1 / V-s • every, always, usually", "The pump supplies pressure to the system."], ["Present Continuous", "am/is/are + V-ing • now, at the moment", "The engineer is checking the borescope images now."], ["Past Simple", "V2 • yesterday, ago, last, in 2024", "We replaced the filter two hours ago."], ["Past Continuous", "was/were + V-ing • while, when (kesilen iş)", "While we were inspecting the wing, we found a crack."], ["Present Perfect", "have/has + V3 • since, for, already, yet, just, so far", "The aircraft has been on the ground since Monday."], ["Past Perfect", "had + V3 • by the time, before + geçmiş", "By the time he arrived, we had removed the pump."], ["Future", "will + V1 • tomorrow, next, soon", "The aircraft will be released tomorrow."]]}, "ex": [["We have found no leaks so far.", "Şimdiye kadar hiç sızıntı bulmadık. (so far → Present Perfect)"], ["The wheel was replaced last night.", "Tekerlek dün gece değiştirildi. (last night → Past Simple)"], ["Before you start the engine, check the area.", "Motoru çalıştırmadan önce çevreyi kontrol et. (before + gelecek anlam → Present Simple)"], ["The team had already removed the pump when the supervisor arrived.", "Amir geldiğinde ekip pompayı zaten sökmüştü. (önce biten iş → Past Perfect)"]]}, {"cat": "Edilgen Yapı", "icon": "🔧", "sub": "be + V3  (bakım kaydının dili)", "rule": "Edilgen = be + V3. Zamanı ‘be’ taşır, anlamı V3 taşır. Yapanı bilmediğimiz / önemsemediğimiz işlerde kullanılır; bakım kayıtlarında neredeyse her cümle edilgendir.", "check": ["Yapan kişi önemsiz mi? (Bakım kaydında teknisyen yazılmaz) → edilgen.", "Zamanı belirle:  is/are (genel) • was/were (geçmiş) • has/have been (sonuç şimdi) • will be (gelecek) • is/are being (şu an) • must/can/should be (modal).", "Fiil V3 mü?  replace→replaced, torque→torqued, find→found, write→written, break→broken, take→taken, do→done.", "Özne tekil/çoğul → is/are, was/were, has/have uyumunu kontrol et."], "trick": "Bakım kaydı kısaltması:  ‘be’ de düşer →  “Filter replaced. Leak check performed. Task signed off.”  Yani kayıtta sadece V3 görürsen edilgen demektir.", "traps": ["Geçişsiz fiiller edilgen olmaz: happen, occur, arrive, exist, belong. ‘The leak was happened’ ✘ → ‘The leak happened’ ✔", "V3 hatası: ‘was find’ ✘ → ‘was found’ ✔ ;  ‘was torque’ ✘ → ‘was torqued’ ✔.", "Yapan önemliyse by kullan: ‘was inspected BY the inspector’; önemsizse yazma.", "‘have + V3’ tek başına edilgen değildir; edilgen için has/have BEEN + V3 gerekir."], "table": {"head": ["Zaman", "Edilgen kalıp", "Örnek"], "rows": [["Present Simple", "am/is/are + V3", "The oil is changed every 100 hours."], ["Past Simple", "was/were + V3", "The wheel was removed yesterday."], ["Present Perfect", "has/have been + V3", "The filter has been replaced."], ["Present Continuous", "is/are being + V3", "The engine is being inspected now."], ["Future", "will be + V3", "The aircraft will be released tomorrow."], ["Modal", "must/can/should be + V3", "Bolts must be torqued IAW the AMM."]]}, "ex": [["The hydraulic filter was replaced and a leak check was performed.", "Hidrolik filtre değiştirildi ve sızıntı kontrolü yapıldı."], ["Cracks were found on the skin panel.", "Kaplama panelinde çatlaklar bulundu. (find → found, çoğul → were)"], ["The defective part has been quarantined.", "Kusurlu parça karantinaya alındı. (sonuç şimdi geçerli → has been + V3)"], ["All tools must be accounted for.", "Tüm aletlerin sayımı yapılmalıdır. (modal edilgen)"]]}, {"cat": "Modal Fiiller", "icon": "🚦", "sub": "must / should / may / can", "rule": "must = zorunluluk • should = tavsiye • may/can = izin/yetenek • must not = YASAK • don't have to = gerek YOK. Emniyet metinlerinde shall/must bağlayıcıdır.", "check": ["Anlamı sor: zorunluluk mu, yasak mı, tavsiye mi, izin mi?", "Yasak mı, gerek yok mu? must not = YASAK  •  don't have to / needn't = yapman gerekmiyor (serbest).", "Modal'dan sonra YALIN fiil gelir: must check, can remove (to yok, -s yok).", "Geçmiş: had to (zorundaydı) • could (yapabiliyordu) • should have + V3 (yapmalıydı ama yapmadı)."], "trick": "Trafik ışığı:  🔴 must not / shall not (yasak)   🟡 should (tavsiye)   🟢 may / can (izin).  Zorunluluk için üst sıra: shall / must.", "traps": ["must not ≠ don't have to  →  ‘You must not start the engine’ = yasak;  ‘You don't have to replace it’ = gerek yok.", "‘must to check’ ✘, ‘can removes’ ✘ → modal + yalın fiil: ‘must check’, ‘can remove’.", "should tavsiyedir; AMM'de ‘shall / must’ görürsen bağlayıcıdır.", "should have + V3 yapılmayan işi eleştirir: ‘He should have reported the damage.’"], "table": {"head": ["Modal", "Anlam", "Örnek"], "rows": [["must / shall", "zorunluluk", "Technicians must wear PPE."], ["must not / shall not", "YASAK", "You must not start the engine with the cowls open."], ["don't have to / needn't", "gerek yok", "You don't have to replace the filter yet."], ["should", "tavsiye", "You should report every defect."], ["may / can", "izin / yetki", "Only certifying staff may sign the CRS."], ["should have + V3", "yapmalıydı (yapmadı)", "He should have reported the damage."]]}, "ex": [["Only certifying staff may sign the CRS.", "CRS'yi yalnızca onaylama yetkili personel imzalayabilir. (may = yetki)"], ["You must not use a damaged tool.", "Hasarlı alet kullanmamalısın. (yasak)"], ["You don't have to replace the filter yet.", "Filtreyi henüz değiştirmek zorunda değilsin. (yasak değil, gerek yok)"], ["The task should have been signed off earlier.", "İş daha önce imzalanmış olmalıydı. (should have been + V3)"]]}, {"cat": "Koşul & Karşılaştırma", "icon": "⚖", "sub": "if cümleleri • -er than • the most", "rule": "If cümlesinde ‘if’ tarafı asla will almaz. 0. tip: If + Present, Present (genel doğru). 1. tip: If + Present, will (gerçek olasılık). Karşılaştırma: kısa sıfat -er than; uzun sıfat more … than.", "check": ["Cümle her zaman doğru bir kural mı? → 0. tip: If + Present, Present.", "Gerçekten olabilecek bir gelecek mi? → 1. tip: If + Present, will / can / must + V1.", "Hayali / gerçek dışı mı? → 2. tip: If + Past, would + V1.", "Karşılaştırma: kısa sıfat → -er than / the -est;  uzun sıfat → more … than / the most …;  düzensiz: good-better-best, bad-worse-worst."], "trick": "If'li cümlede iki yarı vardır: ‘if’ yarısı şimdiki zaman (will YOK), sonuç yarısı will alır.  unless = if … not (içinde zaten olumsuzluk var, tekrar not ekleme).", "traps": ["‘If it will rain’ ✘ → ‘If it rains’ ✔ ;  ‘If you will find a crack’ ✘.", "‘more better’ ✘, ‘most easiest’ ✘ → better, the easiest.", "‘Unless you don't torque …’ ✘ → ‘Unless you torque it, it may loosen.’", "than ≠ then:  ‘lighter THAN the old one’ (karşılaştırma),  ‘then’ = sonra."], "table": {"head": ["Tip", "Kalıp", "Örnek"], "rows": [["0. tip (genel doğru)", "If + Present, Present", "If the oil level is low, the warning light comes on."], ["1. tip (gerçek olasılık)", "If + Present, will + V1", "If you find a crack, you will report it."], ["2. tip (hayali)", "If + Past, would + V1", "If we had more tools, we would finish earlier."], ["3. tip (geçmiş pişmanlık)", "If + Past Perfect, would have + V3", "If he had checked the torque, the bolt would not have failed."], ["Karşılaştırma", "-er than / more … than", "The new filter is lighter than the old one."], ["En üstünlük", "the -est / the most …", "This is the most complex repair we have done."]]}, "ex": [["If the oil level is low, the warning light comes on.", "Yağ seviyesi düşükse uyarı lambası yanar. (0. tip)"], ["If you find a crack, you will report it.", "Çatlak bulursan bildireceksin. (1. tip)"], ["Unless you torque the nut, it may loosen.", "Somunu torklamazsan gevşeyebilir. (unless = if not)"], ["This tool is lighter than the old one.", "Bu alet eskisinden daha hafif. (kısa sıfat → -er than)"]]}, {"cat": "İlgi Cümlecikleri", "icon": "🔗", "sub": "who / which / that / where / whose", "rule": "who = kişi • which = nesne • that = ikisi de (virgülsüz) • where = yer • whose = kimin. Virgüllü ek bilgide that kullanılmaz.", "check": ["Cümlecik kimden / neden bahsediyor? Kişi → who • nesne → which • yer → where • sahiplik → whose.", "Virgül var mı? Virgüllü (ek bilgi) → that OLMAZ, which / who kullan. Virgülsüz → that olur.", "Zamir cümleciğin ÖZNESİ mi? Özneyse ikinci bir özne ekleme: ‘The valve which leaks’ (which it leaks ✘).", "Fiil uyumu: ‘The valves which leak …’ (çoğul), ‘The valve which leaks …’ (tekil)."], "trick": "WHO insan • WHICH şey • THAT ikisi (virgül yoksa) • WHERE yer • WHOSE + isim.   Virgül görürsen that'i çiz.", "traps": ["‘The part, that was NRFI, …’ ✘ → ‘The part, which was NRFI, …’ ✔", "‘The valve which it leaks’ ✘ → ‘The valve which leaks’ ✔ (which zaten özne).", "who / which karışır: kişi için which kullanma, parça için who kullanma.", "‘whose’ ardından isim gelir: ‘The engineer whose team found the crack …’"], "table": {"head": ["Zamir", "Kime / neye", "Örnek"], "rows": [["who", "kişi", "The engineer who inspected the wing found a crack."], ["which", "nesne / parça", "The valve which leaks must be replaced."], ["that", "kişi veya nesne (virgülsüz)", "The tool that I used was out of calibration."], ["where", "yer", "The hangar where we repair the aircraft is large."], ["whose", "sahiplik", "The technician whose tool was missing reported it."]]}, "ex": [["The technician who signed the job card is on leave.", "İş kartını imzalayan teknisyen izinde. (kişi → who)"], ["The valve which leaks must be replaced.", "Sızdıran valf değiştirilmelidir. (nesne → which)"], ["The part, which was NRFI, was removed.", "NRFI olan parça sökülmüştü. (virgüllü → that olmaz)"], ["The hangar where we repair the aircraft is large.", "Uçakları onardığımız hangar büyük. (yer → where)"]]}, {"cat": "Dolaylı Anlatım", "icon": "💬", "sub": "said / asked / told", "rule": "Dolaylı anlatımda zaman bir adım geri gider (is→was, will→would, can→could) ve soru cümlesi düz cümle sırasına döner: ‘He asked where the tool WAS’.", "check": ["Aktaran fiil geçmiş mi (said, asked, told)? Evetse zamanı bir adım geri al.", "Zaman geri:  am/is → was • are → were • do/does → did • will → would • can → could • may → might • has/have → had • Past Simple → Past Perfect.", "Zaman ve yer zarfları: now → then • today → that day • tomorrow → the next day • yesterday → the day before • here → there • this → that.", "Soru ise DÜZ cümle sırası (özne + fiil), soru işareti ve do/does/did kalkar. Yes/no sorusu → if / whether.", "told + KİŞİ (told me), said + (that). Emir: told + kişi + (not) to V1."], "trick": "Aktarılan soru artık soru değildir: ‘Where is the tool?’ → ‘She asked where the tool was.’  (was the tool ✘).", "traps": ["‘She asked where was the tool’ ✘ → ‘where the tool was’ ✔.", "‘He said me’ ✘ → ‘He told me’ / ‘He said to me’ ✔ ;  ‘She told that …’ ✘ → ‘She told me that …’.", "Yes/no sorusu: ‘He asked did I torque it’ ✘ → ‘He asked if I had torqued it.’", "Olumsuz emir: ‘told us not to start’ ✔ (don't start ✘)."], "table": {"head": ["Doğrudan", "Dolaylı", "Kural"], "rows": [["“The tool is in the hangar.”", "He said that the tool was in the hangar.", "is → was"], ["“I will sign the CRS.”", "He said he would sign the CRS.", "will → would"], ["“Where is the log book?”", "She asked where the log book was.", "düz sıra + was"], ["“Did you torque the bolt?”", "He asked if I had torqued the bolt.", "if + Past Perfect"], ["“Check the oil.”", "He told me to check the oil.", "told + kişi + to V1"]]}, "ex": [["She asked where the tool was.", "Aletin nerede olduğunu sordu. (soru → düz cümle)"], ["He said that the aircraft was serviceable.", "Uçağın hizmete elverişli olduğunu söyledi. (is → was)"], ["The inspector asked whether we had torqued the bolts.", "Müfettiş cıvataları torklayıp torklamadığımızı sordu. (Past → Past Perfect)"], ["The supervisor told us not to start the engine.", "Amir bize motoru çalıştırmamamızı söyledi. (told + kişi + not to V1)"]]}, {"cat": "Edatlar", "icon": "📍", "sub": "kalıp olarak ezberle", "rule": "Edat tek tek değil KALIP olarak öğrenilir: in accordance WITH, refer TO, conform TO, replace A WITH B, remove FROM, check FOR, depend ON.", "check": ["Sabit kalıp mı? (accordance WITH, refer TO, responsible FOR, consist OF, depend ON) → kalıbı hatırla.", "Yer/yön mü? in (içinde) • on (yüzeyinde) • at (noktada) • under/below (altında) • above (üstünde) • between (iki şey arası) • behind (arkasında).", "Zaman mı? at + saat • on + gün • in + ay/yıl • during + olay • within + süre içinde • for + süre • since + başlangıç • by + son tarih.", "Edattan sonra fiil gelirse V-ing olur: before closing, after removing, without checking."], "trick": "Kalıbı cümlenin içinde ezberle:  ‘Torque IAW the AMM.’ • ‘Refer TO the IPC.’ • ‘Replace the seal WITH a new one.’ • ‘Check the surface FOR cracks.’", "traps": ["depend of ✘ → depend ON ;  comply to ✘ → comply WITH ;  discuss about ✘ → discuss.", "during (olay: during the inspection) ↔ for (süre: for two hours).", "by (en geç: by Friday) ↔ until (o ana kadar sürer: until Friday).", "between (iki şey) ↔ among (üç ve fazlası)."], "table": {"head": ["Edat", "Kalıp", "Havacılık örneği"], "rows": [["WITH", "replace A with B • comply with • in accordance with", "Replace the seal with a new one."], ["FROM", "remove … from • protect … from", "Remove the panel from the wing."], ["TO", "refer to • conform to • connect A to B", "Refer to the AMM for the correct procedure."], ["FOR", "check for • responsible for", "Check the surface for cracks."], ["ON", "depend on • install on", "The interval depends on flight hours."], ["OF", "consist of • free of", "The system consists of two pumps."], ["BY / WITHIN", "by Friday • within limits", "The tire pressure is within limits."]]}, "ex": [["Torque all bolts in accordance with the AMM.", "Tüm cıvataları AMM'ye uygun olarak torkla. (in accordance WITH)"], ["Refer to the IPC for the correct part number.", "Doğru parça numarası için IPC'ye bak. (refer TO)"], ["Check the surface for cracks and corrosion.", "Yüzeyi çatlak ve korozyon açısından kontrol et. (check FOR)"], ["The task depends on the availability of spare parts.", "İş, yedek parça bulunabilirliğine bağlı. (depend ON)"]]}, {"cat": "V-ing / to V", "icon": "🔁", "sub": "edattan sonra V-ing • karar/plan → to V", "rule": "Edattan sonra V-ing gelir. Bazı fiiller V-ing ister (avoid, finish, suggest, keep), bazıları to V (need, want, decide, plan, agree). Amaç bildirirken to V kullanılır.", "check": ["Boşluğun önünde edat var mı (before, after, without, by, for, of)? → V-ing: ‘without checking’.", "Fiil listesi: avoid, finish, keep, suggest, consider, recommend, delay → V-ing.  need, want, decide, plan, agree, refuse, fail, manage → to V.", "Amaç mı? ‘to check’ = kontrol etmek için (= in order to check).", "allow / permit / ask / tell + KİŞİ + to V1;  let / make + kişi + V1 (to yok)."], "trick": "EDAT → V-ing.   İSTEK / KARAR / PLAN → to V (gelecek odaklı).   BİTİRME / KAÇINMA / ÖNERME → V-ing.   Amaç → to V.", "traps": ["‘without to check’ ✘ → ‘without checking’ ✔ ;  ‘avoid to touch’ ✘ → ‘avoid touching’.", "‘suggest to replace’ ✘ → ‘suggest replacing’ ✔.", "stop + V-ing (bırak) ≠ stop + to V (durup şunu yap): ‘stop checking’ ≠ ‘stop to check’.", "be used to + V-ing (alışkın) ≠ is used to + V1 (…için kullanılır): ‘This tool is used to measure torque.’"], "table": {"head": ["Kalıp", "Ne zaman", "Örnek"], "rows": [["edat + V-ing", "before / after / without / by / for", "Check the area before closing the panel."], ["avoid, finish, suggest + V-ing", "kaçınma • bitirme • önerme", "Avoid touching the hot surface."], ["need, decide, plan + to V", "istek • karar • plan", "We need to replace the seal."], ["allow / ask / tell + kişi + to V", "izin • rica • talimat", "The AMM allows technicians to use an equivalent tool."], ["to V (amaç)", "…mek için", "Use a torque wrench to apply the correct torque."], ["prevent … from + V-ing", "…den alıkoymak", "The gasket prevents oil from leaking."]]}, "ex": [["The aircraft was released without performing a leak check.", "Uçak sızıntı kontrolü yapılmadan hizmete verildi. (without + V-ing)"], ["We need to replace the seal before the next flight.", "Contayı bir sonraki uçuştan önce değiştirmemiz gerek. (need + to V)"], ["The supervisor suggested replacing the filter.", "Amir filtrenin değiştirilmesini önerdi. (suggest + V-ing)"], ["Use a torque wrench to apply the correct torque.", "Doğru torku uygulamak için tork anahtarı kullan. (amaç → to V)"]]}, {"cat": "Bağlaçlar", "icon": "🧷", "sub": "because / although / therefore / so that", "rule": "Bağlaçtan sonra gelen yapıyı bil: because + CÜMLE, because of / due to + İSİM; although + CÜMLE, despite + İSİM/V-ing; however / therefore ayrı cümle başlatır.", "check": ["Bağlacın ardından tam cümle (özne + fiil) mi var, yoksa isim / V-ing mi?", "Cümle geliyorsa: because, although, while, since, so that, if, unless.  İsim / V-ing geliyorsa: because of, due to, despite, in spite of, during.", "İki ayrı cümleyi bağlıyorsa: ‘However,’ / ‘Therefore,’ / ‘Moreover,’ → nokta ya da noktalı virgülden sonra gelir, ardından virgül.", "Anlam yönü:  zıtlık (but, although, however, despite) • sebep (because, since, due to) • sonuç (so, therefore) • ekleme (and, moreover, in addition)."], "trick": "Bağlaç sonrası kontrol:  ‘özne + fiil’ var → because / although.   Sadece isim var → because OF / DESPITE.   Zıtlık için although ile but'ı aynı cümlede birleştirme.", "traps": ["‘because of the crack was sma function defaultProgress(keepSettings){

    }
  };
}
function loadProgress(){
  let base = deepCopy(APP_DATA.progress);
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && typeof saved === "object"){
        const useSaved = Boolean(saved._reset_at) ||
          ((saved.total_xp || 0) >= (base.total_xp || 0)) ||
          ((saved.answered || 0) > (base.answered || 0));
        if(useSaved){
          base = Object.assign(defaultProgress(), saved);
          base.settings = Object.assign(deepCopy(APP_DATA.progress.settings), saved.settings || {});
        }
      }
    }
  }catch(e){}
  return base;
}

function getSyncCfg(){
  try{
    const o = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || "{}");
    return { gistId: (o.gistId||"").trim(), token: (o.token||"").trim(), auto: o.auto !== false, last: o.last || "" };
  }catch(e){ return { gistId:"", token:"", auto:true, last:"" }; }
}
function setSyncCfg(cfg){
  try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  updateSyncBtn();
}
function getSyncBase(){
  try{ const raw = localStorage.getItem(SYNC_BASE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function setSyncBase(obj){
  try{ localStorage.setItem(SYNC_BASE_KEY, JSON.stringify(obj)); }catch(e){}
}
function levelFromXP(totalXp){
  let rem = Math.max(0, Math.floor(Number(totalXp)||0));
  let lv = 1;
  while(rem >= xpNeeded(lv)){ rem -= xpNeeded(lv); lv++; }
  return [lv, rem];
}
function sanitizeForCloud(p){
  const out = deepCopy(p);
  delete out._reset_at;
  if(out.settings){
    delete out.settings.ota_token;
    delete out.settings.sync_token;
    delete out.settings.token;
  }
  return out;
}
function mergeNum(a, b, baseVal){
  const na = Math.floor(Number(a)||0), nb = Math.floor(Number(b)||0);
  if(baseVal === undefined || baseVal === null) return Math.max(na, nb);
  const bv = Math.floor(Number(baseVal)||0);
  return Math.max(0, bv + (na - bv) + (nb - bv));
}
function mergeSet3Way(aArr, bArr, baseArr){
  const aS = new Set(aArr || []), bS = new Set(bArr || []);
  if(!Array.isArray(baseArr)) return [...new Set([...aS, ...bS])].sort();
  const bs = new Set(baseArr);
  const res = new Set();
  for(const x of aS){ if(bS.has(x) || !bs.has(x)) res.add(x); }
  for(const x of bS){ if(!bs.has(x)) res.add(x); }
  return [...res].sort();
}
function mergeProgress3Way(localP, remoteP, baseP){
  const a = Object.assign(defaultProgress(), deepCopy(localP || {}));
  a.settings = Object.assign(defaultProgress().settings, (localP && localP.settings) || {});
  const b = Object.assign(defaultProgress(), deepCopy(remoteP || {}));
  b.settings = Object.assign(defaultProgress().settings, (remoteP && remoteP.settings) || {});
  const hasBase = Boolean(baseP && typeof baseP === "object");
  const base = hasBase ? baseP : {};

  const out = defaultProgress(a.settings);
  out.total_xp = mergeNum(a.total_xp, b.total_xp, hasBase ? base.total_xp : null);
  const [lv, rem] = levelFromXP(out.total_xp);
  out.level = lv; out.xp_in_level = rem;
  out.best_streak = Math.max(Number(a.best_streak)||0, Number(b.best_streak)||0);
  out.games = mergeNum(a.games, b.games, hasBase ? base.games : null);
  out.answered = mergeNum(a.answered, b.answered, hasBase ? base.answered : null);
  out.correct = mergeNum(a.correct, b.correct, hasBase ? base.correct : null);
  if(out.correct > out.answered) out.answered = out.correct;

  out.known = [...new Set([...(a.known||[]).map(Number), ...(b.known||[]).map(Number)])].filter(n => !isNaN(n)).sort((x,y)=>x-y);
  out.ach = [...new Set([...(a.ach||[]), ...(b.ach||[])])].sort();
  out.wrong_keys = mergeSet3Way(a.wrong_keys, b.wrong_keys, hasBase ? base.wrong_keys : null);
  out.fav_keys = mergeSet3Way(a.fav_keys, b.fav_keys, hasBase ? base.fav_keys : null);

  const bCats = (hasBase && base.cat_stats) || {};
  for(const c of new Set([...Object.keys(a.cat_stats||{}), ...Object.keys(b.cat_stats||{})])){
    const [ao, at] = (a.cat_stats && a.cat_stats[c]) || [0,0];
    const [bo, bt] = (b.cat_stats && b.cat_stats[c]) || [0,0];
    const [bso, bst] = hasBase ? (bCats[c] || [0,0]) : [null, null];
    const mo = mergeNum(ao, bo, bso);
    const mt = mergeNum(at, bt, bst);
    out.cat_stats[c] = [mo, Math.max(mo, mt)];
  }

  const bDaily = (hasBase && base.daily) || {};
  for(const d of [...new Set([...Object.keys(a.daily||{}), ...Object.keys(b.daily||{})])].sort()){
    out.daily[d] = mergeNum((a.daily||{})[d]||0, (b.daily||{})[d]||0, hasBase ? (bDaily[d]||0) : null);
  }

  out.last_day = [String(a.last_day||""), String(b.last_day||"")].sort()[1];
  out.streak_days = Math.max(Number(a.streak_days)||0, Number(b.streak_days)||0);
  out.goal_days = Math.max(Number(a.goal_days)||0, Number(b.goal_days)||0);
  out.goal_done_day = [String(a.goal_done_day||""), String(b.goal_done_day||"")].sort()[1];

  const bSrs = (hasBase && base.srs) || {};
  for(const k of new Set([...Object.keys(a.srs||{}), ...Object.keys(b.srs||{})])){
    const av = (a.srs||{})[k], bv = (b.srs||{})[k];
    if(av && !bv) out.srs[k] = av;
    else if(bv && !av) out.srs[k] = bv;
    else{
      const baseV = hasBase ? bSrs[k] : null;
      const eq = (x, y) => x && y && x[0]===y[0] && x[1]===y[1];
      if(baseV && eq(av, baseV) && !eq(bv, baseV)) out.srs[k] = bv;
      else if(baseV && eq(bv, baseV) && !eq(av, baseV)) out.srs[k] = av;
      else out.srs[k] = (String(av[1]) > String(bv[1]) || (av[1]===bv[1] && av[0]>=bv[0])) ? av : bv;
    }
  }

  const exMap = {};
  for(const e of [...(a.exams||[]), ...(b.exams||[])]){
    const sig = `${e.date||""}|${e.score||0}|${e.correct||0}|${e.total||0}|${e.kind||""}`;
    exMap[sig] = e;
  }
  out.exams = Object.values(exMap).sort((x,y) => String(x.date||"").localeCompare(String(y.date||""))).slice(-20);

  const bMini = (hasBase && base.mini) || {};
  for(const k of new Set([...Object.keys(a.mini||{}), ...Object.keys(b.mini||{})])){
    out.mini[k] = mergeNum((a.mini||{})[k]||0, (b.mini||{})[k]||0, hasBase ? (bMini[k]||0) : null);
  }

  const swMap = {};
  for(const w of [...(b.saved_words||[]), ...(a.saved_words||[])]){
    const k = String(w.en||"").trim().toLowerCase();
    if(!k) continue;
    if(!swMap[k]) swMap[k] = deepCopy(w);
    else if(!swMap[k].tr && w.tr) swMap[k].tr = w.tr;
  }
  out.saved_words = Object.values(swMap);

  const bPlog = (hasBase && base.plan_log) || {};
  for(const d of [...new Set([...Object.keys(a.plan_log||{}), ...Object.keys(b.plan_log||{})])].sort().slice(-60)){
    const ad = (a.plan_log||{})[d] || {}, bd = (b.plan_log||{})[d] || {}, bsd = bPlog[d] || {};
    out.plan_log[d] = {};
    for(const k of new Set([...Object.keys(ad), ...Object.keys(bd)])){
      if(k === "_bonus") out.plan_log[d][k] = Math.max(Number(ad[k])||0, Number(bd[k])||0);
      else out.plan_log[d][k] = mergeNum(ad[k]||0, bd[k]||0, hasBase ? (bsd[k]||0) : null);
    }
  }

  // Yerel ayarlar (tema, OTA link/token) korunur, sinav tarihi bossa uzaktan alinir
  out.settings = Object.assign({}, b.settings, a.settings);
  if(!out.settings.exam_date && b.settings.exam_date) out.settings.exam_date = b.settings.exam_date;
  return out;
}

function updateSyncBtn(){
  const btn = document.getElementById("syncTopBtn");
  if(!btn) return;
  const cfg = getSyncCfg();
  if(syncBusy){ btn.textContent = "⏳"; btn.style.borderColor = "var(--gold)"; }
  else if(cfg.gistId && cfg.token){ btn.textContent = "☁️"; btn.style.borderColor = "var(--green)"; }
  else { btn.textContent = "☁️"; btn.style.borderColor = "var(--border)"; }
}

async function cloudSync(silent=false){
  const cfg = getSyncCfg();
  if(!cfg.gistId || !cfg.token){
    if(!silent){ toast("Önce Ayarlar'dan PC bağlantı kodunu gir", "--gold"); nav("settings"); }
    return false;
  }
  if(syncBusy) return false;
  syncBusy = true;
  updateSyncBtn();
  const stEl = document.getElementById("syncStatus");
  if(stEl && !silent){ stEl.style.color = "var(--gold)"; stEl.textContent = "Bulutla eşitleniyor..."; }
  try{
    const headers = {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json"
    };
    const r1 = await fetch(`https://api.github.com/gists/${encodeURIComponent(cfg.gistId)}?t=${Date.now()}`, { headers, cache:"no-store" });
    if(!r1.ok) throw new Error(`HTTP ${r1.status} (Gist ID veya Token hatalı olabilir)`);
    const gist = await r1.json();
    const fobj = gist.files && gist.files[SYNC_GIST_FILE];
    const remoteP = (fobj && fobj.content) ? JSON.parse(fobj.content) : {};

    const merged = mergeProgress3Way(P, remoteP, getSyncBase());
    const cloudObj = sanitizeForCloud(merged);

    const r2 = await fetch(`https://api.github.com/gists/${encodeURIComponent(cfg.gistId)}`, {
      method: "PATCH",
      headers: Object.assign({}, headers, { "Content-Type": "application/json" }),
      body: JSON.stringify({ files: { [SYNC_GIST_FILE]: { content: JSON.stringify(cloudObj, null, 1) } } })
    });
    if(!r2.ok) throw new Error(`Gönderme hatası: HTTP ${r2.status}`);

    P = merged;
    setSyncBase(cloudObj);
    const nowD = new Date();
    cfg.last = fmtDateTR(nowD) + " " + String(nowD.getHours()).padStart(2,"0") + ":" + String(nowD.getMinutes()).padStart(2,"0");
    setSyncCfg(cfg);
    applyTheme(P.settings.theme || "Kokpit (Amber)");
    saveProgress();

    const msg = `☁️ Eşitlendi! Lv ${P.level} • ${P.total_xp} XP • ${P.correct}/${P.answered}`;
    if(stEl){ stEl.style.color = "var(--green)"; stEl.textContent = msg + ` (${cfg.last})`; }
    if(!silent) toast(msg, "--green", "ok");
    if(["home","stats","plan","notebook"].includes(currentPage)) nav(currentPage);
    return true;
  }catch(err){
    const em = "Eşitleme hatası: " + (err && err.message ? err.message : err);
    if(stEl){ stEl.style.color = "var(--red)"; stEl.textContent = em; }
    if(!silent) toast(em, "--red", "bad");
    return false;
  }finally{
    syncBusy = false;
    updateSyncBtn();
  }
}


// ---- Yardımcılar
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseDate(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{2})[./](\d{2})[./](\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}
function fmtDateTR(d){
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function dayDiff(a, b){
  const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((utcA - utcB) / 86400000);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function xpNeeded(lv){ return 100 + (lv - 1) * 50; }
function rankOf(lv){
  let nm = APP_DATA.ranks[0][1];
  for(const [l, r] of APP_DATA.ranks){ if(lv >= l) nm = r; }
  return nm;
}
function paceInfo(done, n, elapsed, total){
  if(total <= 0 || n <= 0) return { text: "", color: "var(--muted)" };
  const gap = (elapsed / total) * n - done;
  if(gap > 2) return { text: `🐢 ${Math.round(gap)} soru geride`, color: "var(--red)" };
  if(gap < -2) return { text: `🚀 ${Math.round(-gap)} soru önde`, color: "var(--green)" };
  return { text: "✓ tempoda", color: "var(--teal)" };
}
function applyTheme(name){
  const th = APP_DATA.themes[name] || APP_DATA.themes["Kokpit (Amber)"];
  const root = document.documentElement;
  for(const [k,v] of Object.entries(th)){ root.style.setProperty("--"+k, v); }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", th.side);
}

// ---- Web Audio Ses Motoru & Web Speech TTS
let audioCtx = null;
function playTone(freq, dur, type="sine", gain=0.18, delay=0){
  if(!P.settings.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const vol = Math.max(0.05, Math.min(1, (P.settings.volume || 60) / 100));
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    const t0 = audioCtx.currentTime + delay;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(gain * vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }catch(e){}
}
function sfx(kind, step=0){
  if(!P.settings.sound) return;
  if(kind === "ok"){
    const mult = Math.pow(2, ([0,2,4,7,9][Math.min(4, Math.max(0, step))])/12);
    playTone(880*mult, 0.22, "sine", 0.2, 0);
    playTone(1318*mult, 0.30, "sine", 0.2, 0.07);
  }else if(kind === "combo" || kind === "ach" || kind === "level" || kind === "win"){
    [523,659,784,1046].forEach((f,i) => playTone(f, 0.28, "triangle", 0.22, i*0.07));
  }else if(kind === "bad" || kind === "heart" || kind === "gameover"){
    playTone(196, 0.16, "triangle", 0.22, 0);
    playTone(138, 0.32, "triangle", 0.22, 0.12);
  }else if(kind === "click" || kind === "pop"){
    playTone(1100, 0.05, "sine", 0.08, 0);
  }else if(kind === "flip"){
    playTone(620, 0.08, "sine", 0.1, 0);
  }else if(kind === "tick"){
    playTone(1600, 0.04, "sine", 0.12, 0);
  }
}
function speak(text){
  if(!P.settings.tts || !("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text || "").replace(/[_]/g," ").slice(0, 450));
    u.lang = "en-US";
    u.rate = 0.92;
    const vs = window.speechSynthesis.getVoices();
    const en = vs.find(v => /^en[-_](US|GB)/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if(en) u.voice = en;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function toast(msg, colorVar="--gold", sound=null){
  if(sound) sfx(sound);
  document.querySelectorAll(".toast").forEach(el => el.remove());
  const d = document.createElement("div");
  d.className = "toast";
  d.style.background = `var(${colorVar})`;
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2500);
}

// ---- Oyun & SRS Mantığı
function addXP(amt){
  let leveled = false;
  P.xp_in_level += amt;
  P.total_xp += amt;
  while(P.xp_in_level >= xpNeeded(P.level)){
    P.xp_in_level -= xpNeeded(P.level);
    P.level += 1;
    leveled = true;
  }
  if(leveled) toast(`⭐ SEVİYE ATLADIN! Lv ${P.level} – ${rankOf(P.level)}`, "--gold", "level");
  updateHeader();
  return leveled;
}
function checkAch(){
  const gramOk = Object.entries(P.cat_stats).reduce((s,[c,v]) => s + (GRAMMAR_SET.has(c)?v[0]:0), 0);
  const mast = Object.values(P.srs).filter(v => v[0] >= 5).length;
  const rules = {
    first: P.correct >= 1, c100: P.correct >= 100, c500: P.correct >= 500, c1500: P.correct >= 1500,
    s10: P.best_streak >= 10, s25: P.best_streak >= 25, lv5: P.level >= 5, lv10: P.level >= 10,
    d7: P.streak_days >= 7, d30: P.streak_days >= 30, goal: P.goal_days >= 1,
    w100: P.known.length >= 100, w500: P.known.length >= 500, mast: mast >= 50,
    gram50: gramOk >= 50, gram200: gramOk >= 200, build5: (P.mini.builder || 0) >= 5
  };
  for(const [aid, ic, ti] of APP_DATA.achievements){
    if(rules[aid] && !P.ach.includes(aid)){
      P.ach.push(aid);
      toast(`${ic} Başarım: ${ti}`, "--violet", "ach");
    }
  }
}
function unlockAch(aid){
  if(P.ach.includes(aid)) return;
  const f = APP_DATA.achievements.find(a => a[0] === aid);
  if(f){ P.ach.push(aid); toast(`${f[1]} Başarım: ${f[2]}`, "--violet", "ach"); }
}
function touchDay(){
  const t = todayISO();
  if(P.last_day !== t){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yISO = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    P.streak_days = (P.last_day === yISO) ? (P.streak_days + 1) : 1;
    P.last_day = t;
  }
  P.daily[t] = (P.daily[t] || 0) + 1;
  const goal = P.settings.daily_goal || 30;
  if(P.daily[t] >= goal && P.goal_done_day !== t){
    P.goal_done_day = t;
    P.goal_days += 1;
    toast("🎯 Günlük hedef tamamlandı!", "--green", "ach");
  }
  checkAch();
}
function planKindOf(q){
  const t = q.type || "vocab";
  if(t === "gap") return q.context ? "cloze" : "sentence";
  return t === "paragraph" ? "reading" : t;
}
function planNote(kind, n=1){
  const t = todayISO();
  if(!P.plan_log) P.plan_log = {};
  if(!P.plan_log[t]) P.plan_log[t] = {};
  P.plan_log[t][kind] = (P.plan_log[t][kind] || 0) + n;
}
function srsUpdate(key, ok){
  const cur = P.srs[key] ? P.srs[key][0] : 0;
  const box = ok ? Math.min(cur + 1, 5) : 1;
  const days = APP_DATA.srsDays[String(box)] || 0;
  const d = new Date(); d.setDate(d.getDate() + days);
  const due = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  P.srs[key] = [box, due];
  if(BY_KEY[key]) planNote(planKindOf(BY_KEY[key]));
}
function srsTag(key){
  const s = P.srs[key];
  if(!s) return ["YENİ", "var(--accent)"];
  return s[0] <= 3 ? ["NRFI", "var(--nrfi)"] : ["RFI", "var(--rfi)"];
}
function weakCats(limit=3){
  return Object.entries(P.cat_stats)
    .filter(([,[ok,tot]]) => tot >= 5 && ok/tot < 0.8)
    .sort((a,b) => (a[1][0]/a[1][1]) - (b[1][0]/b[1][1]))
    .slice(0, limit).map(x => x[0]);
}
function dueCount(){
  const t = todayISO();
  return Object.values(P.srs).filter(v => v[1] <= t).length;
}
function vocabSets(){
  const out = [];
  const sz = APP_DATA.constants.VOCAB_SET;
  for(const [lbl, lo, hi, shift] of [["Havacılık Kelime", 5001, 9999, 5000], ["YDS Kelime", 1, 4999, 0]]){
    const ns = APP_DATA.words.filter(w => w.n >= lo && w.n <= hi).map(w => w.n).sort((a,b)=>a-b);
    if(!ns.length) continue;
    for(let a=ns[0]; a<=ns[ns.length-1]; a+=sz){
      const b = Math.min(a + sz - 1, ns[ns.length-1]);
      if(ns.some(n => n>=a && n<=b)) out.push([`${lbl} ${a-shift}–${b-shift}`, a, b]);
    }
  }
  return out;
}
function vocabQuestion(w, dir, cat="YDS Kelime"){
  const others = shuffle(APP_DATA.words).slice(0, 40);
  const correct = dir === "en" ? w.short : w.en;
  const stem = dir === "en"
    ? `"${w.en}" kelimesinin Türkçe karşılığı nedir?`
    : `"${w.short}" anlamına gelen İngilizce kelime hangisi?`;
  const dis = [];
  for(const o of others){
    const cand = dir === "en" ? o.short : o.en;
    if(cand.toLowerCase() !== correct.toLowerCase() && !dis.includes(cand)) dis.push(cand);
    if(dis.length === 3) break;
  }
  return {
    key: `w:${w.n}:${dir}`, category: cat, source: "YDS", type: "vocab",
    question: stem, context: "", options: shuffle(dis.concat([correct])),
    correct, explanation: `${w.en}${w.pron ? " ["+w.pron+"]" : ""} = ${w.tr}`, why: {}
  };
}
function restoreKey(key){
  if(BY_KEY[key]) return BY_KEY[key];
  if(BY_KEY[key + "|"]) return BY_KEY[key + "|"];
  const m = String(key).match(/^w:(\d+):(en|tr)$/);
  if(m && WORD_BY_N[+m[1]]) return vocabQuestion(WORD_BY_N[+m[1]], m[2]);
  return null;
}
function smartPool(n=20){
  const t = todayISO();
  const due=[], unseen=[], later=[];
  for(const q of APP_DATA.questions){
    const s = P.srs[q.key];
    if(!s) unseen.push(q);
    else if(s[1] <= t) due.push([s[0], s[1], q]);
    else later.push(q);
  }
  due.sort((a,b) => a[0]-b[0] || a[1].localeCompare(b[1]));
  const pool = due.slice(0, Math.max(8, Math.floor(n*2/3))).map(x => x[2]);
  const weak = new Set(weakCats());
  const us = shuffle(unseen).sort((a,b) => (weak.has(a.category)?0:1) - (weak.has(b.category)?0:1));
  for(const q of us){ if(pool.length >= n) break; pool.push(q); }
  for(const q of shuffle(later)){ if(pool.length >= n) break; pool.push(q); }
  return shuffle(pool).slice(0, n);
}
function grammarPool(n=8){
  const t = todayISO();
  const by = {};
  for(const q of APP_DATA.questions){
    if(GRAMMAR_SET.has(q.category)) (by[q.category] = by[q.category] || []).push(q);
  }
  const wrongSet = new Set(P.wrong_keys);
  for(const list of Object.values(by)){
    list.sort((a,b) => {
      const rank = q => wrongSet.has(q.key)?0 : (P.srs[q.key] && P.srs[q.key][1]<=t)?1 : !P.srs[q.key]?2 : 3;
      return rank(a) - rank(b) || (Math.random()-0.5);
    });
  }
  const order = Object.keys(by).sort((a,b) => {
    const acc = c => { const v = P.cat_stats[c]; return v && v[1] ? v[0]/v[1] : 0.5; };
    return acc(a) - acc(b);
  });
  const pool = [];
  while(pool.length < n && order.some(c => by[c].length)){
    for(const c of order){ if(by[c].length && pool.length < n) pool.push(by[c].shift()); }
  }
  return shuffle(pool);
}
function realExamPool(frac=1.0){
  const qs = APP_DATA.questions, used = new Set(), out = [];
  const seen = P.srs;
  const cnt = x => Math.max(1, Math.round(x * frac));
  const take = (arr, n) => {
    const s = shuffle(arr).sort((a,b) => (a.key in seen ? 1 : 0) - (b.key in seen ? 1 : 0));
    const got = s.filter(q => !used.has(q.key)).slice(0, n);
    got.forEach(q => used.add(q.key));
    return got;
  };
  out.push(...take(qs.filter(q => q.type==="grammar"), cnt(10)));
  out.push(...take(qs.filter(q => q.type==="vocab"), cnt(15)));
  const trSent = qs.filter(q => q.type==="translation" && (q.category==="Çeviri" || q.question.length>60));
  const trRest = qs.filter(q => q.type==="translation" && !trSent.includes(q));
  const tr = take(trSent, cnt(15));
  out.push(...tr, ...(tr.length < cnt(15) ? take(trRest, cnt(15)-tr.length) : []));
  const pGroups = {};
  qs.filter(q => q.type==="paragraph").forEach(q => (pGroups[q.context] = pGroups[q.context]||[]).push(q));
  const pg = shuffle(Object.values(pGroups)).sort((a,b) => a.filter(q=>q.key in seen).length - b.filter(q=>q.key in seen).length);
  const par = pg.slice(0, Math.max(1, Math.round(5*frac))).flat().slice(0, cnt(15));
  par.forEach(q => used.add(q.key));
  out.push(...par);
  const cGroups = {};
  qs.filter(q => q.type==="gap" && q.context).forEach(q => (cGroups[q.context] = cGroups[q.context]||[]).push(q));
  const cg = shuffle(Object.values(cGroups)).sort((a,b) => a.filter(q=>q.key in seen).length - b.filter(q=>q.key in seen).length);
  const clz = [];
  for(const g of cg){ if(clz.length + g.length <= cnt(15)) clz.push(...g); }
  clz.forEach(q => used.add(q.key));
  let gap = clz.concat(take(qs.filter(q => q.type==="gap" && !q.context), cnt(25)-clz.length));
  if(gap.length < cnt(25)) gap = gap.concat(take(qs.filter(q => q.type==="grammar" && q.question.includes("___")), cnt(25)-gap.length));
  out.push(...gap);
  return out;
}
function wrongDetail(q, chosen, letter){
  const parts = [];
  if(chosen) parts.push(`❌ Senin cevabın: ${letter ? letter+") " : ""}${chosen}`);
  parts.push(`✅ Doğru cevap: ${q.correct}`);
  if(q.explanation) parts.push("📖 Neden bu doğru?\n" + q.explanation);
  const why = chosen && q.why ? q.why[chosen] : null;
  if(why) parts.push("🔎 Senin şıkkın neden yanlış?\n" + why);
  if(APP_DATA.rules[q.category]) parts.push(`🧠 Kural – ${q.category}\n` + APP_DATA.rules[q.category]);
  const t = TOPIC_BY_CAT[q.category];
  if(t) parts.push("✅ Checklist:\n" + t.check.map((s,i) => ` ${i+1}) ${s}`).join("\n"));
  return parts.join("\n\n");
}
function dailyTip(){
  const weak = Object.entries(P.cat_stats).filter(([,[o,t]])=>t>=3 && o/t<0.7).map(x=>x[0]);
  const pool = APP_DATA.dailyTips.filter(t => weak.includes(t[0]));
  const use = pool.length ? pool : APP_DATA.dailyTips;
  const ord = Math.floor(Date.now() / 86400000);
  return [APP_DATA.icaoWords[ord % 26], use[ord % use.length][1], use[ord % use.length][0]];
}
function phaseOf(ok, tot){
  if(tot < 5) return ["⚪ Park (yeni)", "var(--muted)"];
  const v = ok / tot;
  if(v >= .8) return ["✈ Seyir", "var(--green)"];
  if(v >= .6) return ["📈 Tırmanış", "var(--teal)"];
  if(v >= .4) return ["🛫 Kalkış", "var(--gold)"];
  return ["🚕 Taksi", "var(--orange)"];
}

const PLAN_LABELS = {cloze:"Boşluk doldurma (cloze)", reading:"Okuma parçası", translation:"Çeviri", sentence:"Cümle tamamlama", grammar:"Dil bilgisi", vocab:"Kelime bilgisi"};
const PLAN_KIND_TXT = {normal:"Normal gün", mock40:"Yarım sınav günü", mock80:"Tam sınav günü", review:"Tekrar günü", examday:"SINAV GÜNÜ", past:""};
function planDayKind(left){
  if(left < 0) return "past";
  if(left === 0) return "examday";
  if(left <= 2) return "review";
  if([14,7,3].includes(left)) return "mock80";
  if(left % 4 === 0 && left >= 8) return "mock40";
  return "normal";
}
function planCount(key, day){
  if(key === "answered") return (P.daily && P.daily[day]) || 0;
  return (P.plan_log && P.plan_log[day] && P.plan_log[day][key]) || 0;
}
function planTasks(left, day){
  const log = (P.plan_log && P.plan_log[day]) || {};
  const exams = P.exams || [];
  const has80 = exams.some(e => (e.total||0)>=70 && e.date !== day);
  let kind = planDayKind(left);
  if(log.mock80) kind = "mock80";
  else if(log.mock40) kind = "mock40";
  else if(left >= 4 && !exams.some(e => (e.total||0)>=70)) kind = "mock80";
  const words = {key:"words", launch:"words", icon:"🃏", title:"15 yeni kelime", target:15, detail:"Kelime Kartları'ndan bilmediklerini çalış."};
  const cloze = {key:"cloze", launch:"cloze", icon:"🧩", title:"1 cloze metni (5 boşluk)", target:5, detail:"Numaralı boşluklu metin."};
  const reading = {key:"reading", launch:"reading", icon:"📖", title:"1 okuma parçası (3 soru)", target:3, detail:"Teknik bakım metni + sorular."};
  const t = [];
  if(kind === "mock80"){
    t.push({key:"mock80", launch:"mock80", icon:"📝", target:1, title: has80?"Tam sınav simülasyonu (80 soru)":"Başlangıç sınavı (80 soru)", detail:"Gerçek SHGM formatı • 120 dk • bölüm karnesi."});
    t.push({...words, title:"10 yeni kelime", target:10});
  }else if(kind === "mock40"){
    t.push({key:"mock40", launch:"mock40", icon:"📝", target:1, title:"Yarım sınav (40 soru)", detail:"Orantılı dağılım • 60 dk."});
    t.push({...words, title:"10 yeni kelime", target:10});
  }else if(kind === "review"){
    t.push({key:"answered", launch:"review", icon:"🔁", target:15, title:"15 soru: yanlışlar + tekrar", detail:"Akıllı Test öncelikli tekrar."});
    t.push(cloze, reading);
  }else if(kind === "normal"){
    const secs = ["translation","sentence","grammar","vocab"];
    const sec = secs[Math.floor(Date.now()/86400000) % 4];
    t.push(words, cloze, reading, {key:sec, launch:sec, icon:"🎯", target:10, title:`10 soru: ${PLAN_LABELS[sec]}`, detail:"Günlük bölüm pekiştirme."});
  }
  return [t, kind];
}
function planLaunch(key){
  const seen = P.srs;
  const pickGroup = items => {
    const g = {};
    items.forEach(q => (g[q.context] = g[q.context]||[]).push(q));
    const list = shuffle(Object.values(g)).sort((a,b) => a.filter(q=>q.key in seen).length - b.filter(q=>q.key in seen).length);
    return list[0] || [];
  };
  if(key === "mock80") startQuiz(realExamPool(1), "exam", true, "SHGM Gerçek Format (80 soru)", APP_DATA.constants.REAL_SECONDS);
  else if(key === "mock40") startQuiz(realExamPool(0.5), "exam", true, "SHGM Yarım Sınav (40 soru)", APP_DATA.constants.REAL_SECONDS/2);
  else if(key === "words") nav("cards");
  else if(key === "cloze") startQuiz(pickGroup(APP_DATA.questions.filter(q => q.type==="gap" && q.context)), "practice", true, "Cloze – günün metni");
  else if(key === "reading") startQuiz(pickGroup(APP_DATA.questions.filter(q => q.type==="paragraph")), "practice", true, "Okuma – günün metni");
  else if(key === "review") startQuiz(smartPool(15), "practice", true, "Akıllı Test (plan)");
  else{
    const items = key === "sentence"
      ? APP_DATA.questions.filter(q => q.type==="gap" && !q.context)
      : APP_DATA.questions.filter(q => q.type===key);
    startQuiz(shuffle(items).slice(0,10), "practice", true, `Günün bölümü – ${PLAN_LABELS[key]}`);
  }
}

      <div class="sec-title">Konu Kategorileri</div>
      <div class="grid2" id="catGrid">
        ${catNames.map(c => `<button class="chip" data-kind="cat" data-val="${esc(c)}">${esc(c)} (${cats[c]})</button>`).join("")}
      </div>

      ${vSets.length ? `
        <div class="sec-title">Kelime Setleri (100'lük)</div>
        <div class="grid2" id="vocGrid">
          ${vSets.map(([nm,a,b]) => `<button class="chip" data-kind="vocab" data-a="${a}" data-b="${b}" data-val="${esc(nm)}">📚 ${esc(nm)}</button>`).join("")}
        </div>
      ` : ""}
    </div>

    <div class="card">
      <div class="h2">Soru Sayısı</div>
      <div class="seg" id="cntSeg">${["10","20","30","50","100","Hepsi"].map(v=>`<button class="${v==="20"?"on":""}" data-v="${v}">${v}</button>`).join("")}</div>

      <div class="h2" style="margin-top:12px;">Mod</div>
      <div class="seg" id="modSeg">
        <button class="on" data-v="game">🎮 Oyun (3 Can)</button>
        <button data-v="practice">📖 Pratik</button>
        <button data-v="timed">⏱ Süreli (${APP_DATA.constants.TIME_LIMIT}sn)</button>
      </div>

      <label class="switch-row" style="margin-top:10px;border-top:1px solid var(--border);padding-top:12px;">
        <span>🔀 Şıkları karıştır</span>
        <input type="checkbox" id="shufChk" checked>
      </label>

      <div class="between" style="margin-top:6px;">
        <span class="muted" id="selInfo">Henüz konu seçmedin</span>
      </div>
      <button class="btn green full" style="margin-top:10px;" id="startSetup">▶ TESTİ BAŞLAT</button>
    </div>
  `;

  function updateSelInfo(){
    const n = M.querySelectorAll(".chip.on").length;
    document.getElementById("selInfo").textContent = n ? `${n} konu / liste seçili` : "Henüz konu seçmedin";
  }

  M.querySelectorAll(".chip").forEach(b => {
    b.onclick = () => { b.classList.toggle("on"); sfx("click"); updateSelInfo(); };
  });
  document.getElementById("selAll").onclick = () => {
    M.querySelectorAll("#catGrid .chip").forEach(b => b.classList.add("on"));
    updateSelInfo();
  };
  document.getElementById("selClr").onclick = () => {
    M.querySelectorAll(".chip").forEach(b => b.classList.remove("on"));
    updateSelInfo();
  };
  M.querySelectorAll("#cntSeg button").forEach(b => b.onclick = () => {
    M.querySelectorAll("#cntSeg button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); selCount = b.dataset.v;
  });
  M.querySelectorAll("#modSeg button").forEach(b => b.onclick = () => {
    M.querySelectorAll("#modSeg button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); selMode = b.dataset.v;
  });
  document.getElementById("shufChk").onchange = e => { doShuf = e.target.checked; };

  document.getElementById("startSetup").onclick = () => {
    let pool = [];
    M.querySelectorAll(".chip.on").forEach(b => {
      if(b.dataset.kind === "cat"){
        pool.push(...APP_DATA.questions.filter(q => q.category === b.dataset.val));
      }else if(b.dataset.kind === "keys"){
        const keys = b.dataset.val === "fav" ? P.fav_keys : P.wrong_keys;
        pool.push(...keys.map(restoreKey).filter(Boolean));
      }else{
        const a = +b.dataset.a, bb = +b.dataset.b;
        pool.push(...APP_DATA.words.filter(w => w.n>=a && w.n<=bb).map(w => vocabQuestion(w, Math.random()<0.5?"en":"tr", b.dataset.val)));
      }
    });
    const seen = new Set();
    pool = shuffle(pool).filter(q => seen.has(q.key) ? false : (seen.add(q.key), true));
    if(!pool.length){ toast("Seçtiğin konularda soru bulunamadı!", "--gold"); return; }
    if(selCount !== "Hepsi") pool = pool.slice(0, +selCount);
    startQuiz(pool, selMode, doShuf, "Özel Test");
  };
}

// ============================================================ QUİZ MOTORU
function startQuiz(pool, mode, doShuf, title, examSec=APP_DATA.constants.EXAM_SECONDS){
  if(!pool || !pool.length){ toast("Bu seçimde soru bulunamadı.", "--gold"); return; }
  clearTimers();
  currentPage = "quiz";
  document.getElementById("topTitle").textContent = title;
  window.scrollTo(0, 0);
  sfx("click");

  const qs = pool.slice();
  const isHard = mode === "game" || mode === "timed";
  const isTimed = mode === "timed";
  const isExam = mode === "exam";
  let lives = APP_DATA.constants.MAX_LIVES, jokers = isExam ? 0 : 2;
  let i = 0, score = 0, streak = 0, maxStreak = 0, sessionXp = 0;
  const wrong = [], requeued = new Set();
  const examCat = {}, examType = {};
  qs.forEach(q => {
    examCat[q.category] = examCat[q.category] || [0,0]; examCat[q.category][1]++;
    examType[q.type] = examType[q.type] || [0,0]; examType[q.type][1]++;
  });
  let locked = false, curOpts = [], correctIdx = 0;
  const examStart = Date.now();
  const examTotal = examSec;
  const examN = qs.length;
  const examEnd = examStart + examSec * 1000;
  let qTimeLeft = APP_DATA.constants.TIME_LIMIT;
  let qTimerId = null;

  const M = document.getElementById("main");

  function updateExamHud(){
    if(!isExam) return;
    const left = Math.max(0, Math.floor((examEnd - Date.now()) / 1000));
    const el = document.getElementById("qRightMeta");
    const pel = document.getElementById("paceMeta");
    if(el){
      el.textContent = `⏳ ${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
      el.style.color = left < 300 ? "var(--red)" : "var(--gold)";
    }
    if(pel){
      const pi = paceInfo(i, examN, (Date.now() - examStart) / 1000, examTotal);
      pel.textContent = pi.text;
      pel.style.color = pi.color;
    }
    return left;
  }

  function bump(q, ok){
    P.answered++;
    P.cat_stats[q.category] = P.cat_stats[q.category] || [0,0];
    P.cat_stats[q.category][1]++;
    srsUpdate(q.key, ok);
    if(ok){
      P.correct++;
      P.cat_stats[q.category][0]++;
      score++;
      if(examCat[q.category]) examCat[q.category][0]++;
      if(examType[q.type]) examType[q.type][0]++;
      P.wrong_keys = P.wrong_keys.filter(k => k !== q.key);
    }else if(!P.wrong_keys.includes(q.key)){
      P.wrong_keys.push(q.key);
    }
  }

  function openWordSaveModal(q){
    const root = document.getElementById("modalRoot");
    const tokens = [...new Set((q.question + " " + (q.context||"")).match(/[A-Za-z][A-Za-z\-']{2,}/g) || [])].slice(0, 24);
    const wDict = Object.fromEntries(APP_DATA.words.map(w => [w.en.toLowerCase(), w.tr]));
    root.innerHTML = `<div class="modal-bg" id="mBg"><div class="modal">
      <div class="between"><div class="h2" style="margin:0;">🔖 Kelime Defterine Ekle</div><button class="icon-btn" id="mClose">✕</button></div>
      <div class="muted" style="margin:6px 0 8px;">Kelimeye dokun veya aşağıya yaz (kelime = anlam):</div>
      <div class="row" style="margin-bottom:10px;">
        ${tokens.map(tk => `<button class="chip" data-tk="${esc(tk)}">${esc(tk)}${wDict[tk.toLowerCase()] ? " ("+esc(wDict[tk.toLowerCase()].split(",")[0])+")" : ""}</button>`).join("")}
      </div>
      <input class="input" id="mWordIn" placeholder="örn: actuator = hareket ettirici">
      <button class="btn green full" style="margin-top:10px;" id="mSaveBtn">Kaydet</button>
    </div></div>`;
    const close = () => { root.innerHTML = ""; };
    document.getElementById("mClose").onclick = close;
    document.getElementById("mBg").onclick = e => { if(e.target.id==="mBg") close(); };
    root.querySelectorAll("[data-tk]").forEach(b => b.onclick = () => {
      const tk = b.dataset.tk;
      const tr = wDict[tk.toLowerCase()] || "";
      addSavedWord(tk, tr, q.question);
      b.classList.add("on");
    });
    document.getElementById("mSaveBtn").onclick = () => {
      const raw = document.getElementById("mWordIn").value.trim();
      if(raw){
        const [en, tr] = raw.split("=").map(x => (x||"").trim());
        if(en) addSavedWord(en, tr || wDict[en.toLowerCase()] || "", q.question);
      }
      close();
    };
  }
  function addSavedWord(en, tr, qtxt){
    P.saved_words = P.saved_words || [];
    if(P.saved_words.some(w => w.en.toLowerCase() === en.toLowerCase())){ toast("Zaten defterinde var", "--gold"); return; }
    P.saved_words.push({en, tr: tr||"", q: (qtxt||"").slice(0,100), date: todayISO()});
    saveProgress();
    toast(`🔖 "${en}" deftere eklendi`, "--green", "ok");
  }

  function renderQ(){
    if(qTimerId){ clearInterval(qTimerId); qTimerId = null; }
    const q = qs[i];
    curOpts = doShuf ? shuffle(q.options) : q.options.slice();
    correctIdx = curOpts.indexOf(q.correct);
    locked = false;
    const [tagTxt, tagCol] = srsTag(q.key);
    const isFav = P.fav_keys.includes(q.key);
    const heartsHtml = isHard ? Array.from({length:APP_DATA.constants.MAX_LIVES}, (_,idx) =>
      `<span style="font-size:22px;color:${idx<lives?"var(--red)":"var(--heart_off)"};">♥</span>`).join("") : (isExam ? "📝 SINAV" : "♥ ∞");

    M.innerHTML = `
      <div class="card" style="padding:10px 12px;">
        <div class="between">
          <div>${heartsHtml}</div>
          <div class="muted" style="font-weight:800;">Soru ${i+1}/${qs.length}${!isExam ? " • ✔ "+score : ""}</div>
          <div style="font-weight:800;color:${streak>=3?"var(--orange)":"var(--text)"};" id="qRightMeta">${isExam ? "⏳ --:--" : "🔥 "+streak}</div>
        </div>
        ${isExam ? `<div class="between" style="margin-top:6px;"><span class="muted" style="font-size:12px;">Tempo durumu</span><span class="pace-pill" id="paceMeta">✓ tempoda</span></div>` : ""}
        <div class="pbar" style="height:6px;margin-top:8px;"><div style="width:${(i/qs.length)*100}%;background:var(--accent);"></div></div>
        ${isTimed ? `<div class="pbar" style="height:6px;"><div id="tFill" style="width:100%;background:var(--gold);"></div></div>` : ""}
      </div>

      <div class="card">
        <div class="between" style="margin-bottom:8px;">
          <span style="color:var(--accent);font-size:12px;font-weight:800;">${esc(q.category.toUpperCase())}</span>
          <div class="row">
            ${!isExam ? `<span class="tag" style="background:${tagCol};">${tagTxt}</span>` : ""}
            <button class="icon-btn" id="btnSpeak" title="Sesli Oku">🔊</button>
          </div>
        </div>
        ${q.context ? `<div class="ctx-box">${esc(q.context)}</div>` : ""}
        <div style="font-size:18px;font-weight:800;line-height:1.45;">${esc(q.question)}</div>
      </div>

      <div id="optBox">
        ${curOpts.map((txt,k) => `<button class="opt" data-k="${k}"><span class="ltr">${LETTERS[k]}</span><span>${esc(txt)}</span></button>`).join("")}
      </div>

      <div id="fbBox"></div>

      <div class="row" style="margin-top:10px;">
        <button class="btn sec sm" id="btnFav">${isFav?"★ Favori":"☆ Favori"}</button>
        <button class="btn sec sm" id="btnWord">🔖 Kelime</button>
        ${!isExam ? `<button class="btn sec sm" id="btnJoker" ${jokers<=0?"disabled":""}>💡 50/50 (${jokers})</button>` : ""}
        <button class="btn" style="flex:1;" id="btnNext" ${!isExam?"disabled":""}>${isExam?"Boş Geç ▶":(i===qs.length-1?"Bitir ▶":"Sonraki ▶")}</button>
      </div>
    `;
    window.scrollTo(0, 0);
    if(isExam) updateExamHud();

    document.getElementById("btnSpeak").onclick = () => speak(q.question + (locked && !isExam ? ". " + q.correct : ""));
    document.getElementById("btnFav").onclick = () => {
      if(P.fav_keys.includes(q.key)) P.fav_keys = P.fav_keys.filter(x => x!==q.key);
      else P.fav_keys.push(q.key);
      saveProgress();
      document.getElementById("btnFav").textContent = P.fav_keys.includes(q.key) ? "★ Favori" : "☆ Favori";
    };
    document.getElementById("btnWord").onclick = () => openWordSaveModal(q);
    const jb = document.getElementById("btnJoker");
    if(jb) jb.onclick = () => {
      if(locked || jokers <= 0) return;
      const btns = [...M.querySelectorAll("#optBox .opt")];
      const wrongs = btns.filter((_,k) => k !== correctIdx && !btns[k].classList.contains("removed"));
      shuffle(wrongs).slice(0, wrongs.length > 2 ? 2 : 1).forEach(el => el.classList.add("removed"));
      jokers--; jb.textContent = `💡 50/50 (${jokers})`; if(jokers <= 0) jb.disabled = true;
    };
    M.querySelectorAll("#optBox .opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
    document.getElementById("btnNext").onclick = nextQ;

    if(isTimed){
      qTimeLeft = APP_DATA.constants.TIME_LIMIT;
      let lastSec = qTimeLeft;
      qTimerId = setInterval(() => {
        if(locked){ clearInterval(qTimerId); return; }
        qTimeLeft -= 0.1;
        const fill = document.getElementById("tFill");
        if(fill){
          fill.style.width = Math.max(0, qTimeLeft/APP_DATA.constants.TIME_LIMIT*100) + "%";
          fill.style.background = qTimeLeft <= 5 ? "var(--red)" : "var(--gold)";
        }
        const s = Math.ceil(qTimeLeft);
        if(s !== lastSec){ lastSec = s; if(s > 0 && s <= 5) sfx("tick"); }
        if(qTimeLeft <= 0){ clearInterval(qTimerId); answer(-1); }
      }, 100);
      activeTimers.push(qTimerId);
    }
  }

  function answer(k){
    if(locked) return;
    locked = true;
    if(qTimerId){ clearInterval(qTimerId); qTimerId = null; }
    const q = qs[i];
    const ok = k === correctIdx;
    const btns = [...M.querySelectorAll("#optBox .opt")];

    if(isExam){
      sfx("click");
      bump(q, ok);
      if(!ok) wrong.push([q, k>=0 ? curOpts[k] : "— (boş)"]);
      btns.forEach((b,idx) => b.classList.add(idx===k ? "picked" : "dim"));
      touchDay(); saveProgress();
      document.getElementById("btnNext").textContent = "Sonraki ▶";
      const tid = setTimeout(() => { if(currentPage==="quiz") nextQ(); }, 350);
      activeTimers.push(tid);
      return;
    }

    bump(q, ok);
    btns.forEach((b,idx) => {
      if(idx === correctIdx) b.classList.add("correct");
      else if(idx === k) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    const fb = document.getElementById("fbBox");
    if(ok){
      streak++; maxStreak = Math.max(maxStreak, streak);
      P.best_streak = Math.max(P.best_streak, streak);
      const gain = 10 + Math.min(streak-1, 5)*2 + (isTimed && qTimeLeft > APP_DATA.constants.TIME_LIMIT/2 ? 3 : 0);
      sessionXp += gain;
      addXP(gain);
      sfx(streak % 5 === 0 ? "combo" : "ok", streak - 1);
      fb.innerHTML = `<div class="card b-green">
        <div style="color:var(--green);font-weight:800;">✔ Doğru! +${gain} XP ${streak>2?"🔥":""}</div>
        ${q.explanation ? `<div class="fb-pre">${esc(q.explanation)}</div>` : ""}
      </div>`;
    }else{
      streak = 0;
      if(isHard) lives--;
      sfx(isHard ? "heart" : "bad");
      wrong.push([q, k>=0 ? curOpts[k] : "— (süre doldu)"]);
      let det = wrongDetail(q, k>=0 ? curOpts[k] : null, k>=0 ? LETTERS[k] : "");
      if(!requeued.has(q.key)){
        requeued.add(q.key);
        const pos = Math.min(i + 4, qs.length);
        qs.splice(pos, 0, q);
        det += `\n\n🔁 Bu soru ${pos - i} soru sonra tekrar karşına çıkacak (NRFI).`;
      }
      fb.innerHTML = `<div class="card b-red">
        <div style="color:var(--red);font-weight:800;">${k<0?"⏰ Süre doldu!":"✘ Yanlış!"} Doğru: ${LETTERS[correctIdx]}) ${esc(q.correct)}</div>
        <div class="fb-pre">${esc(det)}</div>
      </div>`;
    }
    const nb = document.getElementById("btnNext");
    nb.disabled = false;
    if(isHard && lives <= 0) nb.textContent = "Sonuçları Gör ▶";
    touchDay(); saveProgress();
  }

  function nextQ(){
    if(!locked){
      if(!isExam) return;
      locked = true;
      bump(qs[i], false);
      wrong.push([qs[i], "— (boş bırakıldı)"]);
      saveProgress();
    }
    if((isHard && lives <= 0) || i >= qs.length - 1){ finishQuiz(); return; }
    i++;
    renderQ();
  }

  function finishQuiz(){
    clearTimers();
    const answered = isExam ? qs.length : (i + 1);
    if(isExam){
      const done = i + (locked ? 1 : 0);
      for(let r=done; r<qs.length; r++) wrong.push([qs[r], "— (cevaplanmadı)"]);
      const pct = Math.round(score / qs.length * 100);
      sessionXp = score * 3;
      addXP(sessionXp);
      P.exams = (P.exams || []).concat([{date:todayISO(), score:pct, correct:score, total:qs.length, cats:examCat, types:examType, kind:title}]).slice(-20);
      if(qs.length >= 70) planNote("mock80");
      else if(qs.length >= 35) planNote("mock40");
      if(title.startsWith("Gramer Checkride") && pct >= 80) unlockAch("ride");
    }else if(qs.length >= 10 && !wrong.length && answered === qs.length){
      unlockAch("perfect");
    }
    P.games++;
    saveProgress();
    if(getSyncCfg().auto && getSyncCfg().gistId) cloudSync(true);
    const pct = answered ? Math.round(score / answered * 100) : 0;
    const died = isHard && lives <= 0;
    sfx(died ? "gameover" : pct >= 80 ? "win" : "ok");

    let reportHtml = "";
    let weakMods = [];
    if(isExam){
      const tNames = Object.fromEntries(APP_DATA.realPlan.map(([t,,n]) => [t,n]));
      const tOrder = Object.fromEntries(APP_DATA.realPlan.map(([t],idx) => [t,idx]));
      let worst = null;
      const typeRows = Object.entries(examType)
        .sort((a,b) => (tOrder[a[0]] ?? 9) - (tOrder[b[0]] ?? 9))
        .map(([t,[ok,tot]]) => {
          const v = ok/Math.max(tot,1);
          if(tot && (!worst || v < worst[0])) worst = [v, tNames[t]||t];
          return `<div class="bar-row"><span class="lbl">${esc(tNames[t]||t)}</span><div class="pbar" style="flex:1;"><div style="width:${v*100}%;background:${v>=.7?"var(--green)":v>=.4?"var(--gold)":"var(--red)"};"></div></div><span class="val">${ok}/${tot} (%${Math.round(v*100)})</span></div>`;
        }).join("");
      reportHtml += `<div class="card"><div class="h2">📊 Sınav Bölümlerine Göre</div>${typeRows}${worst && worst[0] < .7 ? `<div style="color:var(--gold);font-size:13px;font-weight:800;margin-top:8px;">🎯 En çok puan kaybettiğin bölüm: ${esc(worst[1])}</div>` : ""}</div>`;

      const catRows = Object.entries(examCat)
        .sort((a,b) => (a[1][0]/Math.max(a[1][1],1)) - (b[1][0]/Math.max(b[1][1],1)));
      weakMods = catRows.filter(([,[o,t]]) => t && o/t < .7).map(([c]) => c).slice(0, 3);
      reportHtml += `<div class="card">
        <div class="h2">📋 Karne – Modül Bazında</div>
        ${catRows.map(([cat,[ok,tot]]) => {
          const v = ok/Math.max(tot,1);
          return `<div class="bar-row"><span class="lbl">${esc(cat)}</span><div class="pbar" style="flex:1;"><div style="width:${v*100}%;background:${v>=.7?"var(--green)":v>=.4?"var(--gold)":"var(--red)"};"></div></div><span class="val">${ok}/${tot} (%${Math.round(v*100)})</span></div>`;
        }).join("")}
        <div style="margin-top:8px;font-size:13px;font-weight:800;color:${weakMods.length?"var(--gold)":"var(--green)"};">
          ${weakMods.length ? "🎯 Önce şunlara çalış: " + esc(weakMods.join(", ")) : "🎉 Tüm modüllerde hedefin üstündesin!"}
        </div>
        ${weakMods.length ? `<button class="btn teal sm full" style="margin-top:8px;" id="rStudyWeak">🎯 Zayıf Modülleri Çalış</button>` : ""}
      </div>`;
    }

    M.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="h1" style="color:${died?"var(--red)":"var(--gold)"};">${isExam?"📝 SINAV TAMAMLANDI":died?"💀 OYUN BİTTİ":pct>=80?"🏆 Harika İş!":"✅ Test Tamamlandı"}</div>
        <div class="muted">${esc(title)}</div>
        <div style="font-size:52px;font-weight:900;color:${pct>=70?"var(--green)":pct>=40?"var(--gold)":"var(--red)"};margin:8px 0;">${isExam?pct:"%"+pct}</div>
        <div class="muted" style="font-size:16px;">${isExam?"100 üzerinden • ":""}${score} / ${answered} doğru • ✨ +${sessionXp} XP</div>
      </div>
      ${reportHtml}
      <div class="row" style="margin-bottom:14px;">
        <button class="btn sec" style="flex:1;" id="rHome">🏠 Ana Sayfa</button>
        <button class="btn violet" style="flex:1;" id="rSmart">🧬 Akıllı Test</button>
        ${wrong.length ? `<button class="btn brown full" id="rRetry">🔁 Yanlışlarımı Çöz (${wrong.length})</button>` : ""}
      </div>
      ${wrong.length ? `<div class="h2">Yanlış Yaptıkların</div>` + wrong.map(([q,ch]) => `
        <div class="card">
          <div style="font-weight:800;margin-bottom:6px;">${esc(q.question)}</div>
          <div style="color:var(--red);font-size:13px;">Senin cevabın: ${esc(ch)}</div>
          <div style="color:var(--green);font-size:13px;font-weight:700;">Doğru: ${esc(q.correct)}</div>
          ${q.explanation ? `<div class="muted" style="margin-top:6px;">${esc(q.explanation)}</div>` : ""}
        </div>`).join("") : `<div class="card" style="text-align:center;color:var(--green);font-weight:800;">🎉 Hiç yanlışın yok!</div>`}
    `;
    document.getElementById("rHome").onclick = () => nav("home");
    document.getElementById("rSmart").onclick = () => startQuiz(smartPool(20), "game", true, "Akıllı Test");

function renderCards(M){
  const sets = vocabSets();
  let curSet = sets[0], onlyUnk = true, doShuf = true, deck = [], idx = 0, flipped = false;

  function buildDeck(){
    const [nm, a, b] = curSet;
    const known = new Set(P.known);
    let list = APP_DATA.words.filter(w => w.n >= a && w.n <= b);
    const total = list.length, knownIn = list.filter(w => known.has(w.n)).length;
    if(onlyUnk) list = list.filter(w => !known.has(w.n));
    deck = doShuf ? shuffle(list) : list;
    idx = 0; flipped = false;
    draw(total, knownIn);
  }
  function draw(total, knownIn){
    const w = deck[idx];
    M.innerHTML = `
      <div class="card">
        <select class="input" id="cSetSel">${sets.map((s,i)=>`<option value="${i}" ${s===curSet?"selected":""}>${esc(s[0])}</option>`).join("")}</select>
        <div class="between" style="margin-top:10px;">
          <label style="font-size:13px;"><input type="checkbox" id="cUnk" ${onlyUnk?"checked":""}> Sadece bilmediklerim</label>
          <span class="muted">Bildiğin: ${knownIn}/${total}</span>
        </div>
        <div class="pbar"><div style="width:${knownIn/Math.max(total,1)*100}%;background:var(--green);"></div></div>
      </div>
      ${w ? `
        <div class="flashcard ${flipped?"flipped":""}" id="fCard">
          <div class="fc-main" style="color:${flipped?"var(--gold)":"var(--text)"};">${esc(flipped ? w.tr : w.en)}</div>
          <div class="fc-sub">${flipped ? esc(w.en) : `${idx+1} / ${deck.length} • çevirmek için dokun`}</div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button class="btn red" style="flex:1;" id="cNo">✘ Tekrar</button>
          <button class="btn sec" id="cSay">🔊</button>
          <button class="btn green" style="flex:1;" id="cYes">✔ Biliyorum</button>
        </div>
      ` : `<div class="card" style="text-align:center;padding:34px 16px;"><div class="h1">🎉 Set Bitti!</div><div class="muted">Başka bir set seç veya "Sadece bilmediklerim"i kapat.</div></div>`}
    `;
    document.getElementById("cSetSel").onchange = e => { curSet = sets[+e.target.value]; buildDeck(); };
    document.getElementById("cUnk").onchange = e => { onlyUnk = e.target.checked; buildDeck(); };
    if(w){
      document.getElementById("fCard").onclick = () => { flipped = !flipped; sfx("flip"); draw(total, knownIn); };
      document.getElementById("cSay").onclick = () => speak(w.en);
      document.getElementById("cNo").onclick = () => { deck.push(w); idx++; flipped=false; sfx("click"); draw(total, knownIn); };
      document.getElementById("cYes").onclick = () => {
        if(!P.known.includes(w.n)){ P.known.push(w.n); knownIn++; planNote("words"); addXP(2); checkAch(); saveProgress(); }
        idx++; flipped=false; sfx(idx>=deck.length?"win":"ok"); draw(total, knownIn);
      };
    }
  }
  buildDeck();
}
