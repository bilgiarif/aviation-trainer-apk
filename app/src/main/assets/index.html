function startMatch(M){
  clearTimers();
  const deck = shuffle(APP_DATA.pairs).slice(0, 15);
  let round = 0, combo = 0, xp = 0, matchedTot = 0, mistakes = 0;
  function loadRound(){
    const cur = deck.slice(round*5, (round+1)*5);
    const L = shuffle(cur.map((p,i)=>[i,p[0]])), R = shuffle(cur.map((p,i)=>[i,p[1]]));
    const done = new Set();
    let selL = null, selR = null;
    function draw(){
      M.innerHTML = `
        <div class="between" style="margin-bottom:10px;"><button class="btn sec sm" id="mBack">◀ Oyunlar</button><strong>Tur ${round+1}/3 • 🔥 x${combo} • +${xp} XP</strong></div>
        <div class="grid2">
          <div>${L.map(([id,t],p)=>`<button class="opt ${done.has(id)?"correct":selL===p?"picked":""}" ${done.has(id)?"disabled":""} data-l="${p}">${esc(t)}</button>`).join("")}</div>
          <div>${R.map(([id,d],p)=>`<button class="opt ${done.has(id)?"correct":selR===p?"picked":""}" ${done.has(id)?"disabled":""} data-r="${p}" style="font-size:13px;">${esc(d)}</button>`).join("")}</div>
        </div>
      `;
      document.getElementById("mBack").onclick = () => nav("games");
      M.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { selL = +b.dataset.l; check(); });
      M.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { selR = +b.dataset.r; check(); });
    }
    function check(){
      if(selL===null || selR===null){ sfx("pop"); draw(); return; }
      if(L[selL][0] === R[selR][0]){
        done.add(L[selL][0]); combo++; matchedTot++; xp += 5 + Math.min(combo-1,5)*2;
        sfx("ok", combo-1); selL=selR=null;
        if(done.size === cur.length){
          round++;
          if(round >= 3){
            addXP(xp); P.mini.match = (P.mini.match||0)+1; saveProgress(); sfx("win");
            M.innerHTML = `<div class="card" style="text-align:center;"><div class="h1" style="color:var(--gold);">🏁 Tur Bitti!</div><p>${matchedTot}/15 eşleşme • ${mistakes} hata • ✨ +${xp} XP</p><button class="btn teal full" id="mAg">↻ Tekrar Oyna</button></div>`;
            document.getElementById("mAg").onclick = () => startMatch(M);
            return;
          }
          setTimeout(loadRound, 400); return;
        }
        draw();
      }else{
        combo = 0; mistakes++; sfx("bad"); selL=selR=null; draw();
      }
    }
    draw();
  }
  loadRound();
}

function startJobCard(M){
  const cards = shuffle(APP_DATA.jobcards);
  let i = 0, xp = 0, perf = 0;
  function load(){
    const c = cards[i];
    const bank = shuffle(c.blanks.concat(c.extra || [])).slice(0, 8);
    let filled = c.blanks.map(() => null), checked = false, fbHtml = "";
    function draw(){
      const rendered = c.text.replace(/\{(\d+)\}/g, (_, n) => {
        const bi = filled[+n-1];
        if(bi === null) return "[ ____ ]";
        const w = bank[bi];
        return checked ? (w===c.blanks[+n-1] ? `✔${w}` : `✘${w}`) : `[ ${w} ]`;
      });
      M.innerHTML = `
        <div class="between" style="margin-bottom:8px;"><button class="btn sec sm" id="jBack">◀ Oyunlar</button><span class="muted">Kart ${i+1}/${cards.length} • +${xp} XP</span></div>
        <div class="card b-orange">
          <div style="color:var(--orange);font-weight:800;margin-bottom:8px;">📋 ${esc(c.title)}</div>
          <div class="mono">${esc(rendered)}</div>
        </div>
        <div class="grid2" style="margin-bottom:10px;">
          ${bank.map((w,k)=>`<button class="chip" ${checked||filled.includes(k)?"disabled":""} style="${filled.includes(k)?"opacity:.35;":""}" data-k="${k}">${esc(w)}</button>`).join("")}
        </div>
        ${fbHtml}
        <div class="row">
          <button class="btn sec sm" id="jUndo" ${checked?"disabled":""}>↩ Geri Al</button>
          <button class="btn green" style="flex:1;" id="jChk" ${checked?"disabled":""}>✔ Kontrol Et</button>
          <button class="btn" id="jNxt" ${!checked?"disabled":""}>${i===cards.length-1?"Bitir":"Sonraki ▶"}</button>
        </div>
      `;
      document.getElementById("jBack").onclick = () => nav("games");
      M.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
        const idx = filled.indexOf(null);
        if(idx >= 0){ filled[idx] = +b.dataset.k; sfx("pop"); draw(); }
      });
      document.getElementById("jUndo").onclick = () => {
        for(let n=filled.length-1;n>=0;n--){ if(filled[n]!==null){ filled[n]=null; break; } } draw();
      };
      document.getElementById("jChk").onclick = () => {
        if(filled.includes(null)){ toast("Önce tüm boşlukları doldur!", "--gold"); return; }
        checked = true;
        const good = filled.filter((k,n) => bank[k] === c.blanks[n]).length;
        const gain = good*6 + (good===c.blanks.length?10:0);
        xp += gain; addXP(gain); if(good===c.blanks.length) perf++;
        sfx(good===c.blanks.length?"ok":"bad"); saveProgress();
        fbHtml = `<div class="card ${good===c.blanks.length?"b-green":"b-red"}"><strong>${good}/${c.blanks.length} doğru (+${gain} XP)</strong><div class="muted" style="margin-top:4px;">Doğru sıra: ${esc(c.blanks.join(" → "))}<br>${esc(c.note||"")}</div></div>`;
        draw();
      };
      document.getElementById("jNxt").onclick = () => {
        if(i >= cards.length - 1){
          P.mini.job = (P.mini.job||0)+1; saveProgress();
          M.innerHTML = `<div class="card" style="text-align:center;"><div class="h1" style="color:var(--gold);">🏁 Kartlar Tamam!</div><p>${perf}/${cards.length} kusursuz • ✨ +${xp} XP</p><button class="btn full" id="jDone">🎮 Mini Oyunlar</button></div>`;
          document.getElementById("jDone").onclick = () => nav("games");
          return;
        }
        i++; load();
      };
    }
    draw();
  }
  load();
}

function startBuilder(M, onlyTag){
  let pool = APP_DATA.builder.filter(s => !onlyTag || s.tag === onlyTag);
  if(pool.length < 3) pool = APP_DATA.builder.slice();
  const deck = shuffle(pool).slice(0, 8);
  let i = 0, xp = 0, perf = 0;
  const norm = s => String(s).split(/\s+/).map(w=>w.replace(/^[.,;:!?]+|[.,;:!?]+$/g,"").toLowerCase()).filter(Boolean).join(" ");
  function load(){
    const s = deck[i];
    const bank = shuffle(s.words.concat(s.extra || []));
    let chosen = [], checked = false, hinted = false, fbHtml = "";
    function draw(){
      M.innerHTML = `
        <div class="between" style="margin-bottom:8px;"><button class="btn sec sm" id="bBack">◀ Geri</button><span class="muted">${i+1}/${deck.length} • ${esc(s.tag)} • +${xp} XP</span></div>
        <div class="card" style="background:var(--card2);"><div class="muted">🇹🇷 İngilizce kur:</div><div style="font-size:17px;font-weight:800;margin-top:4px;">${esc(s.tr)}</div></div>
        <div class="card b-accent mono">${chosen.length ? esc(chosen.map(k=>bank[k]).join(" ")) : `<span class="muted">(aşağıdaki kelimelere dokun)</span>`}</div>
        <div class="row" style="margin-bottom:10px;">
          ${bank.map((w,k)=>`<button class="chip" ${checked||chosen.includes(k)?"disabled":""} style="${chosen.includes(k)?"opacity:.3;":""}" data-k="${k}">${esc(w)}</button>`).join("")}
        </div>
        ${fbHtml}
        <div class="row">
          <button class="btn sec sm" id="bUndo" ${checked?"disabled":""}>↩</button>
          <button class="btn sec sm" id="bHint" ${checked||hinted?"disabled":""}>💡 İpucu</button>
          <button class="btn green" style="flex:1;" id="bChk" ${checked?"disabled":""}>✔ Kontrol Et</button>
          <button class="btn" id="bNxt" ${!checked?"disabled":""}>${i===deck.length-1?"Bitir":"Sonraki ▶"}</button>
        </div>
      `;
      document.getElementById("bBack").onclick = () => nav("games");
      M.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { chosen.push(+b.dataset.k); sfx("pop"); draw(); });
      document.getElementById("bUndo").onclick = () => { chosen.pop(); draw(); };
      document.getElementById("bHint").onclick = () => { hinted = true; fbHtml = `<div class="muted" style="color:var(--gold);margin-bottom:8px;">💡 İlk kelime: "${esc(s.words[0])}"</div>`; draw(); };
      document.getElementById("bChk").onclick = () => {
        if(chosen.length < 2){ toast("Önce kelimeleri seç", "--gold"); return; }
        checked = true;
        const got = chosen.map(k => bank[k].toLowerCase()).join(" ");
        const acc = [norm(s.text)].concat((s.alts||[]).map(norm));
        const ok = acc.includes(got);
        P.cat_stats[s.tag] = P.cat_stats[s.tag] || [0,0]; P.cat_stats[s.tag][1]++;
        let gain = 0;
        if(ok){ P.cat_stats[s.tag][0]++; perf++; gain = hinted?7:12; xp+=gain; addXP(gain); }
        sfx(ok?"ok":"bad"); touchDay(); saveProgress();
        fbHtml = `<div class="card ${ok?"b-green":"b-red"}"><strong>${ok?`✔ Doğru! +${gain} XP`:"✘ Olmadı"}</strong><div style="margin-top:4px;">${esc(s.text)}</div><div class="muted" style="margin-top:4px;">${esc(s.note||"")}</div></div>`;
        draw();
      };
      document.getElementById("bNxt").onclick = () => {
        if(i >= deck.length-1){
          P.mini.builder = (P.mini.builder||0)+1; checkAch(); saveProgress();
          M.innerHTML = `<div class="card" style="text-align:center;"><div class="h1" style="color:var(--gold);">🏁 Tur Tamam!</div><p>${perf}/${deck.length} doğru • ✨ +${xp} XP</p><button class="btn green full" id="bNew">↻ Yeni Tur</button></div>`;
          document.getElementById("bNew").onclick = () => startBuilder(M, onlyTag);
          return;
        }
        i++; load();
      };
    }
    draw();
  }
  load();
}

            <button class="${src==="words"?"on":""}" data-s="words">Kelimeler</button>
            <button class="${src==="qs"?"on":""}" data-s="qs">Sorular</button>

      `;

      document.getElementById("apNxt").onclick = () => showOne(false);
      document.getElementById("apGo").onclick = () => {
        running = !running;
        if(timer){ clearInterval(timer); timer=null; }
        if(running){ showOne(false); timer = setInterval(() => showOne(false), sec*1000); activeTimers.push(timer); }
        else showOne(true);
      };
    }
    showOne(true);
  }
  function renderReflex(B){
    const pool = APP_DATA.words.map(w=>[w.en, w.short]).concat(APP_DATA.pairs);
    let streak = 0, fb = "Eşleşme doğruysa YEŞİL, yanlışsa KIRMIZI!";
    function next(){
      const [term, real] = pool[Math.floor(Math.random()*pool.length)];
      const isTrue = Math.random() < 0.5;
      const shown = isTrue ? real : pool[Math.floor(Math.random()*pool.length)][1];
      const truth = shown === real;
      B.innerHTML = `
        <div class="card b-orange" style="text-align:center;padding:24px 14px;">
          <div style="color:var(--orange);font-weight:800;font-size:13px;">⚡ KOKPİT REFLEKS • 🔥 ${streak}</div>
          <div style="font-size:28px;font-weight:900;margin:16px 0 8px;">${esc(term)}</div>
          <div style="font-size:20px;font-weight:800;color:var(--gold);margin-bottom:14px;">= ${esc(shown)} ?</div>
          <div class="muted" style="margin-bottom:16px;">${esc(fb)}</div>
          <div class="grid2">
            <button class="btn red" id="rfNo">✘ YANLIŞ</button>
            <button class="btn green" id="rfYes">✔ DOĞRU</button>
          </div>
        </div>
      `;
      const ans = a => {
        if(a === truth){ streak++; const g = 4+Math.min(streak,6); addXP(g); sfx("ok", streak-1); fb = `✔ Süper! (${term} = ${real}) +${g} XP`; }
        else{ streak=0; sfx("bad"); fb = `✘ Doğrusu: ${term} = ${real}`; }
        saveProgress(); next();
      };
      document.getElementById("rfNo").onclick = () => ans(false);
      document.getElementById("rfYes").onclick = () => ans(true);
    }
    next();
  }
  function renderWordHunt(B){
    const cands = APP_DATA.words.filter(w => /^[a-zA-Z]{4,12}$/.test(w.en));
    let word="", tr="", guessed=new Set(), lives=6, done=false, msg="";
    function newW(){
      const w = cands[Math.floor(Math.random()*cands.length)];
      word = w.en.toUpperCase(); tr = w.tr; guessed = new Set([word[0]]); lives = 6; done = false;
      msg = "İlk harf açık! Kelimeyi bul."; draw();
    }
    function draw(){
      const mask = word.split("").map(c => guessed.has(c)?c:"_").join(" ");
      B.innerHTML = `
        <div class="card b-violet" style="text-align:center;">
          <div style="color:var(--gold);font-weight:800;">✈ İrtifa: ${(lives*5000).toLocaleString()} ft (${"♥".repeat(lives)||"💥"})</div>
          <div style="font-size:17px;font-weight:800;margin:10px 0;">🇹🇷 ${esc(tr)}</div>
          <div class="mono" style="font-size:26px;font-weight:900;color:var(--accent);letter-spacing:3px;margin:10px 0;">${esc(mask)}</div>
          <div class="muted">${esc(msg)}</div>
          <div class="kbd-grid">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c =>
            `<button ${done||guessed.has(c)?"disabled":""} style="${guessed.has(c)?(word.includes(c)?"background:var(--green);color:var(--on_color);":"background:var(--red);color:#fff;"):""}" data-c="${c}">${c}</button>`
          ).join("")}</div>
          <div class="row" style="margin-top:12px;">
            <button class="btn orange sm" style="flex:1;" id="whHint">💡 Harf Aç</button>
            <button class="btn sec sm" style="flex:1;" id="whNew">⏭ Yeni Kelime</button>
          </div>
        </div>
      `;
      B.querySelectorAll("[data-c]").forEach(b => b.onclick = () => guess(b.dataset.c));
      document.getElementById("whHint").onclick = () => {
        if(done) return;
        const rem = [...new Set(word)].filter(c => !guessed.has(c));
        if(rem.length) guess(rem[Math.floor(Math.random()*rem.length)]);
      };
      document.getElementById("whNew").onclick = newW;
    }
    function guess(c){
      if(done || guessed.has(c)) return;
      guessed.add(c);
      if(word.includes(c)){
        sfx("ok");
        if(word.split("").every(ch => guessed.has(ch))){
          done=true; addXP(15); saveProgress(); speak(word.toLowerCase());
          msg = `🎉 Harika! ${word} (+15 XP)`;
        }else msg = `✔ '${c}' var!`;
      }else{
        lives--; sfx("bad");
        if(lives<=0){ done=true; word.split("").forEach(ch=>guessed.add(ch)); msg = `💥 İrtifa bitti! Doğrusu: ${word}`; }
        else msg = `✘ '${c}' yok!`;
      }
      draw();
    }
    newW();
  }
  drawTab();
}

function buildExamChartSvg(exams){
  const scores = exams.slice(-10).map(e => Number(e.score) || 0);
  const W = 340, H = 155, L = 30, R = 14, T = 20, B = 20;
  const pw = W - L - R, ph = H - T - B;
  const yOf = v => T + ph - (ph * Math.max(0, Math.min(100, v)) / 100);
  const n = scores.length;
  const pts = scores.map((v, i) => [
    L + (n > 1 ? (pw * i / (n - 1)) : pw / 2),
    yOf(v),
    v
  ]);
  const grid = [
    [0, "var(--card2)", ""],
    [50, "var(--gold)", "4,4"],
    [70, "var(--green)", "4,4"],
    [100, "var(--card2)", ""]
  ].map(([val, col, dash]) => {
    const y = yOf(val);
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${col}" stroke-width="1" ${dash?`stroke-dasharray="${dash}"`:""}/>` +
           `<text x="${L-5}" y="${y+3}" fill="var(--muted)" font-size="9" text-anchor="end">${val}</text>`;
  }).join("");
  const poly = n > 1
    ? `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")}"/>`
    : "";
  const dots = pts.map(([x, y, v]) => {
    const col = v >= 70 ? "var(--green)" : v >= 50 ? "var(--gold)" : "var(--red)";
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${col}" stroke="var(--card)" stroke-width="1.8"/>` +
           `<text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" fill="var(--text)" font-size="10" font-weight="800" text-anchor="middle">${v}</text>`;
  }).join("");
  return `<svg class="svg-chart" viewBox="0 0 ${W} ${H}">${grid}${poly}${dots}</svg>`;
}

function renderStats(M){
  const acc = P.answered ? Math.round(P.correct/P.answered*100) : 0;
  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push([String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0"), P.daily[iso]||0]);
  }
  const goal = P.settings.daily_goal || 30;
  const mx = Math.max(goal, ...days.map(x=>x[1]), 1);
  const cats = Object.entries(P.cat_stats).sort((a,b) => (a[1][0]/Math.max(a[1][1],1)) - (b[1][0]/Math.max(b[1][1],1)));

  // SRS Hakimiyet Dağılımı
  const totalQ = Math.max(APP_DATA.questions.length, 1);
  const boxes = { new: 0, learn: 0, firm: 0, master: 0 };
  for(const q of APP_DATA.questions){
    const s = P.srs[q.key];
    if(!s) boxes.new++;
    else if(s[0] <= 3) boxes.learn++;
    else if(s[0] === 4) boxes.firm++;
    else boxes.master++;

  const srsRows = [
    ["Yeni", boxes.new, "var(--muted)"],
    ["🔴 NRFI (tekrar)", boxes.learn, "var(--nrfi)"],
    ["🟡 RFI (öğrenildi)", boxes.firm, "var(--rfi)"],

           ).join("")}
         </div>
       </div>`

         <div class="h2">📝 Sınav Puanı Gelişimi</div>
         <div class="muted">Henüz tamamlanan deneme sınavı yok. Sınav Simülasyonu çözdükçe puan grafiğin burada oluşacak.</div>
       </div>`;

  M.innerHTML = `
    <div class="card">
      <div class="between"><div class="h2" style="margin:0;">Genel Doğruluk: %${acc}</div><span class="muted">${P.correct}/${P.answered}</span></div>
      <div class="pbar"><div style="width:${acc}%;background:${acc>=70?"var(--green)":acc>=40?"var(--gold)":"var(--red)"};"></div></div>
      <div class="muted" style="margin-top:6px;">📚 ${P.answered} soru • 🔥 ${P.streak_days} gün seri • 🧠 ${P.known.length} kelime • 🔖 ${(P.saved_words||[]).length} defter</div>

        <span class="tag" id="syncBadge" style="background:${(getSyncCfg().gistId && getSyncCfg().token)?"var(--green)":"var(--muted)"};">${(getSyncCfg().gistId && getSyncCfg().token)?"Bağlı":"Kurulmadı"}</span>
      </div>
      <div class="muted" style="margin-bottom:8px;">
        PC'deki <strong>pc_sync.py</strong> ile gizli GitHub Gist üzerinden çift yönlü eşitleme yapar. XP, sorular, kelimeler ve SRS istatistikleri kayıpsız birleşir.${getSyncCfg().last ? `<br>Son eşitleme: <strong>${esc(getSyncCfg().last)}</strong>` : ""}
      </div>
      <label class="muted">Hızlı Bağlantı Kodu (PC'nin verdiği <code>GIST_ID|TOKEN</code> satırı)</label>
      <div class="row" style="margin:4px 0 8px;">
        <input class="input" style="flex:1;font-size:12px;" id="syncPairIn" placeholder="GIST_ID|ghp_... yapıştır">
        <button class="btn green sm" id="btnPairApply">🔗 Bağla</button>
      </div>
      <div class="grid2" style="margin-bottom:8px;">
        <div><label class="muted">Gist ID</label><input class="input" id="syncGistIn" style="margin-top:3px;font-size:12px;" value="${esc(getSyncCfg().gistId)}" placeholder="32 karakterlik ID"></div>
        <div><label class="muted">GitHub Token</label><input class="input" type="password" id="syncTokIn" style="margin-top:3px;font-size:12px;" value="${esc(getSyncCfg().token)}" placeholder="ghp_..."></div>
      </div>
      <label class="switch-row"><span>Açılışta ve test bitiminde otomatik eşitle</span><input type="checkbox" id="syncAutoChk" ${getSyncCfg().auto?"checked":""}></label>
      <button class="btn green full" style="margin-top:6px;" id="btnSyncNow">☁️ Şimdi PC ile Eşitle</button>
      <div id="syncStatus" class="muted" style="margin-top:6px;font-weight:700;"></div>
    </div>

    <div class="card b-teal">
      <div class="h2" style="color:var(--teal);">🔄 Dosya ile Manuel Yedekleme</div>
      <div class="muted" style="margin-bottom:10px;">Telefonda çalıştıktan sonra ilerlemeni <strong>ilerleme.json</strong> olarak indirip PC'deki klasörüne kopyalayabilir veya PC'den yeni kaydı buraya yükleyebilirsin.</div>
      <div class="grid2">
        <button class="btn teal" id="btnExport">📤 Dışa Aktar</button>
        <button class="btn sec" id="btnImport">📥 İçe Aktar</button>
      </div>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none;">
    </div>

    <div class="card b-red">
      <div class="h2" style="color:var(--red);">⚠ Tehlikeli Alan</div>
      <div class="muted" style="margin-bottom:10px;">Sıfırdan başlamak istersen tüm soru, XP ve istatistik geçmişini temizleyebilirsin.</div>
      <button class="btn red full" id="btnReset">🗑 İlerlemeyi Sıfırla</button>
    </div>
  `;
  document.getElementById("sTheme").onchange = e => { P.settings.theme = e.target.value; applyTheme(P.settings.theme); saveProgress(); };
  document.getElementById("sSnd").onchange = e => { P.settings.sound = e.target.checked; saveProgress(); if(P.settings.sound) sfx("ok"); };
  const volIn = document.getElementById("sVol");
  const volLbl = document.getElementById("sVolLbl");
  volIn.oninput = e => {
    const v = +e.target.value;
    P.settings.volume = v;
    volLbl.textContent = `%${v}`;
  };
  volIn.onchange = () => { saveProgress(); sfx("ok"); };
  document.getElementById("sTts").onchange = e => { P.settings.tts = e.target.checked; saveProgress(); };
  document.getElementById("sGoal").onchange = e => { P.settings.daily_goal = +e.target.value; saveProgress(); };
  document.getElementById("sDateBtn").onclick = () => {
    const raw = document.getElementById("sDate").value.trim();
    if(!raw){ P.settings.exam_date = ""; saveProgress(); toast("Sınav tarihi kaldırıldı"); return; }
    const d = parseDate(raw);
    if(!d){ toast("Biçim: GG.AA.YYYY", "--red", "bad"); return; }
    P.settings.exam_date = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    saveProgress(); toast("🎯 Sınav tarihi kaydedildi", "--green", "ok");
  };
  document.getElementById("btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify(P, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ilerleme.json"; a.click();
    toast("📤 ilerleme.json indirildi!", "--green", "ok");
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("fileIn").click();
  document.getElementById("fileIn").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const obj = JSON.parse(r.result);
        if(!obj || typeof obj !== "object" || !("total_xp" in obj)) throw new Error("Geçersiz dosya");
        const keepOta = { ota_url: P.settings.ota_url, ota_token: P.settings.ota_token };
        P = Object.assign(defaultProgress(), obj);
        P.settings = Object.assign(P.settings || {}, keepOta, obj.settings || {});
        P._reset_at = Date.now();
        applyTheme(P.settings.theme);
        saveProgress();
        toast("📥 İlerleme yüklendi!", "--green", "ach");
        nav("home");
      }catch(err){ toast("Dosya okunamadı!", "--red", "bad"); }
    };
    r.readAsText(f);
  };
  document.getElementById("btnPairApply").onclick = () => {
    const raw = document.getElementById("syncPairIn").value.trim();
    const parts = raw.split("|");
    if(parts.length !== 2 || !parts[0].trim() || !parts[1].trim()){
      toast("Biçim: GIST_ID|TOKEN şeklinde olmalı", "--red", "bad");
      return;
    }
    const cfg = getSyncCfg();
    cfg.gistId = parts[0].trim();
    cfg.token = parts[1].trim();
    setSyncCfg(cfg);
    document.getElementById("syncGistIn").value = cfg.gistId;
    document.getElementById("syncTokIn").value = cfg.token;
    document.getElementById("syncPairIn").value = "";
    cloudSync(false);
  };
  document.getElementById("syncAutoChk").onchange = e => {
    const cfg = getSyncCfg(); cfg.auto = e.target.checked; setSyncCfg(cfg);
  };
  document.getElementById("btnSyncNow").onclick = () => {
    const cfg = getSyncCfg();
    cfg.gistId = document.getElementById("syncGistIn").value.trim();
    cfg.token = document.getElementById("syncTokIn").value.trim();
    cfg.auto = document.getElementById("syncAutoChk").checked;
    setSyncCfg(cfg);
    cloudSync(false);
  };
  document.getElementById("btnReset").onclick = openResetConfirmModal;
}

// ---- Başlat
applyTheme(P.settings.theme || "Kokpit (Amber)");
updateHeader();
updateSyncBtn();
nav("home");
setTimeout(() => { const c = getSyncCfg(); if(c.auto && c.gistId && c.token) cloudSync(true); }, 1500);
</script>

<script>
(function(){
  var DEFAULT_URL = "https://raw.githubusercontent.com/bilgiarif/aviation-trainer-apk/main/app/src/main/assets/index.html";
  var UI_VER = "2.0";
  var hasBridge = typeof window.AndroidBridge !== "undefined";

  // 1) Yerel dosya yedeğinden (ilerleme_native.json) ilerlemeyi kurtar / birleştir
  if (hasBridge && typeof window.AndroidBridge.loadNativeProgress === "function") {
    try {
      var rawNative = window.AndroidBridge.loadNativeProgress();
      if (rawNative && rawNative.length > 10) {
        var np = JSON.parse(rawNative);
        if (np && typeof np === "object") {
          var nativeAhead = ((np.total_xp || 0) > (P.total_xp || 0)) || ((np.answered || 0) > (P.answered || 0)) || ((np.known || []).length > (P.known || []).length);
          if (nativeAhead) {
            var oldSettings = P.settings || {};
            P = Object.assign(P, np);
            P.settings = Object.assign(oldSettings, np.settings || {});
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(P)); } catch(e) {}
            applyTheme(P.settings.theme || "Kokpit (Amber)");
            updateHeader();
            if (currentPage === "home") nav("home");
          } else {
            // Mevcut ilerleme daha yeniyse yerel yedeğe yaz
            window.AndroidBridge.saveNativeProgress(JSON.stringify(P));
          }
        }
      } else {
        window.AndroidBridge.saveNativeProgress(JSON.stringify(P));
      }
    } catch(e) {}
  }

  // 2) saveProgress kancası: her kayıtta Android dahili hafızasına da yaz
  var _origSave = window.saveProgress;
  window.saveProgress = function() {
    _origSave();
    if (hasBridge && typeof window.AndroidBridge.saveNativeProgress === "function") {
      try { window.AndroidBridge.saveNativeProgress(JSON.stringify(P)); } catch(e) {}
    }
  };

  // 3) Android TTS + Paylaşım + Titreşim + Ekran Açık Tutma
  if (hasBridge) {
    window.speak = function(text) {
      if (!P.settings.tts) return;
      var clean = String(text || "").replace(/[_]/g, " ").trim().slice(0, 450);
      if (clean) window.AndroidBridge.speak(clean);
    };

    var _origSfx = window.sfx;
    window.sfx = function(kind, step) {
      _origSfx(kind, step);
      if (typeof window.AndroidBridge.vibrate === "function") {
        if (kind === "ok" || kind === "combo" || kind === "win") window.AndroidBridge.vibrate(22);
        else if (kind === "bad" || kind === "heart" || kind === "gameover") window.AndroidBridge.vibrate(75);
      }
    };

    var _origNav = window.nav;
    window.nav = function(page, arg) {
      if (typeof window.AndroidBridge.setKeepScreenOn === "function") {
        window.AndroidBridge.setKeepScreenOn(page === "chill");
      }
      return _origNav(page, arg);
    };

    document.addEventListener("click", function(e) {
      var btn = e.target && e.target.closest ? e.target.closest("#btnExport") : null;
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        window.AndroidBridge.shareProgress(JSON.stringify(P, null, 1));
      }
    }, true);
  }

  // 4) Geri tuşu yönetimi
  window.handleAndroidBack = function() {
    var mr = document.getElementById("modalRoot");
    if (mr && mr.innerHTML.trim()) { mr.innerHTML = ""; return "handled"; }
    var dr = document.getElementById("drawer");
    if (dr && dr.classList.contains("open")) { toggleDrawer(false); return "handled"; }
    if (typeof currentPage !== "undefined" && currentPage !== "home") { nav("home"); return "handled"; }
    return "exit";
  };

  // 5) OTA Sonuç Geri Çağrısı (Java -> JS)
  window.onOtaResult = function(ok, msg) {
    var st = document.getElementById("otaStatus");
    var btn = document.getElementById("btnOtaPull");
    if (btn) { btn.disabled = false; btn.textContent = "🔄 Güncellemeyi İndir & Uygula"; }
    if (st) {
      st.style.color = ok ? "var(--green)" : "var(--red)";
      st.textContent = msg;
    }
    toast(msg, ok ? "--green" : "--red", ok ? "ach" : "bad");
  };

  // 6) Ayarlar Sayfasına Tek Tıkla OTA Güncelleme Kartı Ekle
  var _origSettings = window.renderSettings;
  window.renderSettings = function(M) {
    _origSettings(M);
    var info = { isOta: false, otaDate: "", versionCode: 2 };
    if (hasBridge && typeof window.AndroidBridge.getAppInfo === "function") {
      try { info = JSON.parse(window.AndroidBridge.getAppInfo()); } catch(e) {}
    }
    var curUrl = (P.settings && P.settings.ota_url) ? P.settings.ota_url : DEFAULT_URL;
    var curTok = (P.settings && P.settings.ota_token) ? P.settings.ota_token : "";

    var box = document.createElement("div");
    box.className = "card b-gold";
    box.innerHTML =
      '<div class="between" style="margin-bottom:6px;">' +
        '<div class="h2" style="color:var(--gold);margin:0;">⚡ Tek Tıkla Güncelleme (OTA)</div>' +
        '<span class="tag" style="background:' + (info.isOta ? "var(--green)" : "var(--accent)") + ';">' +
          (info.isOta ? "OTA Aktif" : "APK v" + UI_VER) +
        '</span>' +
      '</div>' +
      '<div class="muted" style="margin-bottom:10px;">' +
        (info.isOta && info.otaDate ? "Son OTA güncelleme: <strong>" + esc(info.otaDate) + "</strong><br>" : "") +
        'Yeni APK kurmadan GitHub üzerindeki güncel arayüz ve soruları indirir. İndirdikten sonra yine tamamen internetsiz çalışır.' +
      '</div>' +
      '<label class="muted">GitHub Raw index.html Linki</label>' +
      '<input class="input" id="otaUrlIn" style="margin:4px 0 8px;font-size:12px;" value="' + esc(curUrl) + '">' +
      '<label class="muted">GitHub Token (Repo Public ise boş bırak, Private ise gir)</label>' +
      '<input class="input" type="password" id="otaTokIn" style="margin:4px 0 10px;font-size:13px;" value="' + esc(curTok) + '" placeholder="ghp_... (opsiyonel)">' +
      '<button class="btn full" id="btnOtaPull">🔄 Güncellemeyi İndir & Uygula</button>' +
      '<div id="otaStatus" class="muted" style="margin-top:8px;font-weight:700;"></div>' +
      (info.isOta ? '<button class="btn sec sm full" style="margin-top:8px;" id="btnOtaReset">↩ Yerleşik APK Sürümüne Dön</button>' : '');

    M.insertBefore(box, M.firstChild);

    document.getElementById("btnOtaPull").onclick = function() {
      var u = document.getElementById("otaUrlIn").value.trim();
      var t = document.getElementById("otaTokIn").value.trim();
      if (!u || !/^https?:\/\//i.test(u)) {
        toast("Geçerli bir https:// linki gir", "--red", "bad");
        return;
      }
      P.settings.ota_url = u;
      P.settings.ota_token = t;
      saveProgress();
      if (!hasBridge || typeof window.AndroidBridge.downloadOtaUpdate !== "function") {
        toast("Bu özellik sadece Android uygulamasında çalışır.", "--gold");
        return;
      }
      var btn = document.getElementById("btnOtaPull");
      var st = document.getElementById("otaStatus");
      btn.disabled = true;
      btn.textContent = "⏳ İndiriliyor...";
      st.style.color = "var(--gold)";
      st.textContent = "GitHub sunucusuna bağlanılıyor...";
      window.AndroidBridge.downloadOtaUpdate(u, t);
    };

    var rst = document.getElementById("btnOtaReset");
    if (rst) {
      rst.onclick = function() {
        saveProgress();
        window.AndroidBridge.resetOtaUpdate();
      };
    }
  };
})();
</script>
